apiVersion: v1
kind: Service
metadata:
  name: {{ include "niral-one.fullname" . }}
  labels:
    {{- include "niral-one.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "niral-one.selectorLabels" . | nindent 4 }}
