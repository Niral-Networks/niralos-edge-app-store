# ==============================================================================
# GLOBAL SETTINGS
# Image pull secrets and global Kubernetes settings
# ==============================================================================
global:
  imagePullSecrets:
  - name: dockerhub-secret

# ==============================================================================
# 5G CORE NETWORK
# PLMN, TAC, and network slice configuration
# ==============================================================================
coreNetwork:
  # PLMN identity (MCC/MNC)
  plmn:
    mcc: '001'
    mnc: '01'
  # Tracking Area configuration
  tai:
    tac: 1
  # Supported network slices
  slices:
  - sst: 1
    sd: '000001'
  - sst: 1
    sd: '000002'
  # NSSF slice configuration
  nssfSlices:
  - sst: 1
    sd: '000001'
  - sst: 1
    sd: '000002'

# ==============================================================================
# NETWORKING / MULTUS
# macvlan configuration and secondary network attachments
# ==============================================================================
networking:
  # macvlan interface settings
  macvlan:
    master: enp6s19
    mode: bridge
  # Multus network attachments
  attachments:
    upf:
      enabled: true
      name: macvlan-conf
      ips: 192.168.0.75/16
    n3iwf:
      enabled: true
      name: macvlan-conf
      ips: 192.168.0.79/16

# ==============================================================================
# CONTAINER IMAGES
# Images used by NiralOS and supporting components
# ==============================================================================
images:
  nrf: niralnetworks/niralos-5g-core:3.0.8.0-beta
  scp: niralnetworks/niralos-5g-core:3.0.8.0-beta
  amf: niralnetworks/niralos-5g-core:3.0.8.0-beta
  ausf: niralnetworks/niralos-5g-core:3.0.8.0-beta
  udr: niralnetworks/niralos-5g-core:3.0.8.0-beta
  udm: niralnetworks/niralos-5g-core:3.0.8.0-beta
  pcf: niralnetworks/niralos-5g-core:3.0.8.0-beta
  bsf: niralnetworks/niralos-5g-core:3.0.8.0-beta
  nssf: niralnetworks/niralos-5g-core:3.0.8.0-beta
  smf: niralnetworks/niralos-5g-core:3.0.8.0-beta
  upf: niralnetworks/niralos-5g-core:3.0.8.0-beta
  chf: niralnetworks/niralos-nfs:chf-new-WPITS
  nwdaf: niralnetworks/niralos-nfs:3.0.4.3-notls
  nef: niralnetworks/niralos-nfs:3.0.4.3-notls
  n3iwf: niralnetworks/niralos-n3iwf:2.7.2.2
  rtpengine: niralnetworks/niralos-rtp-engine:2.3.1-alpha
  dns: niralnetworks/niralos-dns:2.2.5
  scscf: niralnetworks/niralos-ims:3.0.7.1-alpha
  icscf: niralnetworks/niralos-ims:3.0.7.1-alpha
  pcscf: niralnetworks/niralos-ims:3.0.7.1-alpha
  pyhss: niralnetworks/niralos-hss:2.2.5
  smsc: niralnetworks/niralos-ims:3.0.7.1-alpha
  minio: niralnetworks/niralos-minio:v2.5
  mongo: mongo:6.0
  mysql: niralnetworks/niralos-mysql:3.0.1
  postgres: postgres:15
  timescaledb: timescale/timescaledb:latest-pg14
  keycloak: niralnetworks/niralos-keycloak-sdn:3.0.9
  sdn: niralnetworks/niralos-local-sdn:NIGHTLY_2026-09-16_04-00-04
  busybox: busybox:1.36

# ==============================================================================
# REPLICA COUNTS
# Number of Kubernetes replicas for each component
# ==============================================================================
replicas:
  nrf: 1
  scp: 1
  amf: 1
  ausf: 1
  udr: 1
  udm: 1
  pcf: 1
  bsf: 1
  nssf: 1
  smf: 1
  upf: 1
  chf: 1
  nwdaf: 1
  nef: 1
  n3iwf: 1
  rtpengine: 1
  dns: 1
  scscf: 1
  icscf: 1
  pcscf: 1
  pyhss: 1
  smsc: 1
  minio: 1
  mongo: 1
  mysql: 1
  postgres: 1
  timescaledb: 1
  keycloak: 1
  sdn: 1

# ==============================================================================
# WORKLOAD ENVIRONMENT
# Component-specific environment and runtime configuration
# ==============================================================================
workloadEnv:
  # NRF workload settings
  nrf:
    COMPONENT_NAME: nrf-1
  # SCP workload settings
  scp:
    COMPONENT_NAME: scp-1
  # AMF workload settings
  amf:
    COMPONENT_NAME: amf-1
    CORE_PATTERN: /mnt/core_dump/core.%e.%p.%t
  # UPF workload settings
  upf:
    UPF_ADVERTISE_IP: 192.168.0.17
    COMPONENT_NAME: upf-1
    CORE_PATTERN: /mnt/core_dump/core.%e.%p.%t
  # CHF workload settings
  chf:
    NRF_IP: niralos-nrf-1
    COMPONENT_NAME: chf-1
    CORE_PATTERN: /tmp/core.%e.%p
  # NWDAF workload settings
  nwdaf:
    NRF_IP: niralos-nrf-1
  # NEF workload settings
  nef:
    COMPONENT_NAME: nef-1
    CORE_PATTERN: /tmp/core.%e.%p
  # N3IWF workload settings
  n3iwf:
    STARTUP_DELAY: 120
    N3IWF_IP: 192.168.0.79
    AMF_IP: 192.168.0.17
    COMPONENT_NAME: n3iwf-1
    CORE_PATTERN: /tmp/core.%e.%p
  # RTPEngine workload settings
  rtpengine:
    TABLE: '-1'
    PORT_MIN: '49000'
    PORT_MAX: '49050'
    TOS: '184'
    NO_FALLBACK: 'no'
    PIDFILE: /run/ngcp-rtpengine-daemon.pid
    SITE_ID: 'Bangalore'
  # DNS workload settings
  dns:
    TIMESCALEDB_IP: timescaledb
    PCRF_IP: 172.22.0.8
    ICSCF_IP: icscf-service
    ICSCF_BIND_PORT: '4060'
    PYHSS_IP: pyhss
    PYHSS_BIND_PORT: '3868'
    SCSCF_IP: scscf-service
    SCSCF_BIND_PORT: '3870'
    PCSCF_IP: pcscf-service
    PCSCF_BIND_PORT: '3871'
    SMSC_IP: smsc-service
    SMSC_BIND_PORT: '7090'
    RTPENGINE_IP: rtpengine-service
    MYSQL_IP: mysql-service
    MYSQL_PORT: '3306'
  # S-CSCF workload settings
  scscf:
    COMPONENT_NAME: scscf-1
  # I-CSCF workload settings
  icscf:
    COMPONENT_NAME: icscf-1
  # P-CSCF workload settings
  pcscf:
    COMPONENT_NAME: pcscf-1
    DEPLOY_MODE: 5G
    PCSCF_N5_ENABLE: '1'
    RTPENGINE_IP: rtpengine-service
    SCP_IP: nrf-service
    UPF_IP: upf-service
  # PyHSS workload settings
  pyhss:
    COMPONENT_NAME: pyhss
    PYHSS_BIND_PORT: '3868'
  # SMSC workload settings
  smsc:
    COMPONENT_NAME: smsc-1
  # MinIO workload settings
  minio:
    MINIO_ROOT_USER: admin
  # PostgreSQL workload settings
  postgres:
    POSTGRES_DB: keycloak
    POSTGRES_USER: keycloak
  # TimescaleDB workload settings
  timescaledb:
    POSTGRES_USER: timescale_user
    POSTGRES_DB: timescale_db
  # Keycloak workload settings
  keycloak:
    KC_DB: postgres
    KC_DB_URL_HOST: postgres
    KC_DB_URL_DATABASE: keycloak
    KC_DB_USERNAME: keycloak
    KC_BOOTSTRAP_ADMIN_USERNAME: admin
    SUPER_ADMIN_EMAIL: admin@niralnetworks.com
    SUPER_ADMIN_FIRST_NAME: Admin
    SUPER_ADMIN_LAST_NAME: User
    SUPER_ADMIN_CORPORATE_ID_NUMBER: CIN001
    SUPER_ADMIN_DOB: 01/01/1990
    SUPER_ADMIN_PHONE_NUMBER: '+910000000000'
    KC_HTTP_ENABLED: 'true'
    KC_HOSTNAME_STRICT: 'false'

# ==============================================================================
# CORE ENVIRONMENT
# Shared environment values used by core-network components
# ==============================================================================
coreEnv:
  TIMESCALEDB_IP: timescaledb
  PCRF_IP: 172.22.0.50
  PCSCF_IP: pcscf-service
  SMF_DNS1: 8.8.8.8
  SMF_DNS2: 8.8.4.4
  UE_IPV4_INTERNET: 10.101.0.0/16
  UE_IPV4_IMS: 10.102.0.0/16
  DEPLOY_MODE: 5G
  PCRF_BIND_PORT: '3868'
  LD_LIBRARY_PATH: /niralos/install/lib/x86_64-linux-gnu
  MAX_NUM_UE: '1024'
  CORE_PATTERN: /mnt/core_dump/core.%e.%p.%t
  ICSCF_BIND_PORT: '3869'
  PYHSS_BIND_PORT: '3868'
  MYSQL_IP: mysql
  MYSQL_PORT: '3306'
  SITE_ID: "Bangalore"
  SITE_ID_CORE: "4f010fed-0edb-4376-9519-b71045b86b3e"

# ==============================================================================
# STORAGE
# PVC definitions and host filesystem mappings
# ==============================================================================
storage:
  createStorageClass: true
  # Embedded Rancher Local Path Provisioner
  localPathProvisioner:
    # Deployed directly in the same namespace as niralos-5gcore
    enabled: true
    image: rancher/local-path-provisioner:v0.0.37
    hostPath: /opt/local-path-provisioner
    helperImage: busybox:1.36
  # PersistentVolumeClaim definitions
  pvcs:
    minio-data:
      storageClass: niralos-local-path
      size: 1Gi
    mongodb-data:
      storageClass: niralos-local-path
      size: 1Gi
    mongodb-config:
      storageClass: niralos-local-path
      size: 1Gi
    mysql-data:
      storageClass: niralos-local-path
      size: 1Gi
    postgres-data:
      storageClass: niralos-local-path
      size: 5Gi
    timescaledb-data:
      storageClass: niralos-local-path
      size: 2Gi
    keycloak-data:
      storageClass: niralos-local-path
      size: 1Gi
    niralos-config-data:
      storageClass: niralos-local-path
      size: 100Mi
  # Host path mount definitions
  hostPaths:
    niralos-upf.logs:
      path: /home/user/core-logs
      type: DirectoryOrCreate
    niralos-upf.core-dumps:
      path: /home/user/niral_config/core_dumps
      type: DirectoryOrCreate
    niralos-nef.niral-config:
      path: /home/user/niral_config
      type: null
    niralos-n3iwf.lib-modules:
      path: /lib/modules
      type: null
    niralos-dns.timezone:
      path: /etc/timezone
      type: File
    niralos-dns.localtime:
      path: /etc/localtime
      type: File
    niralos-sdn.niral-logs:
      path: /home/user/niral_config/logs
      type: DirectoryOrCreate
    niralos-sdn.machine-id:
      path: /etc/machine-id
      type: File

