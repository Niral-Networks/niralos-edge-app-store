apiVersion: v1
kind: ConfigMap
metadata:
  name: rtpengine-config
  namespace: {{ .Release.Namespace }}
data:

  rtpengine_init.sh: |
    #!/bin/bash

    set -x

    RUNTIME=${1:-rtpengine}

    mkdir -p /etc/rtpengine

    # Copy RTPengine configuration
    cp /mnt/rtpengine/rtpengine.conf /etc/rtpengine/rtpengine.conf

    # Replace Kubernetes runtime values
    sed -i "s|RTPENGINE_IP|${RTPENGINE_IP}|g" /etc/rtpengine/rtpengine.conf
    sed -i "s|TIMESCALEDB_IP|${TIMESCALEDB_IP}|g" /etc/rtpengine/rtpengine.conf

    [ -z "$INTERFACE" ] && INTERFACE="${RTPENGINE_IP}"
    [ -z "$TABLE" ] && TABLE="0"
    [ -z "$LISTEN_NG" ] && LISTEN_NG="${RTPENGINE_IP}:2223"
    [ -z "$PORT_MIN" ] && PORT_MIN="30000"
    [ -z "$PORT_MAX" ] && PORT_MAX="40000"
    [ -z "$TOS" ] && TOS="184"
    [ -z "$PIDFILE" ] && PIDFILE="/run/ngcp-rtpengine-daemon.pid"
    [ -z "$CONFIG_FILE" ] && CONFIG_FILE="/etc/rtpengine/rtpengine.conf"

    LISTEN_CLI="${RTPENGINE_IP}:2224"

    RTPENGINE_SERVICE_IP=$(getent hosts rtpengine-service | awk '{print $1}')

    echo "RTPengine Service IP: ${RTPENGINE_SERVICE_IP}"
    sed -i "s|RTPENGINE_SERVICE_IP|${RTPENGINE_SERVICE_IP}|g" /etc/rtpengine/rtpengine.conf


    OPTIONS=""
    OPTIONS="$OPTIONS --interface=$INTERFACE"
    OPTIONS="$OPTIONS --listen-ng=$LISTEN_NG"
    OPTIONS="$OPTIONS --listen-cli=$LISTEN_CLI"
    OPTIONS="$OPTIONS --pidfile=$PIDFILE"
    OPTIONS="$OPTIONS --config-file=$CONFIG_FILE"
    OPTIONS="$OPTIONS --port-min=$PORT_MIN"
    OPTIONS="$OPTIONS --port-max=$PORT_MAX"
    OPTIONS="$OPTIONS --table=$TABLE"
    OPTIONS="$OPTIONS --tos=$TOS"
    OPTIONS="$OPTIONS --foreground"

    if test "$NO_FALLBACK" = "yes"; then
        OPTIONS="$OPTIONS --no-fallback"
    fi

    if [[ -n "$UE_IPV4_IMS" ]]; then

        GATEWAY=$(ip route | awk '/^default/ {print $3; exit}')

        echo "RTPengine Gateway: $GATEWAY"
        echo "IMS UE Network: $UE_IPV4_IMS"
        echo "UPF Service IP: $UPF_SERVICE_IP"

        if [[ -n "$GATEWAY" ]]; then

        # Add route towards IMS UE network
        ip route add "$UE_IPV4_IMS" via "$GATEWAY" 2>/dev/null || true

        echo "Route added:"
        echo "$UE_IPV4_IMS via $GATEWAY"

        else

            echo "ERROR: Could not find default gateway"

        fi

    fi

    echo "Final route:"
    ip route show "${UE_IPV4_IMS}"

    set +e

    # Check kernel module
    if lsmod | grep -q xt_RTPENGINE; then
        echo "xt_RTPENGINE kernel module already loaded."
    else
        modprobe xt_RTPENGINE
    fi

    # Remove old RTPengine kernel table
    if [ -e /proc/rtpengine/control ]; then
        echo "del $TABLE" > /proc/rtpengine/control 2>/dev/null
    fi

    # IPv4 RTPengine iptables rules
    iptables -N rtpengine 2>/dev/null

    iptables -D INPUT -j rtpengine 2>/dev/null
    iptables -I INPUT -j rtpengine

    iptables -D rtpengine -p udp -j RTPENGINE --id "$TABLE" 2>/dev/null
    iptables -I rtpengine -p udp -j RTPENGINE --id "$TABLE"

    iptables-save > /etc/iptables.rules

    # IPv6 RTPengine rules
    ip6tables -N rtpengine 2>/dev/null

    ip6tables -D INPUT -j rtpengine 2>/dev/null
    ip6tables -I INPUT -j rtpengine

    ip6tables -D rtpengine -p udp -j RTPENGINE --id "$TABLE" 2>/dev/null
    ip6tables -I rtpengine -p udp -j RTPENGINE --id "$TABLE"

    ip6tables-save > /etc/ip6tables.rules

    echo "========================================"
    echo "        Niralos RTPengine"
    echo "========================================"
    echo "RTPENGINE_IP=$RTPENGINE_IP"
    echo "INTERFACE=$INTERFACE"
    echo "LISTEN_NG=$LISTEN_NG"
    echo "LISTEN_CLI=$LISTEN_CLI"
    echo "PORT_MIN=$PORT_MIN"
    echo "PORT_MAX=$PORT_MAX"
    echo "TABLE=$TABLE"
    echo "UPF_IP=$UPF_IP"
    echo "UE_IPV4_IMS=$UE_IPV4_IMS"
    echo "TIMESCALEDB_IP=$TIMESCALEDB_IP"
    echo "========================================"

    set -x

    exec $RUNTIME $OPTIONS


  rtpengine.conf: |
    [rtpengine]

    table = 0

    # Kubernetes RTPengine Pod IP
    interface = RTPENGINE_IP

    templates = templates

    log-level = 7

    # NG control
    listen-ng = RTPENGINE_IP:2223

    # HTTP / Prometheus
    listen-http = RTPENGINE_IP:2225;0.0.0.0:9092

    # CLI
    listen-cli = RTPENGINE_IP:2224

    timeout = 60
    silent-timeout = 3600

    tos = 184

    delete-delay = 1

    port-min = 30000
    port-max = 40000

    recording-dir = /var/spool/rtpengine
    recording-method = proc

    # TimescaleDB
    timescaledb-host = TIMESCALEDB_IP
    timescaledb-port = 5432
    timescaledb-user = {{ .Values.secrets.timescaledb.username }}
    timescaledb-pass = {{ .Values.secrets.timescaledb.password }}
    timescaledb-db = {{ .Values.secrets.timescaledb.database }}

    mos = LQ


    [templates]

    WebRTC = transport-protocol=UDP/TLS/RTP/SAVPF ICE=force trickle-ICE rtcp-mux=[offer require] no-rtcp-attribute SDES=off generate-mid

---

apiVersion: v1
kind: ConfigMap

metadata:
  name: dns-config
  namespace: {{ .Release.Namespace }}
data:

  dns_init.sh: |
    #!/bin/bash

    set -e

    echo "========================================"
    echo "        Niralos DNS Initialization"
    echo "========================================"

    echo "MCC=${MCC}"
    echo "MNC=${MNC}"
    echo "DNS_IP=${DNS_IP}"
    echo "PCRF_IP=${PCRF_IP}"
    echo "PCSCF_IP=${PCSCF_IP}"
    echo "ICSCF_IP=${ICSCF_IP}"
    echo "SCSCF_IP=${SCSCF_IP}"
    echo "PYHSS_IP=${PYHSS_IP}"
    echo "SMSC_IP=${SMSC_IP}"

    echo "----------------------------------------"
    echo "Checking required variables..."
    echo "----------------------------------------"

    required_vars=(
      MCC
      MNC
      DNS_IP
      PCRF_IP
      PCSCF_IP
      ICSCF_IP
      SCSCF_IP
      PYHSS_IP
      SMSC_IP
    )

    for var in "${required_vars[@]}"; do
      if [ -z "${!var}" ]; then
        echo "ERROR: Required variable ${var} is empty"
        exit 1
      fi
    done

    echo "All required variables are present."

    echo "----------------------------------------"
    echo "Copying BIND configuration..."
    echo "----------------------------------------"

    cp /mnt/dns/epc_zone /etc/bind/epc_zone
    cp /mnt/dns/ims_zone /etc/bind/ims_zone
    cp /mnt/dns/pub_3gpp_zone /etc/bind/pub_3gpp_zone
    cp /mnt/dns/e164.arpa /etc/bind/e164.arpa
    cp /mnt/dns/named.conf /etc/bind/named.conf

    echo "BIND files copied."

    echo "----------------------------------------"
    echo "Generating 3GPP domains..."
    echo "----------------------------------------"

    if [ "${#MNC}" -eq 3 ]; then

      EPC_DOMAIN="epc.mnc${MNC}.mcc${MCC}.3gppnetwork.org"
      IMS_DOMAIN="ims.mnc${MNC}.mcc${MCC}.3gppnetwork.org"
      PUB_3GPP_DOMAIN="mnc${MNC}.mcc${MCC}.pub.3gppnetwork.org"

    else

      EPC_DOMAIN="epc.mnc0${MNC}.mcc${MCC}.3gppnetwork.org"
      IMS_DOMAIN="ims.mnc0${MNC}.mcc${MCC}.3gppnetwork.org"
      PUB_3GPP_DOMAIN="mnc0${MNC}.mcc${MCC}.pub.3gppnetwork.org"

    fi

    # Resolve Kubernetes Service names to their current ClusterIP
    echo "Resolving Kubernetes service IPs..."

    PCSCF_IP=$(getent hosts pcscf-service | awk '{print $1}')
    ICSCF_IP=$(getent hosts icscf-service | awk '{print $1}')
    SCSCF_IP=$(getent hosts scscf-service | awk '{print $1}')
    PYHSS_IP=$(getent hosts pyhss | awk '{print $1}')
    SMSC_IP=$(getent hosts smsc-service | awk '{print $1}')

    echo "PCSCF_IP=${PCSCF_IP}"
    echo "ICSCF_IP=${ICSCF_IP}"
    echo "SCSCF_IP=${SCSCF_IP}"
    echo "PYHSS_IP=${PYHSS_IP}"
    echo "SMSC_IP=${SMSC_IP}"

    echo "EPC_DOMAIN=${EPC_DOMAIN}"
    echo "IMS_DOMAIN=${IMS_DOMAIN}"
    echo "PUB_3GPP_DOMAIN=${PUB_3GPP_DOMAIN}"

    echo "----------------------------------------"
    echo "Updating EPC zone..."
    echo "----------------------------------------"

    sed -i "s|EPC_DOMAIN|${EPC_DOMAIN}|g" /etc/bind/epc_zone
    sed -i "s|DNS_IP|${DNS_IP}|g" /etc/bind/epc_zone
    sed -i "s|PCRF_IP|${PCRF_IP}|g" /etc/bind/epc_zone

    echo "----------------------------------------"
    echo "Updating IMS zone..."
    echo "----------------------------------------"

    sed -i "s|IMS_DOMAIN|${IMS_DOMAIN}|g" /etc/bind/ims_zone
    sed -i "s|DNS_IP|${DNS_IP}|g" /etc/bind/ims_zone
    sed -i "s|PCSCF_IP|${PCSCF_IP}|g" /etc/bind/ims_zone
    sed -i "s|ICSCF_IP|${ICSCF_IP}|g" /etc/bind/ims_zone
    sed -i "s|SCSCF_IP|${SCSCF_IP}|g" /etc/bind/ims_zone
    sed -i "s|PYHSS_IP|${PYHSS_IP}|g" /etc/bind/ims_zone
    sed -i "s|SMSC_IP|${SMSC_IP}|g" /etc/bind/ims_zone

    echo "----------------------------------------"
    echo "Updating Public 3GPP zone..."
    echo "----------------------------------------"

    sed -i "s|PUB_3GPP_DOMAIN|${PUB_3GPP_DOMAIN}|g" /etc/bind/pub_3gpp_zone
    sed -i "s|DNS_IP|${DNS_IP}|g" /etc/bind/pub_3gpp_zone

    echo "----------------------------------------"
    echo "Updating E.164 zone..."
    echo "----------------------------------------"

    sed -i "s|IMS_DOMAIN|${IMS_DOMAIN}|g" /etc/bind/e164.arpa
    sed -i "s|DNS_IP|${DNS_IP}|g" /etc/bind/e164.arpa

    echo "----------------------------------------"
    echo "Updating named.conf..."
    echo "----------------------------------------"

    sed -i "s|EPC_DOMAIN|${EPC_DOMAIN}|g" /etc/bind/named.conf
    sed -i "s|IMS_DOMAIN|${IMS_DOMAIN}|g" /etc/bind/named.conf
    sed -i "s|PUB_3GPP_DOMAIN|${PUB_3GPP_DOMAIN}|g" /etc/bind/named.conf

    echo "========================================"
    echo "Generated DNS configuration"
    echo "========================================"

    echo "--- EPC zone ---"
    cat /etc/bind/epc_zone

    echo "--- IMS zone ---"
    cat /etc/bind/ims_zone

    echo "--- Public 3GPP zone ---"
    cat /etc/bind/pub_3gpp_zone

    echo "--- E164 zone ---"
    cat /etc/bind/e164.arpa

    echo "----------------------------------------"
    echo "Checking BIND configuration..."
    echo "----------------------------------------"

    named-checkconf /etc/bind/named.conf

    named-checkzone "${EPC_DOMAIN}" /etc/bind/epc_zone
    named-checkzone "${IMS_DOMAIN}" /etc/bind/ims_zone
    named-checkzone "${PUB_3GPP_DOMAIN}" /etc/bind/pub_3gpp_zone
    named-checkzone "e164.arpa" /etc/bind/e164.arpa

    echo "========================================"
    echo "DNS configuration validation successful"
    echo "========================================"


  epc_zone: |
    $ORIGIN EPC_DOMAIN.
    $TTL 1W

    @ IN SOA localhost. root.localhost. (
        1
        3H
        15M
        1W
        1D
    )

    @ IN NS epcns.
    epcns IN A DNS_IP

    pcrf IN A PCRF_IP


  ims_zone: |
    $ORIGIN IMS_DOMAIN.
    $TTL 1W

    @ IN SOA localhost. root.localhost. (
        1
        3H
        15M
        1W
        1D
    )

    @ IN NS ns.
    ns IN A DNS_IP

    @ IN A ICSCF_IP
    pcscf IN A PCSCF_IP

    _sip._udp.pcscf IN SRV 0 0 5060 pcscf
    _sip._tcp.pcscf IN SRV 0 0 5060 pcscf

    icscf IN A ICSCF_IP

    _sip._udp IN SRV 0 0 4060 icscf
    _sip._tcp IN SRV 0 0 4060 icscf

    scscf IN A SCSCF_IP

    _sip._udp.scscf IN SRV 0 0 6060 scscf
    _sip._tcp.scscf IN SRV 0 0 6060 scscf

    hss IN A PYHSS_IP

    smsc IN A SMSC_IP

    _sip._udp.smsc IN SRV 0 0 7090 smsc
    _sip._tcp.smsc IN SRV 0 0 7090 smsc


  pub_3gpp_zone: |
    $ORIGIN PUB_3GPP_DOMAIN.
    $TTL 1W

    @ IN SOA localhost. root.localhost. (
        1
        3H
        15M
        1W
        1D
    )

    @ IN NS pubns.
    pubns IN A DNS_IP


  e164.arpa: |
    $ORIGIN e164.arpa.
    $TTL 1h
    @ IN SOA ns.e164.arpa. root.e164.arpa. (
                                                            2009010918 ;serial
                                                            3600 ;refresh
                                                            3600 ;retry
                                                            3600 ;expire
                                                            3600 ;minimum TTL
    )
    @ IN NS e164.arpa.
    @ IN A DNS_IP
    
    ; Wildcard to match any tel:+xxxx and change to sip:xxxx@IMS_DOMAIN
    * IN NAPTR 10 100 "u" "E2U+sip" "!(^.*$)!sip:\\1@IMS_DOMAIN!" .
    * IN NAPTR 20 100 "u" "E2U+sip" "!(^.*$)!sip:+\\1@IMS_DOMAIN!" .

  named.conf: |
    options {
        directory "/var/cache/bind";

        forwarders {
            8.8.8.8;
        };

        dnssec-validation no;

        allow-query { any; };

        auth-nxdomain no;

        listen-on { any; };

        listen-on-v6 { any; };
    };

    zone "IMS_DOMAIN" {
        type master;
        file "/etc/bind/ims_zone";
    };

    zone "EPC_DOMAIN" {
        type master;
        file "/etc/bind/epc_zone";
    };

    zone "PUB_3GPP_DOMAIN" {
        type master;
        file "/etc/bind/pub_3gpp_zone";
    };

    zone "e164.arpa" {
        type master;
        file "/etc/bind/e164.arpa";
    };
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: icscf-config
  namespace: {{ .Release.Namespace }}
data:
  icscf_init.sh: |
    #!/bin/bash

    [ ${#MNC} == 3 ] && IMS_DOMAIN="ims.mnc${MNC}.mcc${MCC}.3gppnetwork.org" || IMS_DOMAIN="ims.mnc0${MNC}.mcc${MCC}.3gppnetwork.org"

    mkdir -p /etc/kamailio_icscf
    cp /mnt/icscf/icscf.cfg /etc/kamailio_icscf
    cp /mnt/icscf/icscf.xml /etc/kamailio_icscf
    cp /mnt/icscf/kamailio_icscf.cfg /etc/kamailio_icscf

    while ! mysqladmin ping -h ${MYSQL_IP} --silent; do
            sleep 5;
    done

    sleep 10;

    # Export root password for database setup
    export MYSQL_PWD="{{ .Values.secrets.mysql.rootPassword }}"

    # Create ICSCF database, populate tables and grant privileges idempotently
    mysql -u root -h ${MYSQL_IP} -e "CREATE DATABASE IF NOT EXISTS icscf;" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} icscf < /usr/local/src/kamailio/misc/examples/ims/icscf/icscf.sql 2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} -e "CREATE USER IF NOT EXISTS 'icscf'@'%' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.ims.imsUserPassword }}';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "CREATE USER IF NOT EXISTS 'provisioning'@'%' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.ims.provisioningPassword }}';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "CREATE USER IF NOT EXISTS 'icscf'@'$ICSCF_IP' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.ims.imsUserPassword }}';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "CREATE USER IF NOT EXISTS 'provisioning'@'$ICSCF_IP' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.ims.provisioningPassword }}';" 2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} -e "GRANT ALL ON icscf.* TO 'icscf'@'%';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "GRANT ALL ON icscf.* TO 'icscf'@'$ICSCF_IP';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "GRANT ALL ON icscf.* TO 'provisioning'@'%';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "GRANT ALL ON icscf.* TO 'provisioning'@'$ICSCF_IP';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "FLUSH PRIVILEGES;" 2>/dev/null || true

    export PGPASSWORD="{{ .Values.secrets.timescaledb.password }}"
    psql -U {{ .Values.secrets.timescaledb.username }} -d {{ .Values.secrets.timescaledb.database }} -h ${TIMESCALEDB_IP} -p 5432 -f /usr/local/src/kamailio/utils/kamctl/postgres/standard-create.sql 2>/dev/null || true
    psql -U {{ .Values.secrets.timescaledb.username }} -d {{ .Values.secrets.timescaledb.database }} -h ${TIMESCALEDB_IP} -p 5432 -f /usr/local/src/kamailio/utils/kamctl/postgres/siptrace-icscf.sql 2>/dev/null || true

    DOMAIN_PRESENT=`mysql -u root -h ${MYSQL_IP} icscf -s -N -e "SELECT count(*) FROM nds_trusted_domains WHERE trusted_domain='$IMS_DOMAIN';"`
    if [[ "$DOMAIN_PRESENT" == 0 ]]; then
            mysql -u root -h ${MYSQL_IP} icscf -e "INSERT INTO nds_trusted_domains (trusted_domain) VALUES ('$IMS_DOMAIN');" 2>/dev/null || true
    fi

    URI_PRESENT=`mysql -u root -h ${MYSQL_IP} icscf -s -N -e "SELECT count(*) FROM s_cscf WHERE s_cscf_uri='sip:scscf.$IMS_DOMAIN:6060';"`
    if [[ "$URI_PRESENT" == 0 ]]; then
            mysql -u root -h ${MYSQL_IP} icscf -e "INSERT INTO s_cscf (name, s_cscf_uri) VALUES ('First and only S-CSCF', 'sip:scscf.$IMS_DOMAIN:6060');" 2>/dev/null || true
    fi

    SCSCF_ID=`mysql -u root -h ${MYSQL_IP} icscf -s -N -e "SELECT id FROM s_cscf WHERE s_cscf_uri='sip:scscf.$IMS_DOMAIN:6060' LIMIT 1;"`
    if [[ ! -z "$SCSCF_ID" ]]; then
            CAP_PRESENT=`mysql -u root -h ${MYSQL_IP} icscf -s -N -e "SELECT count(*) FROM s_cscf_capabilities WHERE id_s_cscf='$SCSCF_ID';"`
            if [[ "$CAP_PRESENT" == 0 ]]; then
                    mysql -u root -h ${MYSQL_IP} icscf -e "INSERT INTO s_cscf_capabilities (id_s_cscf, capability) VALUES ('$SCSCF_ID', 0),('$SCSCF_ID', 1);" 2>/dev/null || true
            fi
    fi

    unset MYSQL_PWD

    # Map the HSS hostname directly to the Kubernetes Service IP
    echo "${PYHSS_SERVICE_HOST} hss.${IMS_DOMAIN}" >> /etc/hosts

    sed -i 's|ICSCF_IP|'$ICSCF_IP'|g' /etc/kamailio_icscf/icscf.cfg
    sed -i 's|IMS_DOMAIN|'$IMS_DOMAIN'|g' /etc/kamailio_icscf/icscf.cfg
    sed -i 's|MYSQL_IP|'$MYSQL_IP'|g' /etc/kamailio_icscf/icscf.cfg

    sed -i 's|ICSCF_IP|'$ICSCF_IP'|g' /etc/kamailio_icscf/icscf.xml
    sed -i 's|IMS_DOMAIN|'$IMS_DOMAIN'|g' /etc/kamailio_icscf/icscf.xml
    sed -i 's|PYHSS_BIND_PORT|'$PYHSS_BIND_PORT'|g' /etc/kamailio_icscf/icscf.xml
    sed -i 's|ICSCF_BIND_PORT|'$ICSCF_BIND_PORT'|g' /etc/kamailio_icscf/icscf.xml

    sed -i 's|SITE_ID|'$SITE_ID'|g' /etc/kamailio_icscf/kamailio_icscf.cfg
    sed -i 's|TIMESCALEDB_IP|'$TIMESCALEDB_IP'|g' /etc/kamailio_icscf/kamailio_icscf.cfg

  icscf.cfg: |
    # SIP / UDP
    listen=udp:ICSCF_IP:4060
    # SIP / TCP
    listen=tcp:ICSCF_IP:4060

    alias=IMS_DOMAIN

    #!define NETWORKNAME "IMS_DOMAIN"
    #!define HOSTNAME "icscf.IMS_DOMAIN"

    #!subst "/NETWORKNAME/IMS_DOMAIN/"

    #!define ENUM_SUFFIX "IMS_DOMAIN."

    # SIP-Address of capturing node, if not set, capturing is disabled.
    #!define CAPTURE_NODE "sip:127.0.0.1:9060"

    # Connection URL for the database:
    #!define DB_URL "mysql://icscf:heslo@MYSQL_IP/icscf"

    # Enabled Features for this host:
    ##!define WITH_DEBUG
    #!define WITH_TCP
    ##!define WITH_TLS
    #!define WITH_XMLRPC
    ##!define PEERING
    ##!define FALLBACK_AUTH
    #!define WITH_HEALTH_CHECK_API

  icscf.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <DiameterPeer
            FQDN="icscf.IMS_DOMAIN"
            Realm="IMS_DOMAIN"
            Vendor_Id="10415"
            Product_Name="CDiameterPeer"
            AcceptUnknownPeers="1"
            DropUnknownOnDisconnect="1"
            Tc="30"
            Workers="16"
            QueueLength="32"
            TransactionTimeout="5"
            SessionsHashSize="128"
            DefaultAuthSessionTimeout="3600"
            MaxAuthSessionTimeout="3600"
    >
            <Peer FQDN="hss.IMS_DOMAIN" Realm="IMS_DOMAIN" port="3868"/>
            <Acceptor port="ICSCF_BIND_PORT" bind="ICSCF_IP"/>

            <Auth id="16777216" vendor="10415"/>
            <Auth id="16777216" vendor="4491"/>
            <Auth id="16777216" vendor="13019"/>
            <Auth id="16777216" vendor="0"/>
            <SupportedVendor vendor="10415" />
            <DefaultRoute FQDN="hss.IMS_DOMAIN" metric="10"/>
    </DiameterPeer>

  kamailio_icscf.cfg: |
    #!KAMAILIO

    system.shutdownmode = 0 desc "System shutdown mode"
    system.service = "Interrogating-CSCF" desc "Function of this server"

    include_file "icscf.cfg"

    #!define FLT_CAPTURE 1

    #!ifdef WITH_XMLRPC
    listen=tcp:127.0.0.1:4060
    #!endif

    debug=2
    log_stderror=no
    sip_warning=no

    user_agent_header="User-Agent: Niral I-CSCF"
    server_header="Server: Niral I-CSCF"

    auto_aliases=no
    dns_srv_lb=on
    dns_try_ipv6=on
    dns_try_naptr=no

    #!ifdef WITH_XMLRPC
    #!ifndef WITH_TCP
    #!define WITH_TCP
    #!endif
    #!ifndef TCP_PROCESSES
    #!define TCP_PROCESSES 3
    #!endif
    #!endif

    #!ifdef WITH_TCP
    tcp_connection_lifetime=3615
    #!ifdef TCP_PROCESSES
    tcp_children=TCP_PROCESSES
    #!endif
    #!else
    disable_tcp=yes
    #!endif

    #!ifdef WITH_HEALTH_CHECK_API
    tcp_accept_no_cl=yes
    #!endif

    check_via=no
    dns=on
    rev_dns=no
    children=4

    mpath="/usr/lib64/kamailio/modules_k/:/usr/lib64/kamailio/modules/:/usr/lib/kamailio/modules_k/:/usr/lib/kamailio/modules/:/usr/lib/x86_64-linux-gnu/kamailio/modules/:/usr/local/lib64/kamailio/modules"

    loadmodule "tm"
    loadmodule "sl"
    loadmodule "rr"
    loadmodule "pv"
    loadmodule "textops"
    loadmodule "maxfwd"
    loadmodule "sanity"
    loadmodule "siputils"
    loadmodule "kex"
    loadmodule "tmx"
    loadmodule "pike"
    loadmodule "corex"
    loadmodule "ctl"
    loadmodule "cfg_rpc"

    #!ifdef WITH_XMLRPC
    loadmodule "xmlrpc"
    #!endif

    loadmodule "sqlops.so"
    loadmodule "db_mysql"
    loadmodule "db_postgres.so"
    loadmodule "cdp.so"
    loadmodule "cdp_avp.so"
    loadmodule "xlog.so"
    loadmodule "ims_icscf.so"

    #!ifdef WITH_HEALTH_CHECK_API
    loadmodule "xhttp.so"
    #!endif

    #!ifdef CAPTURE_NODE
    loadmodule "siptrace.so"
    #!endif

    #!ifdef WITH_HEALTH_CHECK_API
    modparam("xhttp", "url_match", "^/health_Check")
    #!endif

    loadmodule "jsonrpcs.so"
    modparam("jsonrpcs", "pretty_format", 1)
    modparam("jsonrpcs", "fifo_name", "/var/run/kamailio/kamailio_rpc.fifo")
    modparam("jsonrpcs", "dgram_socket", "/var/run/kamailio/kamailio_rpc.sock")

    modparam("rr", "enable_full_lr", 1)
    modparam("cdp","config_file","/etc/kamailio_icscf/icscf.xml")
    modparam("ims_icscf","cxdx_dest_realm", NETWORKNAME)
    modparam("ims_icscf", "db_url", DB_URL)

    #!ifdef WITH_XMLRPC
    modparam("xmlrpc", "route", "XMLRPC");
    modparam("xmlrpc", "url_match", "^/RPC")
    #!endif

    modparam("ctl", "binrpc", "unix:/var/run/kamailio/kamailio_ctl")

    modparam("sqlops","sqlcon","cb=>postgres://{{ .Values.secrets.timescaledb.username }}:{{ .Values.secrets.timescaledb.password }}@TIMESCALEDB_IP/{{ .Values.secrets.timescaledb.database }}")
    modparam("sqlops", "connect_mode", 1)

    #!ifdef CAPTURE_NODE
    modparam("siptrace", "db_url", "postgres://{{ .Values.secrets.timescaledb.username }}:{{ .Values.secrets.timescaledb.password }}@TIMESCALEDB_IP/{{ .Values.secrets.timescaledb.database }}")
    modparam("siptrace", "table", "sip_trace_icscf")
    modparam("siptrace", "trace_table_avp", "$avp(siptrace_table)")
    modparam("siptrace", "duplicate_uri", CAPTURE_NODE)
    modparam("siptrace", "trace_id_avp", "$avp(trace_id)")
    modparam("siptrace", "site_id", "SITE_ID")
    modparam("siptrace", "trace_on", 1)
    modparam("siptrace", "trace_to_database", 1)
    modparam("siptrace", "trace_flag", FLT_CAPTURE)
    modparam("siptrace", "hep_mode_on", 1)
    #!endif

    modparam("tm", "failure_reply_mode", 3)
    modparam("tm", "fr_timer", 10000)
    modparam("tm", "fr_inv_timer", 120000)
    modparam("tm", "auto_inv_100", 0)

    route{
    #!ifdef CAPTURE_NODE
        setflag(FLT_CAPTURE);
        xlog("L_INFO", "SIPTRACE LOG: [$ci] $rm from $si:$sp to $ru\n");
    #!endif

            route(REQINIT);
            if (is_method("REGISTER")) {
                    route(register);
            }
            if (is_method("NOTIFY") && search("^(Event|o)([ \t]*):([ \t]*)reg")) {
                    if (!t_relay()) {
                            sl_reply_error();
                    }
                    exit;
            }
            if (is_method("INVITE|SUBSCRIBE|MESSAGE|INFO|PUBLISH|CANCEL")) {
                    route(initial_request);
            } else {
                    append_to_reply("Allow: INVITE,SUBSCRIBE,MESSAGE,INFO,PUBLISH,CANCEL\r\n");
                    send_reply("406","Initial Request Method not allowed at the I-CSCF");
                    break;
            }
    }

    route[REQINIT] {
            $var(used) = 1 - ($stat(free_size) / $stat(total_size));
            if ($var(used) > 95) {
                    send_reply("503", "Server overloaded");
                    exit;
            }
    #!ifdef CAPTURE_NODE
            if(isflagset(FLT_CAPTURE)){
                    route(SIPTRACE_CHECK);
            }
    #!endif
            if (!mf_process_maxfwd_header("10")) {
                    sl_send_reply("483","Too Many Hops");
                    exit;
            }
            if(!sanity_check("1511", "7")) {
                    xlog("Malformed SIP message from $si:$sp\n");
                    exit;
            }
            if (!has_totag() && ($sel(cfg_get.system.shutdownmode) > 0)) {
                    send_reply("503", "Server shutting down");
                    exit;
            }
            if (is_method("OPTIONS") && (uri==myself)) {
                    options_reply();
                    exit;
            }
            if (t_lookup_request()) {
                    exit;
            }
            if (is_method("INVITE|REGISTER")) {
                    send_reply("100", "Trying");
            }
    }

    route[SIPTRACE_CHECK] {
        $var(imsi)   = "";
        $var(msisdn) = "";
        $var(id)     = "";

        if ($hdr(P-Asserted-Identity) != "") {
            $var(id) = $hdr(P-Asserted-Identity);
        } else if ($hdr(From) != "") {
            $var(id) = $hdr(From);
        } else if ($hdr(To) != "") {
            $var(id) = $hdr(To);
        }

        if ($var(id) != "") {
            $var(id) = $(var(id){re.subst,/.*(sip|tel):([^@;>]+).*/\2/});
        }

        if ($var(id) =~ "^[0-9]{15}$") {
            $var(imsi) = $var(id);
        } else if ($var(id) =~ "^[0-9]{3,15}$") {
            $var(msisdn) = $var(id);
        }

        if ($var(imsi) == "" && $fU =~ "^[0-9]{15}$") {
            $var(imsi) = $fU;
        }

        xlog("L_INFO", "SIPTRACE: $rm parsed IMSI=<$var(imsi)> MSISDN=<$var(msisdn)> ID=<$var(id)> Call-ID=$ci\n");

        if ($var(imsi) == "" && $var(msisdn) == "") {
            return;
        }
            sql_query("cb",
            "SELECT trace_id, trace_status "
            "FROM ims_trace_filters "
            "WHERE (imsi='$var(imsi)' OR msisdn='$var(msisdn)') "
            "AND (expires_at IS NULL OR expires_at > now()) "
            "ORDER BY created_at DESC "
            "LIMIT 1",
            "ra");

        if ($dbr(ra=>rows) > 0) {
                if ($dbr(ra=>[0,1]) == 1) {
                        $avp(trace_id) = $dbr(ra=>[0,0]);
                        $avp(siptrace_table) = "sip_trace_icscf";
                        sip_trace();
                } else {
                        xlog("L_INFO", "SIPTRACE: disabled (status=0) for imsi=$var(imsi) msisdn=$var(msisdn)\n");
                }
        }
        sql_result_free("ra");
    }

    #!ifdef WITH_XMLRPC
    route[XMLRPC] {
            if ((method=="POST" || method=="GET")) {
                    if ($hdr(User-Agent) =~ "xmlrpclib")
                            set_reply_close();
                    set_reply_no_connect();
                    dispatch_rpc();
                    exit;
            }
            send_reply("403", "Forbidden");
            exit;
    }
    #!endif

    route[register] {
            t_set_fr(5000, 5000);
            if (I_scscf_select("0")) {
                    t_on_reply("register_reply");
                    t_on_failure("register_failure");
                    if (!t_relay()) {
                            send_reply("500","Error forwarding towards S-CSCF");
                    }
           } else {
                    I_scscf_drop();
                    if (!I_perform_user_authorization_request("REG_UAR_REPLY","0")) {
                            send_reply("500", "Error in Request");
                    }
            }
            exit;
    }

    route[REG_UAR_REPLY] {
        switch ($avp(s:uaa_return_code)){
                case 1:
                        if (I_scscf_select("0")){
                                t_on_failure("register_failure");
                                t_on_reply("register_reply");
                                if (!t_relay()) {
                                        t_reply("500", "Error forwarding to SCSCF");
                                }
                        } else {
                                I_scscf_drop();
                                t_reply("500", "Server error on SCSCF Select (UAR)");
                        }
                        break;
                case -1:
                        xlog("L_ERR", "UAR failure - error response sent from module\n");
                        break;
                case -2:
                        xlog("L_ERR", "UAR error - sending error response now\n");
                        t_reply("500", "UAR failed");
                        break;
                default:
                        xlog("L_ERR", "Unknown return code from UAR, value is [$avp(s:uaa_return_code)]\n");
                        t_reply("500", "Unknown response code from UAR");
                        break;
        }
    }

    onreply_route[register_reply] {
            if (!t_check_status("(408)|(480)")){
                    if (!t_check_status("(401)")){
                            I_scscf_drop();
                    }
            }
            break;
    }

    failure_route[register_failure] {
            if (t_branch_timeout() || t_check_status("([5-6][0-9][0-9])")){
                    if (I_scscf_select("1")) {
                            t_on_reply("register_reply");
                            t_on_failure("register_failure");
                            if (!t_relay()) {
                                    t_reply("500","Error forwarding towards next S-CSCF");
                                    break;
                            }
                            break;
                    } else {
                            t_reply("500", "Server error on UAR select next S-CSCF");
                            break;
                    }
            } else {
                    if (!t_check_status("(401)")){
                            I_scscf_drop();
                    }
                    break;
            }
    }

    route[initial_request] {
            I_perform_location_information_request("LIR_REPLY", "0");
    }

    route[LIR_REPLY] {
            if ($avp(lia_return_code) == 1) {
                    if (I_scscf_select("0")) {
                            t_on_reply("initial_request_reply");
                            t_on_failure("initial_request_failure");
                            if (!t_relay()) {
                                    t_reply("500","Error forwarding towards S-CSCF");
                                    break;
                            }
                            break;
                    } else {
                            I_scscf_drop();
                            t_reply("500", "Server error on LIR select S-CSCF");
                            break;
                    }
            } else {
                    t_reply("500", "Server error on LIR");
                    break;
            }
            break;
    }

    onreply_route[initial_request_reply] {
            if (!t_check_status("(408)")){
                    I_scscf_drop();
            }
            break;
    }

    onreply_route {
        if (isflagset(FLT_CAPTURE)) {
            $avp(siptrace_table) = "sip_trace_icscf";
            sip_trace();
        }
    }

    failure_route[initial_request_failure] {
            if (t_check_status("(408)")){
                    if (I_scscf_select("1")) {
                            t_on_reply("initial_request_reply");
                            t_on_failure("initial_request_failure");
                            if (!t_relay()) {
                                    t_reply("500","Error forwarding towards next S-CSCF");
                                    break;
                            }
                            break;
                    } else {
                            t_reply("500", "Server error on LIR select next S-CSCF");
                            break;
                    }
            } else {
                    I_scscf_drop();
            }
            break;
    }

    #!ifdef WITH_HEALTH_CHECK_API
    event_route[xhttp:request] {
        xhttp_reply("200", "OK", "text/html", "OK");
    }
    #!endif


---

apiVersion: v1
kind: ConfigMap
metadata:
  name: pcscf-config
  namespace: {{ .Release.Namespace }}
data:
  pcscf_init.sh: |
    #!/bin/bash

    sh -c "echo 1 > /proc/sys/net/ipv4/ip_nonlocal_bind"
    sh -c "echo 1 > /proc/sys/net/ipv6/ip_nonlocal_bind"

    [ ${#MNC} == 3 ] && EPC_DOMAIN="epc.mnc${MNC}.mcc${MCC}.3gppnetwork.org" || EPC_DOMAIN="epc.mnc0${MNC}.mcc${MCC}.3gppnetwork.org"
    [ ${#MNC} == 3 ] && IMS_DOMAIN="ims.mnc${MNC}.mcc${MCC}.3gppnetwork.org" || IMS_DOMAIN="ims.mnc0${MNC}.mcc${MCC}.3gppnetwork.org"

    echo ">>> CURRENT IMS_DOMAIN IS: $IMS_DOMAIN"

    mkdir -p /etc/kamailio_pcscf/route
    cp /mnt/pcscf/pcscf.cfg /etc/kamailio_pcscf
    cp /mnt/pcscf/pcscf.xml /etc/kamailio_pcscf
    cp /mnt/pcscf/kamailio_pcscf.cfg /etc/kamailio_pcscf

    # Use -L to dereference Kubernetes symlinks and copy the actual file contents
    cp -Lr /mnt/pcscf_route/* /etc/kamailio_pcscf/route/ 2>/dev/null || true
    cp -L /mnt/pcscf_extra/tls.cfg /etc/kamailio_pcscf/ 2>/dev/null || true
    cp -L /mnt/pcscf_extra/dispatcher.list /etc/kamailio_pcscf/ 2>/dev/null || true

    #PCSCF_IP=$(getent hosts pcscf-service.niralos.svc.cluster.local | awk '{print $1}')
    #ICSCF_IP=$(getent hosts icscf-service.niralos.svc.cluster.local | awk '{print $1}')
    #SCSCF_IP=$(getent hosts scscf-service.niralos.svc.cluster.local | awk '{print $1}')
    #PYHSS_IP=$(getent hosts pyhss.niralos.svc.cluster.local | awk '{print $1}')
    #SMSC_IP=$(getent hosts smsc-service.niralos.svc.cluster.local | awk '{print $1}')

    UPF_IP=$(getent hosts upf-gtpu | awk '{print $1}')
    echo "UPF SERVICE IP: $UPF_IP"
    echo "IMS SERVICE IP: $UE_IPV4_IMS"
    echo "MYSQL_IP: $MYSQL_IP"
    echo "PYHSS_SERVICE_HOST: $PYHSS_SERVICE_HOST"
    while ! mysqladmin ping -h ${MYSQL_IP} --silent; do
            sleep 5;
    done
    sleep 10;

    export MYSQL_PWD="{{ .Values.secrets.mysql.rootPassword }}"

    mysql -u root -h ${MYSQL_IP} -e "CREATE DATABASE IF NOT EXISTS pcscf;" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} pcscf < /usr/local/src/kamailio/utils/kamctl/mysql/standard-create.sql 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} pcscf < /usr/local/src/kamailio/utils/kamctl/mysql/presence-create.sql 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} pcscf < /usr/local/src/kamailio/utils/kamctl/mysql/ims_usrloc_pcscf-create.sql 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} pcscf < /usr/local/src/kamailio/utils/kamctl/mysql/ims_dialog-create.sql 2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} -e "CREATE USER IF NOT EXISTS 'pcscf'@'%' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.ims.imsUserPassword }}';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "CREATE USER IF NOT EXISTS 'pcscf'@'$PCSCF_IP' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.ims.imsUserPassword }}';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "GRANT ALL ON pcscf.* TO 'pcscf'@'%';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "GRANT ALL ON pcscf.* TO 'pcscf'@'$PCSCF_IP';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "FLUSH PRIVILEGES;" 2>/dev/null || true

    unset MYSQL_PWD

    echo "${PYHSS_SERVICE_HOST} hss.${IMS_DOMAIN}" >> /etc/hosts
    echo "${SCSCF_SERVICE_HOST} scscf.${IMS_DOMAIN}" >> /etc/hosts
    echo "${ICSCF_SERVICE_HOST} icscf.${IMS_DOMAIN}" >> /etc/hosts
    echo "${ICSCF_SERVICE_HOST} ${IMS_DOMAIN}" >> /etc/hosts

    export TIMESCALEDB_IP=${TIMESCALEDB_IP:-"timescaledb"}
    export SCP_IP=${SCP_IP:-"scp"}

    echo "RTPENGINE_IP: $RTPENGINE_IP"
    echo "TIMESCALEDB_IP: $TIMESCALEDB_IP"
    echo "SCP_IP: $SCP_IP"

    export PGPASSWORD="{{ .Values.secrets.timescaledb.password }}"
    psql -U {{ .Values.secrets.timescaledb.username }} -d {{ .Values.secrets.timescaledb.database }} -h ${TIMESCALEDB_IP} -p 5432 -f /usr/local/src/kamailio/utils/kamctl/postgres/standard-create.sql 2>/dev/null || true
    psql -U {{ .Values.secrets.timescaledb.username }} -d {{ .Values.secrets.timescaledb.database }} -h ${TIMESCALEDB_IP} -p 5432 -f /usr/local/src/kamailio/utils/kamctl/postgres/siptrace-pcscf.sql 2>/dev/null || true
    psql -U {{ .Values.secrets.timescaledb.username }} -d {{ .Values.secrets.timescaledb.database }} -h ${TIMESCALEDB_IP} -p 5432 -f /usr/local/src/kamailio/utils/kamctl/postgres/trace-table.sql 2>/dev/null || true

    # if [[ ${PCSCF_N5_ENABLE} == 1 ]]; then
    #         sed -i 's|#!define WITH_RX\b|##!define WITH_RX|g' /etc/kamailio_pcscf/pcscf.cfg
    #         sed -i 's|##!define WITH_N5\b|#!define WITH_N5|g' /etc/kamailio_pcscf/pcscf.cfg
    # fi

    sed -i 's|PCSCF_IP|'$PCSCF_IP'|g' /etc/kamailio_pcscf/pcscf.cfg
    sed -i 's|SCP_IP|'$SCP_IP'|g' /etc/kamailio_pcscf/pcscf.cfg
    sed -i 's|PCSCF_PUB_IP|'$PCSCF_PUB_IP'|g' /etc/kamailio_pcscf/pcscf.cfg
    sed -i 's|IMS_DOMAIN|'$IMS_DOMAIN'|g' /etc/kamailio_pcscf/pcscf.cfg
    sed -i 's|EPC_DOMAIN|'$EPC_DOMAIN'|g' /etc/kamailio_pcscf/pcscf.cfg
    sed -i 's|MYSQL_IP|'$MYSQL_IP'|g' /etc/kamailio_pcscf/pcscf.cfg
    # ADD THESE LINES TO FORCE RESOLUTION IN KAMAILIO CONFIG:
    sed -i 's|icscf.$IMS_DOMAIN|'${ICSCF_SERVICE_HOST}'|g' /etc/kamailio_pcscf/pcscf.cfg
    sed -i 's|scscf.$IMS_DOMAIN|'${SCSCF_SERVICE_HOST}'|g' /etc/kamailio_pcscf/pcscf.cfg

    sed -i 's|PCSCF_IP|'$PCSCF_IP'|g' /etc/kamailio_pcscf/pcscf.xml
    sed -i 's|IMS_DOMAIN|'$IMS_DOMAIN'|g' /etc/kamailio_pcscf/pcscf.xml
    sed -i 's|EPC_DOMAIN|'$EPC_DOMAIN'|g' /etc/kamailio_pcscf/pcscf.xml
    sed -i 's|PCRF_BIND_PORT|'$PCRF_BIND_PORT'|g' /etc/kamailio_pcscf/pcscf.xml
    sed -i 's|PCSCF_BIND_PORT|'$PCSCF_BIND_PORT'|g' /etc/kamailio_pcscf/pcscf.xml

    sed -i 's|RTPENGINE_IP|'$RTPENGINE_IP'|g' /etc/kamailio_pcscf/kamailio_pcscf.cfg
    sed -i 's|SITE_ID|'$SITE_ID'|g' /etc/kamailio_pcscf/kamailio_pcscf.cfg
    sed -i 's|TIMESCALEDB_IP|'$TIMESCALEDB_IP'|g' /etc/kamailio_pcscf/kamailio_pcscf.cfg

    if [[ -n "$UE_IPV4_IMS" ]]; then

        GATEWAY=$(ip route | awk '/^default/ {print $3; exit}')

        echo "RTPengine Gateway: $GATEWAY"
        echo "IMS UE Network: $UE_IPV4_IMS"
        echo "UPF Service IP: $UPF_SERVICE_IP"

        if [[ -n "$GATEWAY" ]]; then

        # Add route towards IMS UE network
        ip route add "$UE_IPV4_IMS" via "$GATEWAY" 2>/dev/null || true

        echo "Route added:"
        echo "$UE_IPV4_IMS via $GATEWAY"

        else

            echo "ERROR: Could not find default gateway"

        fi

    fi

    echo "Final route:"
    ip route show "${UE_IPV4_IMS}"

  pcscf.cfg: |
    # IP-Adress for incoming SIP-Traffic, in the following format:

    # SIP / UDP
    listen=udp:PCSCF_IP:5060
    #listen=udp:PCSCF_IP:5060 advertise PCSCF_PUB_IP:5060
    # SIP / TCP
    listen=tcp:PCSCF_IP:5060
    #listen=tcp:PCSCF_IP:5060 advertise PCSCF_PUB_IP:5060
    # SIP / TCP/TLS
    #listen=tls:PCSCF_IP:5061

    # IPSEC / UDP
    #!define IPSEC_LISTEN_ADDR "PCSCF_IP"
    ##!define IPSEC_LISTEN_ADDR "PCSCF_PUB_IP"
    #!define IPSEC_CLIENT_PORT 5100
    #!define IPSEC_SERVER_PORT 6100
    #!define IPSEC_MAX_CONN 10

    # Value: 1 for true and 0 for false
    #!define IPSEC_DELETE_UNUSED_TUNNELS 1

    # Delay in seconds to delete contact from registrar
    #!define CONTACT_DELETE_DELAY 10

    # Logical OR of following flags:
    # - IPSEC_SEND_FORCE_SOCKET 1
    # - IPSEC_SETDSTURI_FULL 128
    # - IPSEC_FORWARD_USEVIA 256
    # - IPSEC_FORWARD_TRYTCP 512
    #!define IPSEC_FORWARD_FLAGS 897

    #!define RX_IMS_REG_DIALOG_DIRECTION 3

    # IP used in Rx_AAR_Register - IP of this P-CSCF, to be used in the flow for the AF-signaling
    #!define RX_AF_SIGNALING_IP "PCSCF_IP"
    # Uncomment the below line only when UE is behind double NAT (e.g. VoIP calling over WiFi/ CN behind a NAT)
    ##!define RX_AF_SIGNALING_IP "PCSCF_PUB_IP"


    # IP and Port for incoming requests over N5 from 5G Core
    #!substdef "/N5_BIND_IP/PCSCF_IP/g"
    #!substdef "/N5_BIND_PORT/7777/g"

    # SCP IP and Port for NF registration and heartbeat
    #!substdef "/SCP_BIND_IP/SCP_IP/g"
    #!substdef "/SCP_BIND_PORT/7777/g"

    alias=pcscf.IMS_DOMAIN

    #!define MY_WS_PORT 80
    #!define MY_WSS_PORT 443

    #!define PCSCF_URL "sip:pcscf.IMS_DOMAIN:5060"

    #!define TCP_PROCESSES 8

    #!subst "/NETWORKNAME/IMS_DOMAIN/g"
    #!subst "/HOSTNAME/pcscf.IMS_DOMAIN/g"
    #!subst "/PCRF_REALM/EPC_DOMAIN/g"

    # SIP-Address of capturing node, if not set, capturing is disabled.
    #!define CAPTURE_NODE "sip:127.0.0.1:9060"

    # Allowed IPs for XML-RPC-Queries
    ##!define XMLRPC_WHITELIST_1 "127.0.0.1"
    ##!define XMLRPC_WHITELIST_2 "127.0.0.1"
    ##!define XMLRPC_WHITELIST_3 "127.0.0.1"

    # Databases:
    #!define DB_URL "mysql://pcscf:heslo@MYSQL_IP/pcscf"
    ##!define DB_URL2 "con2=>mysql://pcscf:heslo@MYSQL_IP/pcscf"

    #!define SQLOPS_DBURL "pcscf=>mysql://pcscf:heslo@MYSQL_IP/pcscf"

    #! Optional: Server-URL for Websocket-Requests
    ##!define WEBSOCKET_WEBSERVER "phone.ng-voice.com"

    ##!define TRF_FUNCTION "trf.IMS_DOMAIN"

    #
    # Several features can be enabled using '#!define WITH_FEATURE' directives:
    #
    # *** To run in debug mode:
    #     - define WITH_DEBUG
    #
    # *** To enable nat traversal execute:
    #     - define WITH_NAT
    #     - define the connection to the RTP-Proxy: RTPPROXY_ADDRESS
    #
    # *** To force alls calls through the RTP-Proxy
    #     - this will automagically enable NAT-Traversal
    #     - define FORCE_RTPRELAY
    #
    # *** To enable IPv4/IPv6 Translation (RTPProxy)
    #     - this will automagically enable NAT-Traversal
    #     - define WITH_RTPIPV4
    #
    # *** To enable TCP support execute:
    #     - define WITH_TCP
    #
    # *** To enable TLS support execute:
    #     - adjust CFGDIR/tls.cfg as needed
    #     - define WITH_TLS
    #     - this will automagically enable TCP
    #
    # *** To enable XMLRPC support execute:
    #     - define WITH_XMLRPC
    #     - this will automagically enable TCP
    #
    # *** To enable anti-flood detection execute:
    #     - adjust pike and htable=>ipban settings as needed (default is
    #       block if more than 16 requests in 2 seconds and ban for 300 seconds)
    #     - define WITH_ANTIFLOOD
    #
    # *** To enable the Rx-Interface:
    #     - Configure Rx-Diameter-Interface in pcscf.xml
    #     - define WITH_RX
    #
    # *** To enable a Homer SIP-Capter-Node:
    #     - define CAPTURE_NODE with a proper address
    #
    # *** To enable support for the SEMS-SBC
    #     - define WITH_SBC
    #     - configure dispatcher-list with a set of SBC's

    #
    # Enabled Features for this host:
    ##!define WITH_DEBUG
    #!define WITH_NAT
    #!define WITH_NATPING
    #!define FORCE_RTPRELAY
    ##!define WITH_TLS
    ##!define WITH_XMLRPC
    ##!define WITH_IPBLOCK
    ##!define WITH_ANTIFLOOD
    ##!define WITH_RX
    #!define WITH_N5
    #!define WITH_TCP
    ##!define WITH_RTPIPV4
    ##!define WITH_SBC
    ##!define WITH_SBC_CALL
    ##!define WITH_REGINFO
    ##!define WITH_RTPPING
    ##!define WITH_WEBSOCKET
    ##!define WITH_IPSEC
    #!define WITH_IMS_HDR_CACHE
    #!define WITH_PING_UDP
    #!define WITH_PING_TCP
    #!define WITH_HEALTH_CHECK_API

  pcscf.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <DiameterPeer
            FQDN="pcscf.IMS_DOMAIN"
            Realm="IMS_DOMAIN"
            Vendor_Id="10415"
            Product_Name="CDiameterPeer"
            AcceptUnknownPeers="1"
            DropUnknownOnDisconnect="1"
            Tc="30"
            Workers="4"
            QueueLength="8"
            TransactionTimeout="5"
            SessionsHashSize="128"
            DefaultAuthSessionTimeout="3600"
            MaxAuthSessionTimeout="3600"
    >
            <Peer FQDN="pcrf.EPC_DOMAIN" Realm="EPC_DOMAIN" port="PCRF_BIND_PORT"/>
            <Acceptor port="PCSCF_BIND_PORT" bind="PCSCF_IP"/>
            <Auth id="16777236" vendor="10415"/> <!-- 3GPP Rx -->
            <Auth id="16777236" vendor="0"/> <!-- 3GPP Rx -->
            <DefaultRoute FQDN="pcrf.EPC_DOMAIN" metric="10"/>
    </DiameterPeer>

  kamailio_pcscf.cfg: |
    #
    # TelcoSuite (V3) Proxy-CSCF
    #
    # Kamailio (OpenSER) SIP Server
    #     - web: http://www.kamailio.org
    #     - git: http://sip-router.org
    #
    # Refer to the Core CookBook at http://www.kamailio.org/dokuwiki/doku.php
    # for an explanation of possible statements, functions and parameters.
    #

    import_file "pcscf.cfg"

    ####### Defined Values #########
    # *** Value defines - IDs used later in config
    #!define DISPATCHER_LIST_SBC 1

    #!define DISPATCHER_DST_AVP "i:1"
    #!define DISPATCHER_GRP_AVP "i:2"
    #!define DISPATCHER_CNT_AVP "i:3"
    #!define DISPATCHER_SOCK_AVP "i:4"

    #!define RR_CUSTOM_USER_AVP "i:5"
    #!define DLG_TIMEOUT_AVP "i:6"

    #!define FLT_MOBILE_ORIG 1
    #!define FLT_DIALOG 2
    #!define FLT_NAT 3
    #!define FLT_RTP 4
    #!define FLT_CAPTURE 5

    ####### Global Parameters #########

    #!ifdef WITH_DEBUG
    debug=4
    log_stderror=yes
    #!else
    debug=2
    log_stderror=no
    #!endif

    memdbg=5
    memlog=5

    max_while_loops=5000

    #!ifdef WITH_XMLRPC
    listen=tcp:127.0.0.1:5060
    #!endif

    # Locks all ser pages into memory making it unswappable (in general one
    # doesn't want his sip proxy swapped out )
    mlock_pages=yes
    # Tries to pre-fault all the shared memory, before starting. When "on", start
    # time will increase, but combined with mlock_pages will guarantee ser will get
    # all its memory from the beginning (no more kswapd slow downs)
    shm_force_alloc=yes

    # Do SRV-Loadbalancing:
    dns_srv_lb=on
    # Always prefer IPv6:
    dns_try_ipv6=on
    # Always prefer IPv6:
    dns_cache_flags=4
    # DNS-Based failover
    use_dns_failover=on
    # Query NAPTR-Records as well:
    dns_try_naptr=off
    # DNS cache won't be used (all dns lookups will result into a DNS request)
    use_dns_cache=off

    user_agent_header="User-Agent: Niral Proxy-CSCF"
    server_header="Server: Niral Proxy-CSCF"

    log_facility=LOG_LOCAL0

    fork=yes
    children=4

    #!ifndef TCP_PROCESSES
    # Number of TCP Processes
    #!define TCP_PROCESSES 16
    #!endif

    #!ifdef WITH_TLS
    # Check, if TCP is enabled:
    #!ifndef WITH_TCP
    #!define WITH_TCP
    #!endif
    enable_tls=yes
    #!endif

    #!ifdef WITH_XMLRPC
    #!ifndef WITH_TCP
    #!define WITH_TCP
    #!endif
    #!ifndef TCP_PROCESSES
    # Number of TCP Processes
    #!define TCP_PROCESSES 3
    #!endif
    #!endif

    #!ifdef WITH_TCP
    # life time of TCP connection when there is no traffic
    # - a bit higher than registration expires to cope with UA behind NAT
    tcp_connection_lifetime=36000
    # If a message received over a tcp connection has "alias" in its via a new tcp
    # alias port will be created for the connection the message came from (the
    # alias port will be set to the via one).
    #
    # Note: For NAT traversal of TCP clients it is better to not use
    # tcp_accept_aliases but just use nathelper module and
    # fix_nated_[contact|register] functions.
    tcp_accept_aliases=no
    # Enable SIP outbound TCP keep-alive using PING-PONG (CRLFCRLF - CRLF).
    tcp_crlf_ping=yes

    tcp_reuse_port=yes

    tcp_accept_no_cl=yes
    tcp_rd_buf_size=16384

    #!ifdef TCP_PROCESSES
    tcp_children=TCP_PROCESSES
    #!endif
    #!else
    disable_tcp=yes
    #!endif

    /* uncomment the next line to disable the auto discovery of local aliases
       based on reverse DNS on IPs (default on) */
    auto_aliases=no

    #phone2tel=1

    udp_mtu = 1300
    udp_mtu_try_proto = TCP

    /* uncomment and configure the following line if you want Kamailio to
       bind on a specific interface/port/proto (default bind on all available) */

    system.shutdownmode = 0 desc "System shutdown mode"
    system.service = "Proxy-CSCF" desc "Function of this server"

    ####### Modules Section ########

    # set paths to pcscf_location of modules
    mpath="/usr/lib64/kamailio/modules_k/:/usr/lib64/kamailio/modules/:/usr/lib/kamailio/modules_k/:/usr/lib/kamailio/modules/:/usr/lib/x86_64-linux-gnu/kamailio/modules/:/usr/local/lib64/kamailio/modules"

    # Fifo Module
    # Kamailio Extensions (e.g. MI:uptime, MI:version, cfg:isflagset etc.)
    loadmodule "kex"
    # Transaction Module
    loadmodule "tm"
    loadmodule "tmx"
    loadmodule "sl"
    loadmodule "rr"
    loadmodule "pv"
    loadmodule "maxfwd"
    loadmodule "textops"
    loadmodule "textopsx"
    # SIP-Utilities: options_reply
    loadmodule "siputils"
    loadmodule "sanity"
    loadmodule "ctl"
    loadmodule "cfg_rpc"
    loadmodule "xlog"
    loadmodule "auth"
    loadmodule "dispatcher"
    loadmodule "sctp"
    loadmodule "path"
    loadmodule "statistics"

    loadmodule "ims_dialog"
    loadmodule "ims_usrloc_pcscf"
    # Following module is required even in case of IPSec being disabled.
    loadmodule "ims_ipsec_pcscf"
    loadmodule "ims_registrar_pcscf"

    #!ifdef WITH_XMLRPC
    loadmodule "xmlrpc"
    #!endif

    #!ifdef WITH_REGINFO
    loadmodule "pua"
    #!endif

    #!ifdef DB_URL
    loadmodule "db_mysql"
    #!ifdef DB_URL2
    loadmodule "db_cluster"
    #!endif
    #!endif

    #!ifdef WITH_DEBUG
    loadmodule "debugger"
    #!endif

    loadmodule "usrloc"
    loadmodule "registrar"

    loadmodule "nathelper"

    #!ifdef WITH_ANTIFLOOD
    loadmodule "pike"
    #!endif

    #!ifdef WITH_TLS
    loadmodule "tls"
    #!endif

    #!ifdef WITH_RTPPING
    loadmodule "rtpping"
    #!endif


    loadmodule "sdpops"
    loadmodule "rtpengine"

    loadmodule "xhttp.so"

    #!ifdef WITH_WEBSOCKET
    #loadmodule "xhttp.so"
    loadmodule "websocket.so"
    #!endif

    #!ifdef WITH_RX
    loadmodule "cdp"
    loadmodule "cdp_avp"
    loadmodule "ims_qos"
    #!endif

    #!ifdef WITH_N5
    loadmodule "http_client"
    loadmodule "jansson"
    loadmodule "nghttp2"
    loadmodule "uuid"
    #!endif

    #!ifdef CAPTURE_NODE
    loadmodule "siptrace"
    #!endif

    #!ifdef WITH_NATPING
    loadmodule "rtimer"
    loadmodule "uac"
    #!endif

    # HTable as a cache:
    loadmodule "sqlops"
    loadmodule "db_postgres"
    loadmodule "htable"

    #!ifdef WITH_DEBUG
    #loadmodule "debugger.so"
    modparam("debugger", "mod_hash_size", 5)
    modparam("debugger", "mod_level_mode", 1)
    modparam("debugger", "mod_level", "rtpengine=3")
    modparam("debugger", "mod_level", "ims_qos=3")
    #!ifdef WITH_IPSEC
    modparam("debugger", "mod_level", "ims_ipsec_pcscf=3")
    #!endif
    modparam("debugger", "mod_level", "textops=3")
    modparam("debugger", "mod_level", "tm=3")
    modparam("debugger", "mod_level", "ims_registrar_pcscf=3")
    modparam("debugger", "mod_level", "ims_usrloc_pcscf=3")
    modparam("debugger", "cfgtrace", 1)
    #!endif

    #!ifdef WITH_HEALTH_CHECK_API
    modparam("xhttp", "url_match", "^/health_Check")
    #!endif

    loadmodule "jsonrpcs.so"
    # ----- jsonrpcs params -----
    modparam("jsonrpcs", "pretty_format", 1)
    /* set the path to RPC fifo control file */
    modparam("jsonrpcs", "fifo_name", "/var/run/kamailio/kamailio_rpc.fifo")
    /* set the path to RPC unix socket control file */
    modparam("jsonrpcs", "dgram_socket", "/var/run/kamailio/kamailio_rpc.sock")

    # ----------------- setting module-specific parameters ---------------
    #!ifdef DB_URL2
    # ----- db_cluster params -----
    modparam("db_cluster", "connection", DB_URL)
    modparam("db_cluster", "connection", DB_URL2)
    modparam("db_cluster", "cluster", "cluster1=>con1=2s2s;con2=1s1s")
    #!endif

    #!ifdef WITH_ANTIFLOOD
    # ----- pike params -----
    modparam("pike", "sampling_time_unit", 2)
    modparam("pike", "reqs_density_per_unit", 16)
    modparam("pike", "remove_latency", 4)

    # ----- htable params -----
    # ip ban htable with autoexpire after 5 minutes
    modparam("htable", "htable", "ipban=>size=8;autoexpire=300")
    modparam("htable", "htable", "failedauth=>size=8;autoexpire=120")
    modparam("htable", "htable", "natpingfrom=>size=8;autoexpire=600000;")
    #!endif

    modparam("htable", "htable", "contact=>size=8;autoexpire=20")
    modparam("htable", "htable", "a=>size=8;autoexpire=20")

    #!ifdef WITH_IMS_HDR_CACHE
    modparam("htable", "htable", "serviceroutes=>size=16;autoexpire=14400;")
    modparam("htable", "htable", "associateduris=>size=16;autoexpire=14400;")
    #!endif

    #!ifdef WITH_NATPING
    modparam("htable", "htable", "natping=>size=8;autoexpire=600000;")
    modparam("htable", "htable", "natpingfail=>size=8;autoexpire=600000;")
    modparam("htable", "htable", "natpingfrom=>size=8;autoexpire=600000;")
    #!ifdef DB_URL2
    modparam("sqlops","sqlcon","pcscf=>cluster://cluster1")
    #!else
    modparam("sqlops","sqlcon", SQLOPS_DBURL)
    #!endif

    modparam("sqlops","sqlcon","cb=>postgres://{{ .Values.secrets.timescaledb.username }}:{{ .Values.secrets.timescaledb.password }}@TIMESCALEDB_IP/{{ .Values.secrets.timescaledb.database }}")
    modparam("sqlops", "connect_mode", 1)

    modparam("uac","restore_mode","none")

    # ----------------- Settings for RTimer ---------------
    # time interval set to 60 seconds
    modparam("rtimer", "timer", "name=NATPING;interval=5;mode=1;")
    modparam("rtimer", "exec", "timer=NATPING;route=NATPING")
    #!endif

    # ----- tm params -----
    # auto-discard branches from previous serial forking leg
    #modparam("tm", "failure_reply_mode", 3)
    # default retransmission timeout: 3 sec
    modparam("tm", "fr_timer", 3000)
    # default invite retransmission timeout after 1xx: 120sec
    modparam("tm", "fr_inv_timer", 120000)
    # Dont reply automatically with "100 Trying"
    modparam("tm", "auto_inv_100", 0)

    # ----- rr params -----
    # add value to ;lr param to cope with most of the UAs
    modparam("rr", "enable_full_lr", 1)
    # do not append from tag to the RR (no need for this script)
    modparam("rr", "append_fromtag", 1)
    # add a Username to RR-Header
    modparam("rr", "add_username", 1)
    # Take User from a custom AVP
    modparam("rr", "custom_user_avp", "$avp(RR_CUSTOM_USER_AVP)")
    modparam("rr", "force_send_socket", 1)

    #!ifdef WITH_XMLRPC
    # ----- xmlrpc params -----
    modparam("xmlrpc", "route", "XMLRPC");
    modparam("xmlrpc", "url_match", "^/RPC")
    #!endif

    #!ifdef WITH_TLS
    # ----- tls params -----
    modparam("tls", "config", "/etc/kamailio_pcscf/tls.cfg")
    #!endif

    # ----- rtpproxy params -----
    modparam("rtpengine", "setid_default", 1)
    modparam("rtpengine", "rtpengine_sock", "1 == udp:RTPENGINE_IP:2223")
    #modparam("rtpengine", "rtpengine_sock", "2 == udp:localhost:2224")
    modparam("rtpengine", "setid_avp", "$avp(setid)")
    modparam("rtpengine", "extra_id_pv", "$avp(extra_id)")

    modparam("rtpengine", "mos_average_pv", "$avp(mos_avg)")
    modparam("rtpengine", "mos_average_jitter_pv", "$avp(mos_avg_jitter)")
    modparam("rtpengine", "mos_average_roundtrip_pv", "$avp(mos_avg_rrt)")

    modparam("path", "use_received", 1)

    # ----- ctl params -----
    modparam("ctl", "binrpc", "unix:/var/run/kamailio/kamailio_ctl")

    # ----------------- Settings for Dispatcher ---------------
    modparam("dispatcher", "list_file", "/etc/kamailio_pcscf/dispatcher.list")

    # Dispatcher: Enable Failover-Support
    modparam("dispatcher", "flags", 2)
    # Dispatcher: Overwrite Destination address, if required.
    modparam("dispatcher", "force_dst", 1)
    # AVP's required for Fail-Over-Support:
    #modparam("dispatcher", "dst_avp", "$avp(DISPATCHER_DST_AVP)")
    #modparam("dispatcher", "grp_avp", "$avp(DISPATCHER_GRP_AVP)")
    #modparam("dispatcher", "cnt_avp", "$avp(DISPATCHER_CNT_AVP)")
    #modparam("dispatcher", "sock_avp", "$avp(DISPATCHER_SOCK_AVP)")

    #modparam("dispatcher", "xavp_dst", "$avp(DISPATCHER_DST_AVP)")
    #modparam("dispatcher", "xavp_dst_mode", 0)
    #modparam("dispatcher", "xavp_ctx", "$avp(DISPATCHER_CNT_AVP)")
