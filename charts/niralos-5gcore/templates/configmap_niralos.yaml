  scscf.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <DiameterPeer 
      FQDN="scscf.IMS_DOMAIN"
      Realm="IMS_DOMAIN"
      Vendor_Id="10415"
      Product_Name="CDiameterPeer"
      AcceptUnknownPeers="1"
      DropUnknownOnDisconnect="1"
      Tc="30"
      Workers="16"
      QueueLength="32"
      TransactionTimeout="5"
      SessionsHashSize="128"
      DefaultAuthSessionTimeout="3600"
      MaxAuthSessionTimeout="3600"
    >
      <Peer FQDN="hss.IMS_DOMAIN" Realm="IMS_DOMAIN" port="3868"/>
        
      <Acceptor port="SCSCF_BIND_PORT" bind="SCSCF_IP"/>

      <Auth id="16777216" vendor="10415"/><!-- 3GPP Cx -->
      <Auth id="16777216" vendor="4491"/><!-- CableLabs Cx -->
      <Auth id="16777216" vendor="13019"/><!-- ETSI/TISPAN Cx -->
      <Auth id="16777216" vendor="0"/><!-- ETSI/TISPAN Cx -->

      <Auth id="4" vendor="10415"/> <!--3GPP Ro -->
            <Acct id="4" vendor="10415" />

            <!-- 
                    Supported Vendor IDs - list of values which will be sent in the CER/CEA in the
                    Supported-Vendor-ID AVPs
            -->
            <SupportedVendor vendor="10415" />

      <DefaultRoute FQDN="hss.IMS_DOMAIN" metric="10"/>
    </DiameterPeer>
    
  kamailio_scscf.cfg: |
    #!KAMAILIO
    #
    # This config file implements the basic P-CSCF functionality
    #     - web: http://www.kamailio.org
    #     - git: http://sip-router.org
    #
    # Refer to the Core CookBook at http://www.kamailio.org/dokuwiki/doku.php
    # for an explanation of possible statements, functions and parameters.
    #
    # Direct your questions about this file to: <sr-users@lists.kamailio.org>.
    #
    # For more information about the various parameters, functions and statements
    # try http://sip-router.org/wiki/ .
    #

    ####### Defined Values #########
    # *** Value defines - IDs used later in config

    # - flags
    #	FLT_ - per transaction (message) flags
    #	FLB_ - per branch flags

    #!define FLT_CAPTURE 1
    #!define FLT_DIALOG 2

    #!define DLG_TIMEOUT_AVP "i:1"
    #!define RR_CUSTOM_USER_AVP "i:2"
    #!define DISPATCHER_DST_AVP "i:3"
    #!define DISPATCHER_GRP_AVP "i:4"
    #!define DISPATCHER_CNT_AVP "i:5"
    #!define DISPATCHER_SOCK_AVP "i:6"

    ####### Global Parameters #########

    include_file "scscf.cfg"

    #!ifdef WITH_DEBUG
    debug=5
    log_stderror=no
    sip_warning=yes
    #!else
    debug=2
    log_stderror=no
    sip_warning=no
    #!endif

    #!ifdef WITH_XMLRPC
    listen=tcp:127.0.0.1:6060
    #!endif

    alias=HOSTNAME

    user_agent_header="User-Agent: Niral S-CSCF"
    server_header="Server: Niral S-CSCF"

    /* comment the next line to enable the auto discovery of local aliases
      based on reverse DNS on IPs (default on) */
    auto_aliases=no

    check_via=no    # (cmd. line: -v)
    dns=no          # (cmd. line: -r)
    rev_dns=no      # (cmd. line: -R)

    # Do SRV-Loadbalancing:
    dns_srv_lb=on
    # Always: Also try IPv6:
    dns_try_ipv6=on
    # Always prefer IPv6:
    dns_cache_flags=4
    # DNS-Based failover
    use_dns_failover=on
    # Query NAPTR-Records as well:
    dns_try_naptr=on
    # DNS cache won't be used (all dns lookups will result into a DNS request)
    use_dns_cache=off

    #!ifdef WITH_XMLRPC
    #!ifndef WITH_TCP
    #!define WITH_TCP
    #!endif
    #!ifndef TCP_PROCESSES
    # Number of TCP Processes
    #!define TCP_PROCESSES 3
    #!endif
    #!endif

    #!ifdef WITH_TCP
    # life time of TCP connection when there is no traffic
    # - a bit higher than registration expires to cope with UA behind NAT
    tcp_connection_lifetime=3615
    #!ifdef TCP_PROCESSES
    tcp_children=TCP_PROCESSES
    #!endif
    #!else
    disable_tcp=yes
    #!endif

    #!ifdef WITH_HEALTH_CHECK_API
    tcp_accept_no_cl=yes
    #!endif

    children=4

    system.shutdownmode = 0 desc "System shutdown mode"
    system.service = "Serving-CSCF" desc "Function of this server"

    # ------------------ module loading ----------------------------------
    mpath="/usr/lib64/kamailio/modules_k/:/usr/lib64/kamailio/modules/:/usr/lib/kamailio/modules_k/:/usr/lib/kamailio/modules/:/usr/lib/x86_64-linux-gnu/kamailio/modules/:/usr/local/lib64/kamailio/modules"
    # (we try both the lib64 and the lib directory)

    loadmodule "tm.so"
    loadmodule "pv.so"
    loadmodule "sl.so"
    loadmodule "rr.so"
    loadmodule "ims_dialog.so"
    loadmodule "textops.so"
    loadmodule "textopsx.so"
    loadmodule "maxfwd.so"
    loadmodule "xlog.so"
    loadmodule "sanity.so"
    loadmodule "siputils.so"
    loadmodule "kex.so"
    loadmodule "tmx.so"
    loadmodule "pike.so"
    #!ifdef DB_URL
    loadmodule "presence"
    #!endif

    #!ifdef DB_URL
    loadmodule "db_mysql"
    #!ifdef DB_URL2
    loadmodule "db_cluster"
    #!endif
    #!endif

    loadmodule "sqlops.so"
    loadmodule "htable.so"
    loadmodule "jansson.so"
    loadmodule "db_postgres.so"

    loadmodule "dispatcher"

    loadmodule "enum"
    loadmodule "uac"

    # Control interfaces:
    loadmodule "ctl"
    loadmodule "cfg_rpc"
    #!ifdef WITH_XMLRPC
    loadmodule "xmlrpc"
    #!endif

    loadmodule "cdp.so"
    loadmodule "cdp_avp.so"

    loadmodule "ims_usrloc_scscf.so" 
    loadmodule "ims_registrar_scscf.so"
    loadmodule "ims_auth.so"
    loadmodule "ims_isc.so"

    #!ifdef WITH_HEALTH_CHECK_API
    loadmodule "xhttp.so"
    #!endif

    #!ifdef WITH_RO
    loadmodule "ims_charging.so"
    #!endif

    #!ifdef CAPTURE_NODE
    loadmodule "siptrace.so"
    #!endif

    #!ifdef WITH_DEBUG
    loadmodule "debugger.so"
    modparam("debugger", "mod_hash_size", 5)
    modparam("debugger", "mod_level_mode", 1)
    #modparam("debugger", "mod_level", "ims_usrloc_scscf=3")
    #modparam("debugger", "mod_level", "ims_registrar_scscf=3")
    #modparam("debugger", "mod_level", "ims_auth=3")
    #modparam("debugger", "mod_level", "ims_isc=3")
    #modparam("debugger", "mod_level", "ims_dialog=3")
    #modparam("debugger", "mod_level", "ims_charging=3")
    #!endif

    # ----------------- setting module-specific parameters ---------------
    #!ifdef DB_URL2
    # ----- db_cluster params -----
    modparam("db_cluster", "connection", DB_URL)
    modparam("db_cluster", "connection", DB_URL2)
    modparam("db_cluster", "cluster", "cluster1=>con1=2s2s;con2=1s1s")
    #!endif

    # ----- presence params -----
    #!ifdef DB_URL
    #!ifdef DB_URL2
    modparam("presence", "db_url", "cluster://cluster1")
    #!else
    modparam("presence", "db_url", DB_URL)
    #!endif
    #modparam("presence", "fallback2db", 1)
    modparam("presence", "db_update_period", 20)
    #!endif

    #!ifdef WITH_HEALTH_CHECK_API
    modparam("xhttp", "url_match", "^/health_Check")
    #!endif

    loadmodule "jsonrpcs.so"
    # ----- jsonrpcs params -----
    modparam("jsonrpcs", "pretty_format", 1)
    /* set the path to RPC fifo control file */
    modparam("jsonrpcs", "fifo_name", "/var/run/kamailio/kamailio_rpc.fifo")
    /* set the path to RPC unix socket control file */
    modparam("jsonrpcs", "dgram_socket", "/var/run/kamailio/kamailio_rpc.sock")

    # ----- ctl params -----
    modparam("ctl", "binrpc", "unix:/var/run/kamailio/kamailio_ctl")

    # ----- tm params -----
    # auto-discard branches from previous serial forking leg
    modparam("tm", "failure_reply_mode", 3)
    # default retransmission timeout: 10sec
    modparam("tm", "fr_timer", 10000)
    # default invite retransmission timeout after 1xx: 120sec
    modparam("tm", "fr_inv_timer", 120000)
    # Don't reply automatically with "100 Trying"
    modparam("tm", "auto_inv_100", 0)

    # ----- rr params -----
    # add value to ;lr param to cope with most of the UAs
    modparam("rr", "enable_full_lr", 1)
    # append from tag to the RR
    modparam("rr", "append_fromtag", 1)
    # add a Username to RR-Header
    modparam("rr", "add_username", 1)
    # Take User from a custom AVP
    modparam("rr", "custom_user_avp", "$avp(RR_CUSTOM_USER_AVP)")

    # -- usrloc params --
    modparam("ims_usrloc_scscf", "enable_debug_file", 0)
    modparam("ims_usrloc_scscf", "matching_mode", 0)
    modparam("ims_usrloc_scscf", "maxcontact", 1)
    modparam("ims_usrloc_scscf", "maxcontact_3gpp", 1)
    modparam("ims_registrar_scscf", "max_contacts", 5)
    modparam("ims_usrloc_scscf", "maxcontact_behaviour", 2) #overwrite
    #!ifdef DB_URL
    #!ifdef DB_URL2
    modparam("ims_usrloc_scscf", "db_url", "cluster://cluster1")
    #!else
    modparam("ims_usrloc_scscf", "db_url", DB_URL)
    #!endif
    modparam("ims_usrloc_scscf", "db_mode", 0)
    #!endif
    modparam("ims_registrar_scscf", "subscription_default_expires", 654800)
    modparam("ims_registrar_scscf", "subscription_min_expires", 3700)
    modparam("ims_registrar_scscf", "subscription_max_expires", 605800)

    # -- CDP params --
    modparam("cdp","config_file","/etc/kamailio_scscf/scscf.xml")

    # -- ims_dialog params --
    modparam("ims_dialog", "dlg_flag", FLT_DIALOG)
    modparam("ims_dialog", "timeout_avp", "$avp(DLG_TIMEOUT_AVP)")
    modparam("ims_dialog", "detect_spirals", 0)
    modparam("ims_dialog", "profiles_no_value", "orig ; term")
    #!ifdef DB_URL
    #!ifdef DB_URL2
    modparam("ims_dialog", "db_url", "cluster://cluster1")
    #!else
    modparam("ims_dialog", "db_url", DB_URL)
    #!endif
    modparam("ims_dialog", "db_mode", 0)
    #!endif

    #!ifdef WITH_XMLRPC
    # ----- xmlrpc params -----
    modparam("xmlrpc", "route", "XMLRPC");
    modparam("xmlrpc", "url_match", "^/RPC")
    #!endif

    #!ifdef WITH_DEBUG
    # ----- debugger params -----
    modparam("debugger", "cfgtrace", 1)
    #!endif

    #!ifdef CAPTURE_NODE
    # Destination, where to send the traffic
    modparam("siptrace", "db_url", "postgres://{{ .Values.secrets.timescaledb.username }}:{{ .Values.secrets.timescaledb.password }}@TIMESCALEDB_IP/{{ .Values.secrets.timescaledb.database }}")
    modparam("siptrace", "table", "sip_trace_scscf")
    modparam("siptrace", "trace_table_avp", "$avp(siptrace_table)")
    modparam("siptrace", "duplicate_uri", CAPTURE_NODE)
    modparam("siptrace", "trace_id_avp", "$avp(trace_id)")
    modparam("siptrace", "site_id", "SITE_ID")
    # Trace all traffic
    modparam("siptrace", "trace_on", 1)
    modparam("siptrace", "trace_to_database", 1)
    modparam("siptrace", "trace_flag", FLT_CAPTURE)
    modparam("siptrace", "hep_mode_on", 1)
    #!endif

    # -- ims_auth params --
    modparam("ims_auth", "name", URI)
    modparam("ims_auth", "registration_default_algorithm", REG_AUTH_DEFAULT_ALG)
    #!ifdef CXDX_FORCED_PEER
    modparam("ims_auth", "cxdx_forced_peer", CXDX_FORCED_PEER)
    #!endif
    modparam("ims_auth", "cxdx_dest_realm", NETWORKNAME)
    modparam("ims_auth", "av_check_only_impu", 1)

    modparam("ims_auth", "max_nonce_reuse", 20)
    modparam("ims_auth", "auth_vector_timeout", 60)
    modparam("ims_auth", "auth_data_timeout", 600000)
    modparam("ims_auth", "auth_used_vector_timeout", 600000)
    modparam("ims_auth", "av_request_at_once", 1)
    modparam("ims_auth", "av_request_at_sync", 1)
    modparam("ims_auth", "registration_qop", "auth")

    # -- ims_registrar_scscf params --
    #!ifdef WITH_DEBUG
    modparam("ims_registrar_scscf", "default_expires", 60)
    modparam("ims_registrar_scscf", "min_expires", 60)
    modparam("ims_registrar_scscf", "max_expires", 60)
    #!else
    modparam("ims_registrar_scscf", "default_expires",  604800)
    modparam("ims_registrar_scscf", "min_expires", 60)
    modparam("ims_registrar_scscf", "max_expires",  604800)
    #!endif
    modparam("ims_registrar_scscf", "use_path", 1)
    modparam("ims_registrar_scscf", "support_wildcardPSI",1)
    modparam("ims_registrar_scscf", "user_data_xsd","/etc/kamailio_scscf/CxDataType_Rel7.xsd")
    modparam("ims_registrar_scscf", "scscf_name", URI)
    modparam("ims_registrar_scscf", "scscf_name", URI)
    modparam("ims_registrar_scscf", "cxdx_dest_realm", NETWORKNAME)
    modparam("ims_registrar_scscf", "append_branches", 1)
    modparam("ims_registrar_scscf", "user_data_always", 0)
    modparam("ims_registrar_scscf", "ue_unsubscribe_on_dereg", 1)

    #!ifdef WITH_MULTIDOMAIN
    # ----- domain params -----
    #!ifdef DB_URL
    #!ifdef DB_URL2
    modparam("domain", "db_url", "cluster://cluster1")
    #!else
    modparam("domain", "db_url", DB_URL)
    #!endif
    modparam("domain", "db_mode", 1)
    #!endif
    # register callback to match myself condition with domains list
    modparam("domain", "register_myself", 1)
    #!endif

    # ----- ims_isc params -----
    modparam("ims_isc", "my_uri", HOSTNAME)
    modparam("ims_isc", "add_p_served_user", 1)

    #!ifdef WITH_RO
    # ----- ims_diameter_ro params -----
    #!ifdef DB_URL
    #!ifdef DB_URL2
    #modparam("ims_charging", "db_url", "cluster://cluster1")
    #!else
    #modparam("ims_charging", "db_url", DB_URL)
    #!endif
    #modparam("ims_charging", "db_mode", 1)
    #!endif
    modparam("ims_charging", "origin_host", HOSTNAME);
    modparam("ims_charging", "origin_realm", NETWORKNAME);
    #!ifdef RO_FORCED_PEER
    modparam("ims_charging", "ro_forced_peer", RO_FORCED_PEER);
    #!endif
    modparam("ims_charging", "destination_host", RO_DESTINATION);
    modparam("ims_charging", "destination_realm", NETWORKNAME);

    modparam("ims_charging","service_context_id_root", RO_ROOT);
    modparam("ims_charging","service_context_id_ext", RO_EXT);
    modparam("ims_charging","service_context_id_mnc", RO_MNC);
    modparam("ims_charging","service_context_id_mcc", RO_MCC);
    modparam("ims_charging","service_context_id_release", RO_RELEASE);

    modparam("ims_charging","interim_update_credits",30);
    modparam("ims_charging","timer_buffer",5);
    #!endif

    modparam("sqlops","sqlcon","cb=>postgres://{{ .Values.secrets.timescaledb.username }}:{{ .Values.secrets.timescaledb.password }}@TIMESCALEDB_IP/{{ .Values.secrets.timescaledb.database }}")
    modparam("sqlops", "connect_mode", 1)

    modparam("htable", "htable", "terminating_call=>size=4;initval=0;")
    modparam("htable", "htable", "orig_stats=>size=4;initval=0;")
    modparam("htable", "htable", "term_stats=>size=4;initval=0;")
    modparam("htable", "htable", "register_stats=>size=4;initval=0;")
    modparam("htable", "htable", "imsi=>size=4;initval=0;")
    modparam("htable", "htable", "time=>size=4;initval=0;")

    # ----- enum params -----
    modparam("enum", "domain_suffix", ENUM_SUFFIX)

    # ----- sanity params -----
    modparam("sanity", "autodrop", 0)

    # ----------------- Settings for Dispatcher ---------------
    modparam("dispatcher", "list_file", "/etc/kamailio_scscf/dispatcher.list")
    # Dispatcher: Enable Failover-Support
    modparam("dispatcher", "flags", 2)
    # Dispatcher: Overwrite Destination address, if required.
    modparam("dispatcher", "force_dst", 1)
    # AVP's required for Fail-Over-Support:
    #modparam("dispatcher", "dst_avp", "$avp(DISPATCHER_DST_AVP)")
    #modparam("dispatcher", "grp_avp", "$avp(DISPATCHER_GRP_AVP)")
    #modparam("dispatcher", "cnt_avp", "$avp(DISPATCHER_CNT_AVP)")
    #modparam("dispatcher", "sock_avp", "$avp(DISPATCHER_SOCK_AVP)")

    #modparam("dispatcher", "xavp_dst", "$avp(DISPATCHER_DST_AVP)")
    #modparam("dispatcher", "xavp_dst_mode", 0)
    #modparam("dispatcher", "xavp_ctx", "$avp(DISPATCHER_CNT_AVP)")
    #modparam("dispatcher", "xavp_ctx_mode", 0)

    # Try to recover disabled destinations every 15 seconds.
    modparam("dispatcher", "ds_ping_interval", 15)
    # Actively query the gateways:
    modparam("dispatcher", "ds_probing_mode", 1)
    modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=404;code=480")

    ####### Routing Logic ########
    # Main SIP request routing logic
    # - processing of any incoming SIP request starts with this route

    route {
    ##!ifdef WITH_DEBUG
      xnotice("SCSCF: $rm $ru ($fu ($si:$sp) to $tu, $ci)\n");
    ##!endif

    #!ifdef CAPTURE_NODE
        setflag(FLT_CAPTURE);
        xlog("L_INFO", "SIPTRACE LOG: [$ci] $rm from $si:$sp to $ru\n");
    #!endif
      # per request initial checks
      route(REQINIT);

      # Handle Registrations:
      if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
      }

      # we need to support subscription to reg event
            if (is_method("SUBSCRIBE") && search("^(Event|o)([ \t]*):([ \t]*)reg")) {
        route(SUBSCRIBE);
        break;
            }

      if (is_method("PUBLISH") && search("^(Event|o)([ \t]*):([ \t]*)reg")) {
                    route(PUBLISH);
                    break;
            }

      # Evaluate Route-Header and set $route_uri
      loose_route();

      if (is_method("CANCEL|BYE")) { 

        $var(time_now)=$_s($timef(%Y-%m-%d %H:%M:%S.000));
        $sht(terminating_call=>$fU:cancel_count) = 1 + $sht(terminating_call=>$fU:cancel_count);
        $sht(terminating_call=>$fU:invite_callid) = $ci;
        $sht(terminating_call=>$fU:msisdn) = $fU;
        $sht(terminating_call=>imsi) = $sht(register_stats=>$fU:imsi);
        $sht(terminating_call=>$fU:user_agent) = $ua;
        $sht(terminating_call=>$fU:sip_method) = $rm;
        $sht(terminating_call=>$fU:source_ip) = $siz; 
        $sht(terminating_call=>$fU:source_port) = $sp;
        $sht(terminating_call=>$fU:from_tag) = $ft;
        $sht(terminating_call=>$fU:to_tag) = $tt;

        if($sht(orig_stats=>$fU:call_to) == $tU){
          $var(orig_call_from) =$fU;
        }else if ($sht(orig_stats=>$fU:call_to) == $fU){
          $var(orig_call_from) =$tU;
        }

        $sht(time=>$ci:end) = $Ts;
            $var(duration) = $sht(time=>$ci:end) - $sht(time=>$ci:start);
        if(is_method("CANCEL"))
          $var(duration) = 0;
      if($sht(terminating_call=>$fU:cancel_count) == 1){
        sql_query("cb", "INSERT INTO call_stats (imsi,sip_side,msisdn,register_callid,register_status,invite_callid,user_agent,sip_method,src_ip,
          src_port,from_tag,to_tag,duration,time_stamp,ue_ip,invite_status,call_to,call_from,media_type,site_id)
          VALUES ('$sht(terminating_call=>imsi)','$sht(register_stats=>$fU:sip_side)','$sht(terminating_call=>$fU:msisdn)','$sht(register_stats=>$fU:register_callid)',
          '$sht(register_stats=>$fU:register)','$sht(terminating_call=>$fU:invite_callid)','$sht(terminating_call=>$fU:user_agent)',
          '$sht(terminating_call=>$fU:sip_method)','$sht(terminating_call=>$fU:source_ip)','$sht(terminating_call=>$fU:source_port)',
          '$sht(terminating_call=>$fU:from_tag)','$sht(terminating_call=>$fU:to_tag)','$var(duration)','$var(time_now)','$sht(register_stats=>$fU:ue_ip)',
          '$sht(orig_stats=>$fU:invite_status)','$sht(orig_stats=>$fU:call_to)','$var(orig_call_from)','$sht(orig_stats=>$fU:media_type)','$var(site_id)');");
      }else if($sht(terminating_call=>$fU:cancel_count) > 1){
        $sht(terminating_call=>$fU:cancel_count) = 0;
      }
      }

      if (is_method("UPDATE")) {
        if ($(hdr(Content-Length)) > 0) {
          if ($mb =~ "m=audio") {
          $var(update_media_type)= "AUDIO";
          }
          if ($mb =~ "m=video") {
            if($mb =~ "m=video 0"){
              $var(update_media_type)= "AUDIO";
            }else{
              $var(update_media_type)= "VIDEO";
            }
          }
        }
        $sht(orig_stats=>$tU:media_type) = $var(update_media_type);
        $sht(orig_stats=>$fU:media_type) = $var(update_media_type);
      }

      if (is_method("CANCEL|ACK")) {
        t_relay();
        exit;
      }

      #Set DLG flag to track dialogs using dialog2
      if (!is_method("REGISTER|SUBSCRIBE"))
        setflag(FLT_DIALOG);

      if (($route_uri =~ "sip:orig@.*") || ($route_uri =~ "sip:orig@"+HOSTNAME_ESC+".*") || isc_from_as("orig")) {
        xlog("Orig");
        # we need something like this to assign SCSCF to unregistered user for services
        # support for AS origination on behalf of unregistered useri
        # can use the registrar is_registered methods - must see if we need to check orig or term?

        # Sanitize the R-URI if domain is present in from of @MSISDN of caller
        # What in case of Roaming? - Need to handle it
        # if ($ru =~ ".*phone-context.*") {
        # 	if ($ru =~ "tel:.*") {
        # 		# Handle following request-uri
        # 		# tel:0498765432100;phone-context=ims.mnc001.mcc001.3gppnetwork.org
        # 		$ru = $(ru{re.subst,/tel:/sip:/g});
        # 	}
        # 	# Now in sip: uri format
        # 	if ($ru =~ ".*@.*") {
        # 		$ru = $(ru{re.subst,/@[0-9+-]*;user=phone/@NETWORKNAME;user=phone/g});
        # 		#$ru = $(ru{re.subst,/;phone-context=[A-Za-z.0-9+-]*@/;phone-context=NETWORKNAME@/g});
        # 	} else {
        # 		$ru = $ru + "@" + NETWORKNAME + ";user=phone";
        # 		#$ru = $(ru{re.subst,/;phone-context=[A-Za-z.0-9+-]*@/;phone-context=NETWORKNAME@/g});
        # 	}
        # }
        if (!is_method("REGISTER|SUBSCRIBE")) {
          # sip:xxx;phone-context=xxxx@xxx format is not desired
          if (($ru =~ ".*phone-context.*") && ($ru =~ "sip:.*")) {
            $var(old_ruri) = $ru;
            $ru = $(ru{re.subst,/sip:/tel:/g});
            $ru = $(ru{re.subst,/;phone-context=[A-Za-z.0-9+-@]*;user=phone//g});
            $ru = $ru + ";phone-context=" + NETWORKNAME;
            msg_apply_changes();
            xnotice("SCSCF: Changed R-URI from $var(old_ruri) to $ru\n");
          }
        }

        # Originating
        route(orig);
            break;                          
      } else {
        isc_from_as("term");
        if ($retcode == -2) {
          # Treat as originating, since it was retargeted:
          route(orig);
              break;                          
        }
        if ((is_in_profile("orig") || has_totag()) && ($route_uri =~ "sip:mo@"+".*")) {
          route(orig_subsequent);
          break;
        }
        if ((is_in_profile("term") || has_totag()) && ($route_uri =~ "sip:mt@"+".*")) {
          route(term_subsequent);
          break;
        }

        # Terminating
        if (uri == myself || uri =~ "tel:.*") {
          if (!term_impu_registered("location")) {
            xlog("L_DBG", "We need to do an UNREG server SAR assignemnt");
                              assign_server_unreg("UNREG_SAR_REPLY", "location", "term");
                              exit;
              } else {
            sl_send_reply("403","Forbidden - Domain not served");
            exit();
          }
        }
        route(term);
        break;
      }
    }

    route[UNREG_SAR_REPLY]
    {
            xlog("L_DBG","saa_return code is $avp(s:saa_return_code)\n");
            switch ($avp(s:saa_return_code)){
                case 1: #success
                        xlog("L_DBG", "SAR success - will route message\n");
                    route(term);
                    break;
                case -1: #failure
                        xlog("L_ERR", "SAR failure - error response sent from module\n");
                    break;
                case -2: #error
                        xlog("L_ERR", "SAR error - error response sent from module\n");
                    break;
                default:
                        xlog("L_ERR", "Unknown return code from SAR, value is [$avp(s:saa_return_code)]\n");
                    break;
            }
            exit;
    }


    ######################################################################
    # Helper routes (Basic-Checks, NAT-Handling/RTP-Control, XML-RPC)
    ######################################################################
    # Per SIP request initial checks
    route[REQINIT] {
      $var(site_id) = "SITE_ID";
        if ($var(site_id) == $null || $var(site_id) == "") {
            xlog("L_CRIT", "SITE_ID environment variable is NOT set\n");
            exit;
        }
        xlog("L_INFO", "Kamailio started with SITE_ID='$shv(site_id)'\n");
      $var(used) = 1 - ($stat(free_size) / $stat(total_size));
      xlog("L_DBG", "Mem: Total $stat(total_size), Free $stat(free_size) [$var(used)% used]\n");
      if ($var(used) > 95) {
        send_reply("503", "Server overloaded");
        exit;
      }

      # Trace this message
    #!ifdef CAPTURE_NODE
    if (isflagset(FLT_CAPTURE)) {
        route(SIPTRACE_CHECK);
    }
    #!endif
      if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483","Too Many Hops");
        exit;
      }

      if(!sanity_check("1511", "7")) {
        xlog("Malformed SIP message from $si:$sp\n");
        exit;
      }

      # Check for shutdown mode:
      if (!has_totag() && ($sel(cfg_get.system.shutdownmode) > 0)) {
        send_reply("503", "Server shutting down");
        exit;
      }

      # Reply to OPTIONS:
      if (is_method("OPTIONS") && (uri==myself)) {
        options_reply();
        exit;
      }	
      
      # Ignore Re-Transmits:
      if (t_lookup_request()) {
        exit;
      }
      if (is_method("INVITE")) {
        send_reply("100", "Trying");
      }

    }
    route[SIPTRACE_CHECK] {
        $var(imsi) = "";
        $var(msisdn) = "";
        $var(id)     = "";

        if ($hdr(P-Asserted-Identity) != "") {
            $var(id) = $hdr(P-Asserted-Identity);
        }

        else if ($hdr(From) != "") {
            $var(id) = $hdr(From);
        }

        else if ($hdr(To) != "") {
            $var(id) = $hdr(To);
        }

        if ($var(id) != "") {
            $var(id) = $(var(id){re.subst,/.*(sip|tel):([^@;>]+).*/\2/});
        }

        if ($var(id) =~ "^[0-9]{15}$") {
            $var(imsi) = $var(id);
        } else if ($var(id) =~ "^[0-9]{3,15}$") {
            $var(msisdn) = $var(id);
        }

        if ($var(imsi) == "" && $fU =~ "^[0-9]{15}$") {
            $var(imsi) = $fU;
        }

        xlog("L_INFO",
            "SIPTRACE: $rm parsed IMSI=<$var(imsi)> MSISDN=<$var(msisdn)> "
            "ID=<$var(id)> Call-ID=$ci\n");

        if ($var(imsi) == "" && $var(msisdn) == "") {
            xdbg("SIPTRACE: no identity -> skip\n");
            return;
        }
      $avp(trace_id) = $null;
        sql_query("cb",
      "SELECT trace_id, trace_status "
      "FROM ims_trace_filters "
      "WHERE (imsi='$var(imsi)' OR msisdn='$var(msisdn)') "
      "AND (expires_at IS NULL OR expires_at > now()) "
      "ORDER BY created_at DESC "
      "LIMIT 1",
      "ra");

        if ($dbr(ra=>rows) > 0) {
        if ($dbr(ra=>[0,1]) == 1) {
          $avp(trace_id) = $dbr(ra=>[0,0]);
          $avp(siptrace_table) = "sip_trace_scscf";
          sip_trace();
        } else {
          xlog("L_INFO", "SIPTRACE: disabled (status=0) for imsi=$var(imsi) msisdn=$var(msisdn)\n");
        }
      }
      else {
        xlog("L_INFO","SIPTRACE: not enabled (OR) for imsi=$var(imsi) msisdn=$var(msisdn)\n");
      }

        sql_result_free("ra");
    }


    ######################################################################
    # Publish route
    ######################################################################
    route[PUBLISH]
    {
      if (!t_newtran()) {
        #absorb retransmissions
        sl_reply("500","Could not create transaction");
        exit;
      }

      if (can_publish_reg("location")) {
        $var(ret)= publish_reg("location");        
        switch ($var(ret)){
          case 1: #success
            xlog("L_DBG", "Publish reg successful");
            break;
          case -1: #failure
            xlog("L_ERR", "Publish reg failure - sending 500 Error now\n");
            t_reply("500","Server Error publishing subscription");
            break;
          default:
            xlog("L_ERR", "Unknown return code from publish reg event alue is [$var(ret)]\n");
            break;
        }
      } else {
        t_reply("403","Forbidden to PUBLISH");
        exit;
      }
    }

    ######################################################################
    # Subscribe route
    ######################################################################
    route[SUBSCRIBE]
    {
        if (!t_newtran()) {
                    #absorb retransmissions
                    sl_reply("500","Could not create transaction");
                    exit;
            }
        $var(msisdn) = $fU;
        $sht(register_stats=>$var(msisdn):msisdn) = $var(msisdn);
        $sht(register_stats=>$var(msisdn):register_callid) = $ci;
        $sht(register_stats=>$var(msisdn):user_agent) = $ua;
        $sht(register_stats=>$var(msisdn):source_ip) = $siz;
        $sht(register_stats=>$var(msisdn):source_port) = $sp;
        $sht(register_stats=>$var(msisdn):from_tag) = $ft;
        $sht(register_stats=>$var(msisdn):to_tag) = $tt;
        $var(time_now)=$_s($timef(%Y-%m-%d %H:%M:%S.000));
          if (!has_totag()) {
                    xlog("L_DBG", "This is an initial SUBSCRIBE\n");
                    if (!term_impu_registered("location")) {
                            xlog("L_DBG", "We need to do an UNREG server SAR assignment\n");
                            assign_server_unreg("SUBSCRIBE_UNREG_SAR_REPLY", "location", "term");
                            exit;
                    }
                    if (!can_subscribe_to_reg("location")){
                            t_reply("403","Forbidden to SUBSCRIBE");
                            exit;
                    }
            }else{
                    xlog("L_DBG", "This is a subsequent SUBSCRIBE\n");      
            }

            $var(ret)= subscribe_to_reg("location");        
            switch ($var(ret)){
        case 1: #success
            $sht(register_stats=>$var(msisdn):sip_method) = 'REGISTER';
            if($sht(register_stats=>$var(msisdn):imsi) != 0)
              sql_query("cb", "INSERT INTO call_stats (imsi,msisdn,register_callid,register_status,user_agent,sip_method,src_ip,src_port,from_tag,to_tag,ue_ip,time_stamp,site_id)
                  VALUES ('$sht(register_stats=>$var(msisdn):imsi)','$var(msisdn)','$sht(register_stats=>$var(msisdn):register_callid)','$sht(register_stats=>$var(msisdn):register)','$sht(register_stats=>$var(msisdn):user_agent)','$sht(register_stats=>$var(msisdn):sip_method)',
                  '$sht(register_stats=>$var(msisdn):source_ip)','$sht(register_stats=>$var(msisdn):source_port)','$sht(register_stats=>$var(msisdn):from_tag)','$sht(register_stats=>$var(msisdn):to_tag)','$sht(register_stats=>$var(msisdn):ue_ip)','$var(time_now)','$var(site_id)');");
            xlog("L_DBG", "Subscribe to reg successful");
                break;
        case -1: #failure
            $sht(register_stats=>$var(msisdn):sip_method) = 'UNREGISTER';
            sql_query("cb", "INSERT INTO call_stats (imsi,msisdn,register_callid,register_status,user_agent,sip_method,src_ip,src_port,from_tag,to_tag,ue_ip,time_stamp,site_id)
                VALUES ('$sht(register_stats=>$var(msisdn):imsi)','$var(msisdn)','$sht(register_stats=>$var(msisdn):register_callid)','$sht(register_stats=>$var(msisdn):register)','$sht(register_stats=>$var(msisdn):user_agent)','$sht(register_stats=>$var(msisdn):sip_method)',
                '$sht(register_stats=>$var(msisdn):source_ip)','$sht(register_stats=>$var(msisdn):source_port)','$sht(register_stats=>$var(msisdn):from_tag)','$sht(register_stats=>$var(msisdn):to_tag)','$sht(register_stats=>$var(msisdn):ue_ip)','$var(time_now)','$var(site_id)');");
                xlog("L_ERR", "Subscribe to reg failure - sending 500 Error now\n");
                t_reply("500","Server Error saving subscription");
                break;
        case -2: #error
                xlog("L_ERR", "Subscribe to reg error sending notify - 200 OK so subscription already sent\n");
                break;
        default:
                xlog("L_ERR", "Unknown return code from subscribe to reg event alue is [$var(ret)]\n");
                break;
            }
    }

    route[SUBSCRIBE_UNREG_SAR_REPLY]
    {
            
            xlog("L_DBG","saa_return code is $avp(s:saa_return_code)\n");
            switch ($avp(s:saa_return_code)){
                    case 1: #success
                            xlog("L_DBG", "SAR success - will process subscribe\n");
                            if (can_subscribe_to_reg("location")){
                                    $var(ret)= subscribe_to_reg("location");        
                                    switch ($var(ret)){
                                    case 1: #success
                                            xlog("L_DBG", "Subscribe to reg successful");
                                            break;
                                    case -1: #failure
                                            xlog("L_ERR", "Subscribe to reg failure - sending 500 Error now\n");
                                            t_reply("500","Server Error saving subscription");
                                            break;
                                    case -2: #error
                                            xlog("L_ERR", "Subscribe to reg error sending notify - 200 OK so subscription already sent\n");
                                            break;
                                    default:
                                            xlog("L_ERR", "Unknown return code from subscribe to reg event alue is [$var(ret)]\n");
                                            break;
                                    }
                            }else{
                                    t_reply("403","Forbidden to SUBSCRIBE");
                                    exit;
                            }
                            break;
                    case -1: #failure
                            xlog("L_ERR", "SAR failure - Sending 403 Forbidden\n");
                            t_reply("403","Forbidden to SUBSCRIBE");
                            break;
                    case -2: #error
                            xlog("L_ERR", "SAR error - Sending 403 Forbidden\n");
                            t_reply("403","Forbidden to SUBSCRIBE");
                            break;
                    default:
                            xlog("L_ERR", "Unknown return code from SAR, value is [$avp(s:saa_return_code)] - sending 403 Forbidden\n");
                            t_reply("403","Forbidden to SUBSCRIBE");
                            break;
            }
            exit;
    }

    ######################################################################
    # XMLRPC routing
    ######################################################################
    #!ifdef WITH_XMLRPC
    route[XMLRPC] {
      if ((method=="POST" || method=="GET")
    #!ifdef XMLRPC_WHITELIST_1
    && ((src_ip == XMLRPC_WHITELIST_1)
    #!ifdef XMLRPC_WHITELIST_2
    || (src_ip == XMLRPC_WHITELIST_2)
    #!endif
    #!ifdef XMLRPC_WHITELIST_3
    || (src_ip == XMLRPC_WHITELIST_3)
    #!endif
    )
    #!endif
    ) {
        # close connection only for xmlrpclib user agents (there is a bug in
        # xmlrpclib: it waits for EOF before interpreting the response).
        if ($hdr(User-Agent) =~ "xmlrpclib")
          set_reply_close();
        set_reply_no_connect();
        dispatch_rpc();
        exit;
      }
      send_reply("403", "Forbidden");
      exit;
    }
    #!endif

    ######################################################################
    # Route for handling Registrations:
    ######################################################################
    route[REGISTER] {
        $sht(register_stats=>$fU:imsi) = $fU;
            xnotice("ALGORITHM IS [$aa] and User-Agent is [$ua]\n");
            $var(alg) = $aa;
            if ($aa == $null) {
                    $var(alg) = "MD5";      #force to MD5 for zoiper.... non-ims
            }
    #!ifdef WITH_AUTH
      if (!ims_www_authenticate("$td")) {
    #!else
      if (($var(alg) == "MD5") && (!ims_www_authenticate("$td"))) {
    #!endif   
      $sht(register_stats=>$fU:register) = 0;
      
        if ($? == -2) {
                            send_reply("403", "Authentication Failed");
                            exit;
                    } else if ($? == -3) {
                            send_reply("400", "Bad Request");
                            exit;
                    } else if ($? == -9) {
                            xlog("L_DBG", "Authentication re-sync requested\n");
                            ims_www_resync_auth("REG_RESYNC_REPLY", "$td");
                            exit;
                    } else {
                            #user has not been authenticated. Lets send a challenge via 401 Unauthorized
                            xlog("L_DBG","About to challenge! auth_ims\n");
                            ims_www_challenge("REG_MAR_REPLY", "$td", "$var(alg)");
                            exit;
                    }
      } else {
        $sht(register_stats=>$fU:register) = 1;
        xlog("L_DBG", "Auth succeeded\n");
        # We need to check if this user is registered or not
        if (!impu_registered("location")) {
          xlog("L_ERR", "Not REGISTERED\n");
          save("PRE_REG_SAR_REPLY","location");
                            exit;
        } else {
          isc_match_filter_reg("1","location");
                            save("REG_SAR_REPLY","location");
                            exit;
        }
      }
    }

    route[REG_MAR_REPLY]
    {
        #this is async so to know status we have to check the reply avp
        xlog("L_DBG","maa_return code is $avp(s:maa_return_code)\n");   

        switch ($avp(s:maa_return_code)){
                case 1: #success
                        xlog("L_DBG", "MAR success - 401/407 response sent from module\n");
                        break;
                case -1: #failure
                        xlog("L_ERR", "MAR failure - error response sent from module\n");
                        break;
                case -2: #error
                        xlog("L_ERR", "MAR error - sending error response now\n");
                        send_reply("500", "MAR failed");
                        break;
                default:
                        xlog("L_ERR", "Unknown return code from MAR, value is [$avp(s:maa_return_code)]\n");
                        send_reply("500", "Unknown response code from MAR");
                        break;
        }
        exit;
    }

    route[PRE_REG_SAR_REPLY]
    {
      xlog("L_DBG","saa_return code is $avp(s:saa_return_code)\n");
            #this is async so to know status we have to check the reply avp
        xlog("L_DBG","saa_return code (for scscf_save on register) is $avp(s:saa_return_code)\n");
      $var(msisdn) = $msisdn;
      $sht(register_stats=>$var(msisdn):register) = $sht(register_stats=>$fU:register);
      $sht(register_stats=>$var(msisdn):imsi) = $sht(register_stats=>$fU:imsi);
      $var(ue_ip) = $(hdr(Contact){s.select,1,@});
        $sht(register_stats=>$var(msisdn):ue_ip) = $(var(ue_ip){s.select,0,:});

      switch ($avp(s:saa_return_code)){
                case 1: #success
              xlog("L_DBG", "SAR success - 200 response sent from module\n");
                        isc_match_filter_reg("0","location");
                        exit;
                case -1: #failure
                        xlog("L_ERR", "SAR failure - error response sent from module\n");
                        break;
                case -2: #error
                        xlog("L_ERR", "SAR error - error response sent from module\n");
                        break;
                default:
                        xlog("L_ERR", "Unknown return code from SAR, value is [$avp(s:saa_return_code)]\n");
                        break;
        }
        exit;
    }

    route[REG_SAR_REPLY]
    {
      $var(msisdn) = $msisdn;
      $sht(register_stats=>$var(msisdn):register) = $sht(register_stats=>$fU:register);
      $sht(register_stats=>$var(msisdn):imsi) = $sht(register_stats=>$fU:imsi);
      $var(ue_ip) = $(hdr(Contact){s.select,1,@});
        $sht(register_stats=>$var(msisdn):ue_ip) = $(var(ue_ip){s.select,0,:});

        xlog("L_DBG","saa_return code is $avp(s:saa_return_code)\n");
        #this is async so to know status we have to check the reply avp
        xlog("L_DBG","saa_return code (for scscf_save on register) is $avp(s:saa_return_code)\n");
        switch ($avp(s:saa_return_code)){
                case 1: #success
              xlog("L_DBG", "SAR success - 200 response sent from module\n");
                        exit;
                case -1: #failure
                        xlog("L_ERR", "SAR failure - error response sent from module\n");
                        break;
                case -2: #error
                        xlog("L_ERR", "SAR error - error response sent from module\n");
                        break;
                default:
                        xlog("L_ERR", "Unknown return code from SAR, value is [$avp(s:saa_return_code)]\n");
                        break;
        }
        exit;
    }

    route[REG_RESYNC_REPLY]
    {
        ims_www_challenge("REG_MAR_REPLY", "$td");
    }

    ######################################################################
    # Apply privacy, if requested
    ######################################################################
    route[apply_privacy]
    {
      if (is_present_hf("Privacy") && ($hdr(Privacy)=="id")) {
        remove_hf("P-Asserted-Identity");
      }
    }

    ######################################################################
    # Originating, Intial Requests
    ######################################################################
    route[orig]
    {
      xlog("L_DBG","Enter orig route\n");

      $sht(register_stats=>$fU:sip_side) = 'Orig';
      $sht(orig_stats=>$fU:invite_callid) = $ci;
          $sht(orig_stats=>$fU:source_ip) = $siz;
      $sht(orig_stats=>$fU:source_port) = $sp;
          $sht(orig_stats=>$fU:from_tag) = $ft;
          $sht(orig_stats=>$fU:to_tag) = $tt;
          $sht(orig_stats=>$fU:sip_method) = $rm;
          $sht(orig_stats=>$fU:call_to) = $tU;
          $sht(orig_stats=>$tU:call_to) = $tU;
      $sht(orig_stats=>$tU:call_from) = $fu;
      $sht(orig_stats=>$fU:call_from) = $fu;
      $sht(orig_stats=>$fU:user_agent) = $ua;
      $sht(orig_stats=>$fU:msisdn) = $fU;
          if ($(hdr(Content-Length)) > 0) {
                  if ($mb =~ "m=audio") {
                      $var(media_type)= "AUDIO";
        }
        if ($mb =~ "m=video") {
          $var(media_type)= "VIDEO";
        }
        $sht(orig_stats=>$fU:media_type) = $var(media_type);
              $sht(orig_stats=>$tU:media_type) = $var(media_type);
        $var(uri) = $ru;
        $var(start_index) = $(var(uri){s.substr,4,10});

        if (is_present_hf("Contact")) {
        xlog("**************$mb");
         $var(ue_ip) = $(hdr(Contact){s.select,1,@});
         $sht(orig_stats=>$fU:ue_ip) = $(var(ue_ip){s.select,0,:});
      }
      }
      set_dlg_profile("orig");

      # we MAYBE need something like this to check if a user is barred
      # if (S_originating_barred()){
        # sl_send_reply("403","Forbidden - Originating Public Identity barred");
        # exit;
      # }

      if (is_method("INVITE|SUBSCRIBE")) {
        $avp(RR_CUSTOM_USER_AVP)="mo";
              record_route();    
      }

      if (is_method("MESSAGE") && $ru =~ "^sip:smsc\.ims") {
            $var(in_reply_to) = $(hdr(In-Reply-To));
            sql_query("cb", "UPDATE call_stats 
                  SET invite_status = '1' , user_agent = '$ua'
                  WHERE invite_callid = '$sht(term_stats=>$var(in_reply_to):call_id)';");
      }
      
      # Start new transaction:
      t_newtran();

      # check if dialog saved as fwded to AS
      if (isc_match_filter("orig", "location")) {
        t_on_failure("isc_orig_failure");       
        xlog("Orig - msg was fwded to AS\n");
        exit;
      }

      if (!isc_from_as("orig")) {
        remove_hf("P-Asserted-Identity");
        append_hf("P-Asserted-Identity: <sip:$fU@$fd>\r\n");
      }

    #!ifdef WITH_RO
      # before we allow call - lets check credit
      if (is_method("INVITE")) {
        xlog("L_DBG","Sending initial CCR Request for call\n");
        $var(cc_ret) = Ro_CCR("CHARGING_CCR_ORIG_REPLY", "orig", 30, "0", "0");
        if ($var(cc_ret) < 0) {
          xlog("L_ERR","CCR Request failure\n");
          sl_send_reply("402","Payment required");
          exit;
        }
        xlog("L_DBG","CCR Request success\n");    
        exit;
      }
    #!endif
      route(FINAL_ORIG);
    }

    route[FINAL_ORIG]
    {
            # Check for PSTN destinations:
            if (is_method("INVITE")) {
                    route(PSTN_handling);
            }

            t_on_reply("orig_reply");

            t_relay();
    }

    route[CHARGING_CCR_ORIG_REPLY]
    {
            xlog("L_DBG","cca_return code is $avp(s:cca_return_code)\n");

            switch ($avp(s:cca_return_code)){
                case 1: #success
                    xlog("L_DBG", "CCR success - will route message\n");
        route(FINAL_ORIG);
                    break;
                case -1: #failure
                    xlog("L_ERR", "CCR failure - error response sent from module\n");
        switch ($avp(s:cca_result_code)){
          case 5030:
            send_reply("403", "Charging User not found");
                        break;
          case 5031:
            send_reply("403", "Rating failed");
                        break;
          case 4010:
            send_reply("402", "Payment required - Unsufficient funds");
                        break;
          case 5006:
            send_reply("486", "Line limit exceeded");
                        break;
          default:
            send_reply("402","Payment required ($avp(s:cca_result_code))");
                        break;
        }
                case -2: #error
                    xlog("L_ERR", "CCR error - error response sent from module\n");
        send_reply("500", "Charging Error");
                    break;
                default:
                    xlog("L_ERR", "Unknown return code from CCR: [$avp(s:cca_return_code)] \n");
        send_reply("500", "Charging Error");
                    break;
            }
            exit;
    }


    ######################################################################
    # Replies to the Initial Requests
    ######################################################################
    onreply_route[orig_reply]
    {
      xlog("L_DBG","Orig reply\n");
      if (t_check_status("180"))
      {
        $sht(orig_stats=>$fU:invite_status) = 1;
        $var(uri) = $fu;
        $var(time_now)=$_s($timef(%Y-%m-%d %H:%M:%S.000));
        $var(orig_call_from)  = $(var(uri){s.select,0,@});
          $var(orig_call_from)  = $(var(orig_call_from){s.select,1,:});
      
              sql_query("cb", "INSERT INTO call_stats (imsi,sip_side,sip_method,register_callid,register_status,
            invite_status,call_to,call_from,media_type,invite_callid,from_tag,to_tag,ue_ip,src_ip,src_port,user_agent,msisdn,time_stamp,site_id)
            VALUES ('$sht(register_stats=>$fU:imsi)','$sht(register_stats=>$fU:sip_side)','$sht(orig_stats=>$fU:sip_method)',
            '$sht(register_stats=>$fU:register_callid)','$sht(register_stats=>$fU:register)',
            '$sht(orig_stats=>$fU:invite_status)','$sht(orig_stats=>$fU:call_to)','$var(orig_call_from)',
            '$sht(orig_stats=>$fU:media_type)','$sht(orig_stats=>$fU:invite_callid)','$sht(orig_stats=>$fU:from_tag)',
            '$sht(orig_stats=>$fU:to_tag)','$sht(orig_stats=>$fU:ue_ip)','$sht(orig_stats=>$fU:source_ip)',
            '$sht(orig_stats=>$fU:source_port)','$sht(orig_stats=>$fU:user_agent)','$sht(orig_stats=>$fU:msisdn)','$var(time_now)','$var(site_id)');");
      }else if (t_check_status("200")){
        $var(time_now)=$_s($timef(%Y-%m-%d %H:%M:%S.000));
              $sht(time=>$ci:start)=$Ts;
              $var(uri) = $fu;
              $var(orig_call_from)  = $(var(uri){s.select,0,@});
          $var(orig_call_from)  = $(var(orig_call_from){s.select,1,:});
              $sht(orig_stats=>$fU:invite_status) = 2;
            sql_query("cb", "INSERT INTO call_stats (imsi,sip_side,sip_method,register_callid,register_status,
                            invite_status,call_to,call_from,media_type,invite_callid,from_tag,to_tag,ue_ip,src_ip,src_port,user_agent,msisdn,time_stamp,site_id)
                            VALUES ('$sht(register_stats=>$fU:imsi)','$sht(register_stats=>$fU:sip_side)','$sht(orig_stats=>$fU:sip_method)',
                            '$sht(register_stats=>$fU:register_callid)','$sht(register_stats=>$fU:register)',
                            '$sht(orig_stats=>$fU:invite_status)','$sht(orig_stats=>$fU:call_to)','$var(orig_call_from)',
                            '$sht(orig_stats=>$fU:media_type)','$sht(orig_stats=>$fU:invite_callid)','$sht(orig_stats=>$fU:from_tag)',
                            '$sht(orig_stats=>$fU:to_tag)','$sht(orig_stats=>$fU:ue_ip)','$sht(orig_stats=>$fU:source_ip)',
                            '$sht(orig_stats=>$fU:source_port)','$sht(orig_stats=>$fU:user_agent)','$sht(orig_stats=>$fU:msisdn)','$var(time_now)','$var(site_id)');");
          }
          $sht(orig_stats=>$tU:invite_status) = $sht(orig_stats=>$fU:invite_status);
      route(apply_privacy);
      break;
    }

    ######################################################################
    # Originating, subsequent requests
    ######################################################################
    route[orig_subsequent]
    {
      xlog("L_DBG","Orig_Subsequent\n");
      
      if (!is_method("ACK")) {
        t_on_reply("orig_subsequent_reply");
      }
      t_relay();
    }

    ######################################################################
    # Replies for originating, subsequent requests
    ######################################################################
    onreply_route[orig_subsequent_reply]
    {
      if(is_method("INVITE"))
      {
        $var(user_agent) =$ua;
        $var(media_type) = $sht(orig_stats=>$fU:media_type);

        if ($(hdr(Content-Length)) > 0 && $var(media_type) == "AUDIO" ) {
          if ($mb =~ "m=audio") {
            $var(media_type)= "AUDIO";
            $var(invite_status) = 2;
          }
          if ($mb =~ "m=video") {
            $var(media_type)= "VIDEO";
            if($mb =~ "m=video 0"){
              $var(invite_status) = 1;
            }else{
              $var(invite_status) = 2;
            }
          }
          if($var(invite_status) == 2){
            $var(success_media_type) = "AUDIO";
          }
        }else if($var(media_type) == "VIDEO" ){
          $var(media_type)= "AUDIO";
          $var(success_media_type) = "VIDEO";
          $var(invite_status) = 2;
        }
        if($sht(register_stats=>$fU:sip_side) == "Orig"){
          $var(user_agent)=$sht(orig_stats=>$fU:user_agent);
          $var(src_ip)=$sht(orig_stats=>$fU:source_ip);
          $var(src_port)=$sht(orig_stats=>$fU:source_port);
          $var(call_to)=$sht(orig_stats=>$fU:call_to);
        }else{
          $var(user_agent)=$sht(orig_stats=>$tU:user_agent);
          $var(src_ip)=$sht(term_stats=>$fU:source_ip);
          $var(src_port)=$sht(term_stats=>$fU:source_port);
        }
            $var(duration) = 0;
        $var(sip_method)="INVITE";
        if(t_check_status("200") && $var(invite_status) == 2){
          $sht(time=>$ci:end) = $Ts;
          $var(duration) = $sht(time=>$ci:end) - $sht(time=>$ci:start);
          $sht(time=>$ci:start) = $Ts;
          if ($var(media_type) == "AUDIO") {
            $var(success_media_type) = "VIDEO";
          } else if($var(media_type) == "VIDEO") {
            $var(success_media_type) = "AUDIO";
          }
          
          if($sht(orig_stats=>$fU:call_to) == $tU)
          {
            $var(orig_call_from) =$fU;
          } else {
            $var(orig_call_from) =$tU;
          }
          $var(time_now)=$_s($timef(%Y-%m-%d %H:%M:%S.000));
          sql_query("cb", "INSERT INTO call_stats (imsi,sip_side,sip_method,register_callid,register_status,
              invite_status,call_to,call_from,media_type,invite_callid,from_tag,to_tag,ue_ip,src_ip,src_port,user_agent,msisdn,time_stamp,duration,site_id)
              VALUES ('$sht(register_stats=>$fU:imsi)','$sht(register_stats=>$fU:sip_side)','$var(sip_method)',
              '$sht(register_stats=>$fU:register_callid)','$sht(register_stats=>$fU:register)',
              '$var(invite_status)','$sht(orig_stats=>$fU:call_to)','$var(orig_call_from)',
              '$var(success_media_type)','$ci','$ft','$tt','$sht(register_stats=>$fU:ue_ip)','$var(src_ip)',
              '$var(src_port)','$var(user_agent)','$fU','$var(time_now)','$var(duration)','$var(site_id)');");
          $var(sql_query_result) = 1;
        } else if(t_check_status("100") && ($sht(orig_stats=>$fU:media_type)== "AUDIO"||$sht(orig_stats=>$fU:media_type)=="AUDIO")){
          $var(sql_query_result) = 1;
          $var(media_type) = "VIDEO";
          $var(invite_status) = 1;
        }else{
          $var(sql_query_result) = 0;
        }
        if($var(sql_query_result)){
          $var(time_now)=$_s($timef(%Y-%m-%d %H:%M:%S.000));
          sql_query("cb", "INSERT INTO call_stats (imsi,sip_side,sip_method,register_callid,register_status,invite_status,call_to,call_from,
                  media_type,invite_callid,from_tag,to_tag,ue_ip,src_ip,src_port,user_agent,msisdn,time_stamp,site_id)
              VALUES ('$sht(register_stats=>$fU:imsi)','$sht(register_stats=>$fU:sip_side)','$var(sip_method)',
              '$sht(register_stats=>$fU:register_callid)','$sht(register_stats=>$fU:register)',
              '$var(invite_status)','$tU','$fU','$var(media_type)','$ci','$ft','$tt','$sht(register_stats=>$fU:ue_ip)','$var(src_ip)',
              '$var(src_port)','$var(user_agent)','$fU','$var(time_now)','$var(site_id)');");
          if ($var(invite_status) == 1 && $var(media_type) == "VIDEO") {
            $var(media_type) = "AUDIO";
          }
          $sht(orig_stats=>$fU:media_type) = $var(media_type);
          $sht(orig_stats=>$tU:media_type) = $var(media_type);
          if($var(invite_status) == 2){
            $sht(orig_stats=>$fU:call_to) = $tU;
            $sht(orig_stats=>$tU:call_to) = $tU;
            $sht(orig_stats=>$fU:call_from) = $fU;
            $sht(orig_stats=>$tU:call_from) = $fU;
          }
        }
      }

      xlog("L_DBG","Orig_Subsequent_reply\n");
      route(apply_privacy);
      break;
    }

    ######################################################################
    # Failure-Route for Requests to an AS
    ######################################################################
    failure_route[isc_orig_failure]
    {
      xlog("L_DBG","ISC_Orig_failure\n");     

      if (t_check_status("(408)|(5..)")){
        t_on_failure("isc_orig_failure");   
        if (isc_match_filter("orig","location")){
          xlog("L_DBG","ISC_Orig_failure - msg was fwded to AS\n");
          exit;
        }

        if (isc_from_as("origfail")) {
          remove_hf("P-Asserted-Identity");
          append_hf("P-Asserted-Identity: <sip:$fU@$fd>\r\n");
        }

        t_on_reply("orig_reply");

        t_relay();
      }
    }

    ######################################################################
    # Terminating requests
    ######################################################################
    route[term]
    {
      xlog("L_DBG","Term\n");
      $sht(register_stats=>$tU:sip_side) = 'Term';
      $sht(term_stats=>$tU:invite_callid) = $ci;
          $sht(term_stats=>$tU:source_ip) = $siz;
          $sht(term_stats=>$tU:source_port) = $sp;
          $sht(term_stats=>$tU:from_tag) = $ft;
          $sht(term_stats=>$tU:to_tag) = $tt;
          $sht(term_stats=>$tU:sip_method) = $rm;
          $sht(term_stats=>$tU:call_to) = $tU;
      $var(uri) = $fu;
          $sht(term_stats=>$tU:call_from) = $(var(uri){re.subst,/.*sip:([0-9]+)@.*/\1/});
      $sht(term_stats=>$tU:user_agent) = $ua;
          if ($(hdr(Content-Length)) > 0) {
              if ($mb =~ "m=audio") {
                  $var(media_type)= "AUDIO";
              }
              if ($mb =~ "m=video") {
                  $var(media_type)= "VIDEO";
              }
              $sht(term_stats=>$tU:media_type) = $var(media_type);
              $var(uri) = $ru;
              $var(start_index) = $(var(uri){s.substr,4,10});
          }

      set_dlg_profile("term");

      #we need something like this to check if a user is barred
      # if (S_terminating_barred()){
        # sl_send_reply("404","Not Found - Terminating user barred");
        # exit;
      # }

      if (is_method("INVITE|SUBSCRIBE")) {
        $avp(RR_CUSTOM_USER_AVP)="mt";
        $avp(i:20)="mt";
        record_route();    
      }

      # check if dialog saved as fwded to AS
      if (isc_match_filter("term","location")){
        t_on_failure("isc_term_failure");
        xlog("L_DBG","Term - msg was fwded to AS\n");
        exit;
      }

    #!ifdef WITH_RO_TERM
      # before we allow call - lets check credit
      if (is_method("INVITE")) {
        xlog("L_DBG","Sending initial CCR Request for call\n");
        $var(cc_ret) = Ro_CCR("CHARGING_CCR_TERM_REPLY", "term", 30, "0", "0");
        if ($var(cc_ret) < 0) {
          xlog("L_ERR","CCR Request failure\n");
          sl_send_reply("402","Payment required");
          exit;
        }
        xlog("L_DBG","CCR Request success\n");    
        exit;
      }
    #!endif
      route(FINAL_TERM);
    }

    route[FINAL_TERM] {
      if (lookup("location")) {
        if (uri==myself) {
          if (!t_newtran()) {
            sl_reply_error();
            exit;
          }                              
          t_reply("404","Not Found - destination user not found on this S-CSCF");
          exit;
        }
      } else {
        # User not registered? Reply with 404.
        if (!t_newtran()) {
          sl_reply_error();
          exit;
        }                              
        t_reply("404","Not Found - destination user not found on this S-CSCF");
        exit;
      }
      route(apply_privacy);

      $var(term_ue_ip) = $ru;
      $var(term_ue_ip) = $(var(term_ue_ip){s.select,1,@});
      $sht(term_stats=>$tU:ue_ip)  = $(var(term_ue_ip){s.select,0,:});
      $var(time_now)=$_s($timef(%Y-%m-%d %H:%M:%S.000));

      if(is_method("MESSAGE")){
        if(!$hdr(X-MSG-ID)){
          $sht(register_stats=>$tU:sip_side) = 'Orig';
          $sht(term_stats=>$tU:invite_callid) = $ci;
          $sht(term_stats=>$tU:source_ip) = $siz; 
          $sht(register_stats=>$tU:invite_status) = 0;
          $sht(term_stats=>$tU:source_port) = $sp;
          $sht(term_stats=>$tU:from_tag) = $ft;
          $sht(term_stats=>$tU:to_tag) = $tt;
          $sht(term_stats=>$tU:sip_method) = $rm;
          $sht(term_stats=>$tU:call_from) = $tU;
          $sht(term_stats=>$tU:user_agent) = $ua;
          $sht(term_stats=>$tU:media_type) = "TEXT";
          $sht(term_stats=>callid) = $sht(term_stats=>$tU:invite_callid);
          sql_query("cb", "INSERT INTO call_stats (imsi,sip_side,sip_method,register_callid,register_status,
            invite_status,call_to,call_from,media_type,invite_callid,from_tag,to_tag,ue_ip,src_ip,src_port,user_agent,msisdn,time_stamp,site_id)
            VALUES ('$sht(register_stats=>$tU:imsi)','$sht(register_stats=>$tU:sip_side)','$sht(term_stats=>$tU:sip_method)',
            '$sht(register_stats=>$tU:register_callid)','$sht(register_stats=>$tU:register)',
            '$sht(register_stats=>$tU:invite_status)','$sht(term_stats=>$tU:call_to)','$sht(term_stats=>$tU:call_from)',
            '$sht(term_stats=>$tU:media_type)','$sht(term_stats=>$tU:invite_callid)','$sht(term_stats=>$tU:from_tag)',
            '$sht(term_stats=>$tU:to_tag)','$sht(term_stats=>$tU:ue_ip)','$sht(term_stats=>$tU:source_ip)',
            '$sht(term_stats=>$tU:source_port)','$ua','$sht(register_stats=>$tU:msisdn)','$var(time_now)','$var(site_id)');");
        }else {
          $sht(term_stats=>$ci:invite_status) = 0;
          $sht(term_stats=>$ci:call_id) = $sht(term_stats=>callid);
          sql_query("cb", "UPDATE call_stats 
                              SET call_to = '$tU' , user_agent = '$ua'
                              WHERE invite_callid = '$sht(term_stats=>callid)';");
        }
      }

      if(is_method("INVITE"))
        sql_query("cb", "INSERT INTO call_stats (imsi,sip_side,sip_method,register_callid,register_status,
            invite_status,call_to,call_from,media_type,invite_callid,from_tag,to_tag,ue_ip,src_ip,src_port,user_agent,msisdn,time_stamp,site_id)
            VALUES ('$sht(register_stats=>$tU:imsi)','$sht(register_stats=>$tU:sip_side)','$sht(term_stats=>$tU:sip_method)',
            '$sht(register_stats=>$tU:register_callid)','$sht(register_stats=>$tU:register)',
            '$sht(register_stats=>$tU:invite_status)','$sht(term_stats=>$tU:call_to)','$sht(term_stats=>$tU:call_from)',
            '$sht(term_stats=>$tU:media_type)','$sht(term_stats=>$tU:invite_callid)','$sht(term_stats=>$tU:from_tag)',
            '$sht(term_stats=>$tU:to_tag)','$sht(term_stats=>$tU:ue_ip)','$sht(term_stats=>$tU:source_ip)',
            '$sht(term_stats=>$tU:source_port)','$ua','$sht(register_stats=>$tU:msisdn)','$var(time_now)','$var(site_id)');");

      t_relay();
    }


    route[CHARGING_CCR_TERM_REPLY]
    {
            xlog("L_DBG","cca_return code is $avp(s:cca_return_code)\n");

            switch ($avp(s:cca_return_code)){
                case 1: #success
                    xlog("L_DBG", "CCR success - will route message\n");
        route(FINAL_TERM);
                    break;
                case -1: #failure
                    xlog("L_ERR", "CCR failure - error response sent from module\n");
        switch ($avp(s:cca_result_code)){
          case 5030:
            send_reply("403", "Charging User not found");
                        break;
          case 5031:
            send_reply("403", "Rating failed");
                        break;
          case 4010:
            send_reply("402", "Payment required - Unsufficient funds");
                        break;
          case 5006:
            send_reply("486", "Line limit exceeded");
                        break;
          default:
            send_reply("402","Payment required ($avp(s:cca_result_code))");
                        break;
        }
                case -2: #error
                    xlog("L_ERR", "CCR error - error response sent from module\n");
        send_reply("500", "Charging Error");
                    break;
                default:
                    xlog("L_ERR", "Unknown return code from CCR: [$avp(s:cca_return_code)] \n");
        send_reply("500", "Charging Error");
                    break;
            }
            exit;
    }


    ######################################################################
    # Failure Route for Terminating requests
    ######################################################################
    failure_route[isc_term_failure]
    {
      xlog("L_DBG","ISC_term_failure\n");

      if (t_check_status("(408)|(5..)")){
        t_on_failure("isc_term_failure");       
        if (isc_match_filter("term","location")){
          xlog("L_DBG","Term - msg was fwded to AS\n");    
          exit;
        }

        if (lookup("location")) {
          if (uri==myself) {
            t_reply("404","Not Found - destination user not found on this S-CSCF");
            exit;
          }
        } else {
          t_reply("404","Not Found - destination user not found on this S-CSCF");
          exit;
        }
        t_relay();
      }
    }

    ######################################################################
    # Terminating, subsequent requests
    ######################################################################
    route[term_subsequent]
    {
      xlog("L_DBG","term_subsequent\n");
      route(apply_privacy);
      t_relay();
    }

    ######################################################################
    # Check for PSTN destinations:
    ######################################################################
    route[PSTN_handling]
    {
      # First, we translate "tel:"-URI's to SIP-URI's:
      # $ru:           tel:+(34)-999-888-777
      # $fu:           sip:test@foo.com
      # becomes $ru:   sip:+34999888777@foo.com;user=phone
      if (tel2sip2("$ru", "$fd", "$ru") < 0)
        xlog("L_WARN","Failed to convert $ru to a sip:-URI - M=$rm R=$ru F=$fu T=$tu IP=$si:$sp ID=$ci\n\n");

      if ($rU =~ "\+[0-9]+") {
        # Now let's check, if the number can be found in ENUM:
        if(!enum_query()) {
          # ENUM failed, send it to the PSTN-Gateway:
          route(PSTN);
          break;
        }
      }
    }

    ######################################################################
    # Send calls to the PSTN-Gateways:
    ######################################################################
    route[PSTN]
    {
      $var(has_trf) = 0;
      if (is_present_hf("Feature-Caps")) {
        xlog("Feature-Caps: $hdr(Feature-Caps) => $(hdr(Feature-Caps){param.value,+g.3gpp.trf}{nameaddr.uri}{uri.host})\n");
        if ($(hdr(Feature-Caps){param.value,+g.3gpp.trf}) != $null) {
          $rd = $(hdr(Feature-Caps){param.value,+g.3gpp.trf}{nameaddr.uri}{uri.host});
          if (!strempty($(ou{uri.params}))) {
            $ru = $ru+";"+$(ou{uri.params});
          }

          t_on_failure("TRF_failure");
          if (t_relay_to("0x02")) {
            $var(has_trf) = 1;
          } else {
            xlog("Relay to $du failed.\n");
            $du = $null;
          }
        }
      }

      if ($var(has_trf) == 0) {
        if (!ds_select_domain("1", "4")) {
          xlog("L_WARN","No PSTN-Gateways available - M=$rm R=$ru F=$fu T=$tu IP=$si:$sp ID=$ci\n\n");
          send_reply("503", "Service not available");
          exit;
        }
        if (!strempty($(ou{uri.params}))) {
          $ru = $ru+";"+$(ou{uri.params});
        }
        t_relay();
      }
      # Relay the request:
      t_on_failure("PSTN_failure");

      exit;
    }

    ######################################################################
    # manage failure routing cases, perform failover
    ######################################################################
    failure_route[TRF_failure] {
      xlog("TRF_failure\n");
      # Choose another gateway, in case we
      # - get a local generated "408"
      # - receive a 5xx or 6xx reply from the proxy.
      if (t_branch_timeout() || t_check_status("[5-6]..")) {
        $du = $null;
        if (!ds_select_domain("1", "4")) {
          xlog("L_WARN","No PSTN-Gateways available - M=$rm R=$ru F=$fu T=$tu IP=$si:$sp ID=$ci\n\n");
          send_reply("503", "Service not available");
          exit;
        }
        if (!strempty($(ou{uri.params}))) {
          $ru = $ru+";"+$(ou{uri.params});
        }
        # Relay the request:
        t_on_failure("PSTN_failure");

        t_relay();
        exit;
      }
    }

    ######################################################################
    # manage failure routing cases, perform failover
    ######################################################################
    failure_route[PSTN_failure] {
      # Choose another gateway, in case we
      # - get a local generated "408"
      # - receive a 5xx or 6xx reply from the proxy.
      if (t_branch_timeout() || t_check_status("[5-6]..")) {
        if (ds_next_domain()) {
          if (!strempty($(ou{uri.params}))) {
            $ru = $ru+";"+$(ou{uri.params});
          }
          # Do Failover in case problems:		
          t_on_failure("PSTN_failure");
          t_relay();
        } else {
          # Add a header, to indicate the phone should try again in 30 seconds.
          append_hf("Retry-After: 30\r\n");
          send_reply("503", "Service not available");
        }
        exit;
      }
    }

    #!ifdef WITH_HEALTH_CHECK_API
    event_route[xhttp:request] {
        xhttp_reply("200", "OK", "text/html", "OK");
    }
    #!endif


