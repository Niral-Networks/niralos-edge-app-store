apiVersion: v1
kind: ConfigMap
metadata:
  name: chf-config
  namespace: {{ .Release.Namespace }}
data:
  chfcfg.yaml: |
    info:
      version: 1.0.3
      description: CHF initial local configuration

    configuration:
      chfName: CHF
      sbi:
        scheme: http
        registerIPv4: __CHF_IP__
        bindingIPv4: __CHF_IP__
        port: 8000
        tls:
          pem: /chf/cert/chf.pem
          key: /chf/cert/chf.key

      nrfUri: http://__NRF_IP__:7777
      #nrfCertPem: /chf/cert/nrf.pem

      serviceNameList:
        - nchf-convergedcharging

      mongodb:
        name: niralos
        url: mongodb://mongo:27017

      timescale:
        dsn: postgres://{{ .Values.secrets.timescaledb.username }}:{{ .Values.secrets.timescaledb.password }}@localhost:5432/{{ .Values.secrets.timescaledb.database }}

      quotaValidityTime: 10000
      volumeLimit: 50000
      volumeLimitPDU: 10000
      volumeThresholdRate: 0.8

      cgf:
        enable: true
        hostIPv4: 127.0.0.1
        port: 2121
        listenPort: 2122
        passiveTransferPortRange:
          start: 2123
          end: 2130
        tls:
          pem: /chf/cert/chf.pem
          key: /chf/cert/chf.key
        cdrFilePath: /tmp

      abmfDiameter:
        protocol: tcp
        hostIPv4: __CHF_IP__
        port: 3868
        tls:
          pem: /chf/cert/chf.pem
          key: /chf/cert/chf.key

      rfDiameter:
        protocol: tcp
        hostIPv4: __CHF_IP__
        port: 3869
        tls:
          pem: /chf/cert/chf.pem
          key: /chf/cert/chf.key

    logger:
      enable: true
      level: info
      reportCaller: false

  chf_init.sh: |
    #!/bin/sh

    cp /mnt/chf/chfcfg.yaml /chf/chfcfg.yaml

    sed -i "s|__CHF_IP__|$CHF_IP|g" /chf/chfcfg.yaml
    sed -i "s|__NRF_IP__|$NRF_IP|g" /chf/chfcfg.yaml

