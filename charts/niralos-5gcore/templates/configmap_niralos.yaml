  smf.conf: |
    # This is a sample configuration file for freeDiameter daemon.
    #
    # Most of the options can be omitted, as they default to reasonable values.
    # Only TLS-related options must be configured properly in usual setups.
    #
    # It is possible to use "include" keyword to import additional files
    # e.g.: include "/etc/freeDiameter.d/*.conf"

    Identity = "smf.EPC_DOMAIN";
    Realm = "EPC_DOMAIN";

    ListenOn = "SMF_IP";

    TLS_Cred = "/niralos/install/etc/freeDiameter/smf.cert.pem", "/niralos/install/etc/freeDiameter/smf.key.pem";
    TLS_CA = "/niralos/install/etc/freeDiameter/cacert.pem";

    LoadExtension = "LD_LIBRARY_PATH/freeDiameter/dbg_msg_dumps.fdx" : "0x8888";
    LoadExtension = "LD_LIBRARY_PATH/freeDiameter/dict_rfc5777.fdx";
    LoadExtension = "LD_LIBRARY_PATH/freeDiameter/dict_mip6i.fdx";
    LoadExtension = "LD_LIBRARY_PATH/freeDiameter/dict_nasreq.fdx";
    LoadExtension = "LD_LIBRARY_PATH/freeDiameter/dict_nas_mipv6.fdx";
    LoadExtension = "LD_LIBRARY_PATH/freeDiameter/dict_dcca.fdx";
    LoadExtension = "LD_LIBRARY_PATH/freeDiameter/dict_dcca_3gpp.fdx";

    ConnectPeer = "pcrf.EPC_DOMAIN" {
        ConnectTo = "PCRF_IP";
        Port = PCRF_BIND_PORT;
        No_TLS;
    };

  make_certs.sh: |
    #!/bin/sh

    if [ 1 -ne $# ]
    then
        echo You must specify output directory : ./make_certs.sh ./freeDiameter
        exit
    fi

    rm -rf demoCA
    mkdir demoCA
    echo 01 > demoCA/serial
    touch demoCA/index.txt.attr
    touch demoCA/index.txt

    openssl rand -out /root/.rnd -hex 256

    openssl req -new -batch -x509 -days 3650 -nodes \
      -newkey rsa:1024 \
      -out $1/cacert.pem \
      -keyout cakey.pem \
      -subj /CN=ca.EPC_DOMAIN/C=IN/ST=Karntaka/L=Bengaluru/O=NiralNetworks/OU=5GC

    # mme
    openssl genrsa -out $1/mme.key.pem 1024
    openssl req -new -batch -out mme.csr.pem \
      -key $1/mme.key.pem \
      -subj /CN=mme.EPC_DOMAIN/C=IN/ST=Karntaka/L=Bengaluru/O=NiralNetworks/OU=5GC
    openssl ca -cert $1/cacert.pem -days 3650 \
      -keyfile cakey.pem \
      -in mme.csr.pem \
      -out $1/mme.cert.pem \
      -outdir . -batch

    # hss
    openssl genrsa -out $1/hss.key.pem 1024
    openssl req -new -batch -out hss.csr.pem \
      -key $1/hss.key.pem \
      -subj /CN=hss.EPC_DOMAIN/C=IN/ST=Karntaka/L=Bengaluru/O=NiralNetworks/OU=5GC
    openssl ca -cert $1/cacert.pem -days 3650 \
      -keyfile cakey.pem \
      -in hss.csr.pem \
      -out $1/hss.cert.pem \
      -outdir . -batch

    # smf
    openssl genrsa -out $1/smf.key.pem 1024
    openssl req -new -batch -out smf.csr.pem \
      -key $1/smf.key.pem \
      -subj /CN=smf.EPC_DOMAIN/C=IN/ST=Karntaka/L=Bengaluru/O=NiralNetworks/OU=5GC
    openssl ca -cert $1/cacert.pem -days 3650 \
      -keyfile cakey.pem \
      -in smf.csr.pem \
      -out $1/smf.cert.pem \
      -outdir . -batch

    # pcrf
    openssl genrsa -out $1/pcrf.key.pem 1024
    openssl req -new -batch -out pcrf.csr.pem \
      -key $1/pcrf.key.pem \
      -subj /CN=pcrf.EPC_DOMAIN/C=IN/ST=Karntaka/L=Bengaluru/O=NiralNetworks/OU=5GC
    openssl ca -cert $1/cacert.pem -days 3650 \
      -keyfile cakey.pem \
      -in pcrf.csr.pem \
      -out $1/pcrf.cert.pem \
      -outdir . -batch

    rm -rf demoCA
    rm -f 01.pem 02.pem 03.pem 04.pem
    rm -f cakey.pem
    rm -f mme.csr.pem hss.csr.pem smf.csr.pem pcrf.csr.pem
