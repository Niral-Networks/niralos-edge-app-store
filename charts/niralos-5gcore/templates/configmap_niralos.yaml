    #!ifdef CAPTURE_NODE
    # Destination, where to send the traffic
    modparam("siptrace", "db_url", "postgres://{{ .Values.secrets.timescaledb.username }}:{{ .Values.secrets.timescaledb.password }}@TIMESCALEDB_IP/{{ .Values.secrets.timescaledb.database }}")
    modparam("siptrace", "table", "sip_trace_pcscf")
    modparam("siptrace", "trace_table_avp", "$avp(siptrace_table)")
    modparam("siptrace", "duplicate_uri", CAPTURE_NODE)
    modparam("siptrace", "trace_id_avp", "$avp(trace_id)")
    modparam("siptrace", "site_id", "SITE_ID")
    # Trace all traffic
    modparam("siptrace", "trace_on", 1)
    modparam("siptrace", "trace_to_database", 1)
    modparam("siptrace", "trace_flag", FLT_CAPTURE)
    modparam("siptrace", "hep_mode_on", 1)
    #!endif

    # -- statistics params --
    modparam("statistics", "variable", "register_success")
    modparam("statistics", "variable", "register_failed")
    modparam("statistics", "variable", "register_time")

    # Main SIP request routing logic
    # - processing of any incoming SIP request starts with this route
    route {
    #!ifdef CAPTURE_NODE
        setflag(FLT_CAPTURE);
        xlog("L_INFO", "SIPTRACE LOG: [$ci] $rm from $si:$sp to $ru\n");
    #!endif
    ##!ifdef WITH_DEBUG
        xnotice("PCSCF: $rm $ru ($fu ($si:$sp) to $tu, $ci)\n");
    ##!endif

    #!ifdef WITH_WEBSOCKET
        if (($Rp == MY_WS_PORT || $Rp == MY_WSS_PORT) && !(proto == WS || proto == WSS)) {
            xlog("L_WARN", "Websocket-request received on SIP/$Rp\n");
            sl_send_reply("403", "Forbidden - Websocket-request received on SIP/$Rp");
            exit;
        }
    #!endif
        # per request initial checks
        route(REQINIT);

        # CANCEL processing
        if (is_method("CANCEL")) {
            if (t_check_trans()) {
                t_relay();
            }
            exit;
        }
        xlog("*****************$mb");
        if (is_method("NOTIFY") && (uri==myself)) {
            route(NOTIFY);
            exit;
        }

        # handle retransmissions
        if (!is_method("ACK")) {
            if(t_precheck_trans()) {
                t_check_trans();
                exit;
            }
        }
        #t_check_trans();

        # Check for Re-Transmissions
        t_check_trans();

        # handle requests within SIP dialogs
        route(WITHINDLG);

        ### only initial requests (no To tag)

        if (is_method("UPDATE")) {
            send_reply("403","Forbidden - Target refresh outside dialog not allowed");
            break;
        }
        if (is_method("BYE|PRACK")) {
            send_reply("403","Forbidden - Originating subsequent requests outside dialog not allowed");
            break;
        }

        #Set DLG flag to track dialogs using dialog2
        if (!is_method("REGISTER|SUBSCRIBE"))
            setflag(FLT_DIALOG);

        loose_route();
    #!ifdef WITH_SBC
        if (ds_is_from_list(DISPATCHER_LIST_SBC)) {
            if (is_method("INVITE")) {
                if (is_present_hf("C-Params")) {
                    remove_hf("Contact");
                    remove_hf("C-Params");
                    append_hf("Contact: $ct;$hdr(C-Params)\r\n");
                }
                if ($route_uri =~ "sip:mo@.*") {
                    # prepend mo as user for record route
                    $avp(RR_CUSTOM_USER_AVP)="mo";
                    if (is_present_hf("P-Route")) {
                        $du = $(hdr(P-Route){nameaddr.uri});
                        remove_hf("P-Route");
                        append_hf("Route: $hdr(P-Route)\r\n");
                    }
                    t_on_reply("SBC_GET_CPARAMS");
                }
                if ($route_uri =~ "sip:mt@.*") {
                    $du = $ru;
                    handle_ruri_alias();
                    if ($rc == 1) {
                        setflag(FLT_NAT);
                    }
                    xlog("$$dP => $(dP{s.tolower}) ($du)\n");
                    # prepend mo as user for record route
                    $avp(RR_CUSTOM_USER_AVP)="mt";
                    if ($(dP{s.tolower}) == "tls") {
                        route(ENC_SRTP);
                    } else if ($(dP{s.tolower}) == "ws") {
                        # Even WSS is incorrectly shown as WS
                        route(ENC_WSS_RTP);
                    } else if ($(dP{s.tolower}) == "wss") {
                        route(ENC_WSS_RTP);
                    } else {
                        route(ENC_RTP);
                    }
                    # Handle NAT
                    route(NATMANAGE);
                    # Handle Mobile Terminated requests
                    route(MT);
                }
            }
            if (is_method("REGISTER")) {
                append_hf("Path: <sip:term@$Ri:$Rp;lr>\r\n");
            }
        } else {
    #!endif
            if ($route_uri =~ "sip:term@.*") {
    #!ifdef WITH_SBC
    #!ifdef WITH_SBC_CALL
                if (is_method("INVITE")) {
    #!endif
                    if (!strempty($(ct{tobody.params}))) {
                        append_hf("C-Params: $(ct{tobody.params})\r\n");
                    }

                    append_hf("SBC: mt\r\n");
                    # Do some Round-Robin on the SBC's
                    t_on_failure("SBC_failure");
                    # Choose an SBC to send the call to:
                    if (!ds_select_dst(DISPATCHER_LIST_SBC, "4")) {
                        send_reply("503", "Service Unavailable (SBC failure)");
                        exit;
                    }
    #!ifdef WITH_SBC_CALL
                }
    #!endif
    #!else
                handle_ruri_alias();
                if ($dP == "tls") {
                    route(ENC_SRTP);
                } else if ($dP == "ws") {
                    route(ENC_WS_RTP);
                } else if ($dP == "wss") {
                    route(ENC_WSS_RTP);
                } else {
                    route(ENC_RTP);
                }
                if ($rc == 1) {
                    setflag(FLT_NAT);
                }
                # Handle NAT
                route(NATMANAGE);
                # prepend mo as user for record route
                $avp(RR_CUSTOM_USER_AVP)="mt";
                route(MT);
    #!endif
            } else {
                force_rport();
                if(is_method("INVITE|SUBSCRIBE|UPDATE|REGISTER")) {
                    add_contact_alias();
                }
                setflag(FLT_NAT);

                if (is_method("REGISTER")) {
                    route(REGISTER);
                    exit;
                }

                # prepend mo as user for record route
                $avp(RR_CUSTOM_USER_AVP)="mo";
                # Set Flag for MO:
                setflag(FLT_MOBILE_ORIG);
                # Increase timer for inbound requests, we may have to do failover:
                t_set_fr(120000, 30000);
                route(MO);
                if (is_method("INVITE")) {
                    # SRTP in RTP übersetzen
                    if ($pr == "tls") {
                        route(DEC_SRTP);
                    } else if ($pr == "ws") {
                        route(DEC_WS_RTP);
                    } else if ($pr == "wss") {
                        route(DEC_WSS_RTP);
                    } else {
                        route(DEC_RTP);
                    }
                    # Handle NAT
                    route(NATMANAGE);
                }
    #!ifdef WITH_SBC
    #!ifdef WITH_SBC_CALL
                if (is_method("INVITE")) {
    #!endif
                    # Apply changes to this message
                    msg_apply_changes();
                    # Copy Route-Header:
                    append_hf("P-Route: $hdr(Route)\r\n");
                    if (!strempty($(ct{tobody.params}))) {
                        append_hf("C-Params: $(ct{tobody.params})\r\n");
                    }
                    append_hf("SBC: mo\r\n");
                    # Do some Round-Robin on the SBC's
                    t_on_failure("SBC_failure");
                    # Choose an SBC to send the call to:
                    if (!ds_select_dst(DISPATCHER_LIST_SBC, "4")) {
                        send_reply("503", "Service Unavailable (SBC failure)");
                        exit;
                    }
    #!endif
    #!ifdef WITH_SBC_CALL
                }
    #!endif
            }
    #!ifdef WITH_SBC
        }
    #!endif
        if (is_method("INVITE|SUBSCRIBE")) {
            # record routing for dialog forming requests (in case they are routed)
            record_route();
        }

        # Forward request:
        route(RELAY);
        exit;
    }

    route[SBC_GET_CPARAMS] {
        if (!strempty($(ct{tobody.params}))) {
            append_hf("C-Params: $(ct{tobody.params})\r\n");
        }
    }

    # Per SIP request initial checks
    route[REQINIT] {
        # Reply to OPTIONS:
        if (is_method("OPTIONS") && (uri==myself)) {
            options_reply();
            exit;
        }

        $var(used) = 1 - ($stat(free_size) / $stat(total_size));
        xlog("L_DBG", "Mem: Total $stat(total_size), Free $stat(free_size) [$var(used)% used]\n");
        if ($var(used) > 95) {
            send_reply("503", "Server overloaded");
            exit;
        }

    #!ifdef CAPTURE_NODE
        if (isflagset(FLT_CAPTURE)) {
            route(SIPTRACE_CHECK);
        }
    #!endif

    #!ifdef WITH_ANTIFLOOD
        # flood dection from same IP and traffic ban for a while
        # be sure you exclude checking trusted peers, such as pstn gateways
        # - local host excluded (e.g., loop to self)
        if (!has_totag() && (src_ip!=myself) && !ds_is_from_list())
        {
            if($sht(ipban=>$si)!=$null)
            {
                # ip is already blocked
                xlog("request from blocked IP - $rm from $fu (IP:$si:$sp)\n");
                xlog("Blocking traffic from $si\n");
                exit;
            }
            if (!pike_check_req()) {
                xlog("L_ALERT","ALERT: pike blocking $rm from $fu (IP:$si:$sp, $ua)\n");
                xlog("Blocking traffic from $si\n");
                $sht(ipban=>$si) = 1;
                exit;
            }
        }
            if ((uri == myself) && is_method("INVITE|REGISTER")) {
                    xlog("L_ALERT","ALERT: Request to myself: $ru from $fu (IP:$si:$sp, $ua), Blocking\n");
            xlog("Blocking traffic from $si\n");
                    $sht(ipban=>$si) = 1;
                    exit;
            }
    #!endif

        if (!mf_process_maxfwd_header("10")) {
            sl_send_reply("483","Too Many Hops");
            exit;
        }

        if(!sanity_check("1511", "7")) {
            xlog("Malformed SIP message from $si:$sp\n");
            exit;
        }

        # Check for shutdown mode:
        if (!has_totag() && ($sel(cfg_get.system.shutdownmode) > 0)) {
            send_reply("503", "Server shutting down");
            exit;
        }

        # Ignore Re-Transmits:
        if (t_lookup_request()) {
            exit;
        }

        if (is_method("INVITE|REGISTER")) {
            send_reply("100", "Trying");
        }
    }
    route[SIPTRACE_CHECK] {
        if ($rm == "NOTIFY") {
            xdbg("P-CSCF SIPTRACE: skipping NOTIFY Call-ID=$ci\n");
            return;
            }

        $var(imsi)   = "";
        $var(msisdn) = "";
        $var(id)     = "";

        if ($hdr(P-Asserted-Identity) != "") {
            $var(id) = $hdr(P-Asserted-Identity);
        }

        else if ($hdr(From) != "") {
            $var(id) = $hdr(From);
        }

        else if ($hdr(To) != "") {
            $var(id) = $hdr(To);
        }

        if ($var(id) != "") {
            $var(id) = $(var(id){re.subst,/.*(sip|tel):([^@;>]+).*/\2/});
        }

        if ($var(id) =~ "^[0-9]{15}$") {
            $var(imsi) = $var(id);
        } else if ($var(id) =~ "^[0-9]{3,15}$") {
            $var(msisdn) = $var(id);
        }

        if ($var(imsi) == "" && $fU =~ "^[0-9]{15}$") {
            $var(imsi) = $fU;
        }

        xlog("L_INFO",
            "SIPTRACE: $rm parsed IMSI=<$var(imsi)> MSISDN=<$var(msisdn)> "
            "ID=<$var(id)> Call-ID=$ci\n");

        if ($var(imsi) == "" && $var(msisdn) == "") {
            xdbg("SIPTRACE: no identity -> skip\n");
            return;
        }
        $avp(trace_id) = $null;
        sql_query("cb",
        "SELECT trace_id, trace_status "
        "FROM ims_trace_filters "
        "WHERE (imsi='$var(imsi)' OR msisdn='$var(msisdn)') "
        "AND (expires_at IS NULL OR expires_at > now()) "
        "ORDER BY created_at DESC "
        "LIMIT 1",
        "ra");

        if ($dbr(ra=>rows) > 0) {
            if ($dbr(ra=>[0,1]) == 1) {
                $avp(trace_id) = $dbr(ra=>[0,0]);
                $avp(siptrace_table) = "sip_trace_pcscf";
                sip_trace();
            } else {
                xlog("L_INFO", "SIPTRACE: disabled (status=0) for imsi=$var(imsi) msisdn=$var(msisdn)\n");
            }
        }
        else {
            xlog("L_INFO","SIPTRACE: not enabled (OR) for imsi=$var(imsi) msisdn=$var(msisdn)\n");
        }
        sql_result_free("ra");
    }

    route[RELAY] {
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    # Handle requests within SIP dialogs
    route[WITHINDLG] {
        if (has_totag()) {
            xnotice("Within DLG\n");
            # sequential request withing a dialog should
            # take the path determined by record-routing
            if (loose_route()) {
                xnotice("Within loose route\n");
                if(!isdsturiset()) {
                    handle_ruri_alias();
                    #if ($rc == 1) {
                    #   $ru = "sip:" + $rU + "@" + $dd + ":" + $dp + ";transport=" + $rP;
                    #}
                }

                if ( is_method("ACK") && ($sht(contact=>$ci) != $null) ) {
                    xlog("Contact of Reply: $sht(contact=>$ci) ($ci)\n");
                    $ru = $sht(contact=>$ci);
                }

                if ($route_uri =~ "sip:mt@.*") {
                    route(MT_indialog);
                } else {
                    route(MO_indialog);
                }

                # Handle NAT
                route(NATMANAGE);

                route(RELAY);
                exit;
            }
            if ( is_method("ACK") ) {
                xlog("Contact of Reply: $T_rpl($ct)\n");
                if ( t_check_trans() ) {
                    # no loose-route, but stateful ACK;
                    # must be an ACK after a 487
                    # or e.g. 404 from upstream server
                    t_relay();
                    exit;
                } else {
                    # ACK without matching transaction ... ignore and discard
                    exit;
                }
            }
            sl_send_reply("404","Not here");
            exit;
        }
    }

    ######################################################################
    # Negative replies to REGISTER requests:
    ######################################################################
    failure_route[SBC_failure] {
    #!ifdef WITH_IPBLOCK
        if (is_method("REGISTER") && !ds_is_from_list()) {
            if (t_check_status("403|[5-6][0-9][0-9]")) {
                if ($sht(failedauth=>$si) != $null)
                    $sht(failedauth=>$si) = $sht(failedauth=>$si) + 1;
                else
                    $sht(failedauth=>$si) = 1;
                if ($sht(failedauth=>$si) > 10) {
                    xlog("L_ALERT","ALERT: blocking $rm from $fu (IP:$si:$sp), more than 5 failed auth requests!\n");
                    xlog("Blocking traffic from $si\n");
                    $sht(ipban=>$si) = 1;
                }
            }
        }
    #!endif
        # Choose another gateway, in case we
        # - get a local generated "408"
        # - receive a 5xx or 6xx reply from the proxy.
        if (t_branch_timeout() || t_check_status("[5-6]..")) {
            if (ds_next_dst()) {
                # Do Failover in case problems:
                t_on_failure("SBC_failure");
                t_relay();
            } else {
                # Add a header, to indicate the phone should try again in 30 seconds.
                append_hf("Retry-After: 30\r\n");
                send_reply("504", "Server Time-Out");
            }
            exit;
        }
    }

    # Notify Route:                                                     #
    #####################################################################
    route[NOTIFY]
    {
        xlog("L_DBG", "IMS: INSIDE NOTIFY\n");
        if (reginfo_handle_notify("pcscf_location")) {
            send_reply("200","OK - P-CSCF processed notification");
            break;
        } else {
            t_reply("500","Error encountered while processing notification");
            break;
        }
    }

    #!ifdef WITH_NATPING
    # NATPING Route:                                                    #
    #####################################################################
    route[NATPING] {
        route(preload_pcscf);

        sht_lock("natping=>natpinglock");
        sht_iterator_start("nat_iterator", "natping");
        while(sht_iterator_next("nat_iterator")) {
            xnotice("OPTIONS to $shtitval(nat_iterator) via $shtitkey(nat_iterator)...\n");
            $uac_req(method) = "OPTIONS";
            $uac_req(ruri) = $shtitval(nat_iterator);
            $uac_req(furi) = PCSCF_URL;
            $uac_req(sock) = $sht(natpingfrom=>$shtitkey(nat_iterator));
            $uac_req(turi) = $shtitval(nat_iterator);
            $uac_req(ouri) = $shtitkey(nat_iterator);
            $uac_req(evroute) = 1;
            uac_req_send();
        }
        sht_iterator_end("nat_iterator");
        sht_unlock("natping=>natpinglock");
    }

    event_route[uac:reply] {
    ##!ifdef WITH_DEBUG
        xnotice("request sent to $uac_req(ruri) completed with code: $uac_req(evcode), Type $uac_req(evtype)\n");
    ##!endif
        if (($uac_req(evtype) != 1) || ($uac_req(evcode) != 200)) {
            if ($sht(natpingfail=>$uac_req(ouri)) == $null) {
                $sht(natpingfail=>$uac_req(ouri)) = 1;
            } else {
                $sht(natpingfail=>$uac_req(ouri)) = $sht(natpingfail=>$uac_req(ouri)) + 1;
            }
            xlog("  request sent to $uac_req(ruri): Fail Counter is $sht(natpingfail=>$uac_req(ouri))\n");
            if ($sht(natpingfail=>$uac_req(ouri)) > 10) {
                if ($(uac_req(ouri){uri.transport}) == "tcp") {
                    $var(alias) = "alias="+$(uac_req(ouri){uri.host})+"~"+$(uac_req(ouri){uri.port})+"~2";
                } else if ($(uac_req(ouri){uri.transport}) == "tls") {
                    $var(alias) = "alias="+$(uac_req(ouri){uri.host})+"~"+$(uac_req(ouri){uri.port})+"~3";
                } else {
                    $var(alias) = "alias="+$(uac_req(ouri){uri.host})+"~"+$(uac_req(ouri){uri.port})+"~1";
                }
                xlog("  Unregistering $uac_req(ruri);$var(alias)\n");
                setdebug("9");
    #!ifdef WITH_IPSEC
                ipsec_destroy_by_contact("pcscf_location", "$uac_req(ruri);$var(alias)", "$(uac_req(ouri){uri.host})", "$(uac_req(ouri){uri.port})");
    #!endif
                pcscf_unregister("pcscf_location", "$uac_req(ruri);$var(alias)", "$(uac_req(ouri){uri.host})", "$(uac_req(ouri){uri.port})");
                resetdebug();
                sht_lock("natping=>natpinglock");
                $sht(natping=>$uac_req(ouri)) = $null;
                sht_unlock("natping=>natpinglock");
                $sht(natpingfail=>$uac_req(ouri)) = $null;

                sht_lock("natpingfrom=>natpingfromlock");
                $sht(natpingfrom=>$uac_req(ouri)) = $null;
                sht_unlock("natpingfrom=>natpingfromlock");
                $sht(natpingfail=>$uac_req(ouri)) = $null;
            }
        } else {
            $sht(natpingfail=>$uac_req(ouri)) = $null;
        }
    }

    event_route[htable:expired:natping] {
        xlog("natping record expired $shtrecord(key) => $shtrecord(value)\n");
    }

    event_route[htable:mod-init] {
        xlog("event_route[htable:mod-init] \n");
    }

    route[preload_pcscf] {
        if ($shv(preload_pcscf) == 1) return;
        $shv(preload_pcscf) = 1;

        sql_query("pcscf", "select aor, received, received_port, received_proto from pcscf_location;", "resultset");
        xlog("L_INFO", "Preloading NAT-PING. Rows: $dbr(resultset=>rows)\n");
        if($dbr(resultset=>rows)>0) {
            $var(i) = 0;
            while($var(i) < $dbr(resultset=>rows)) {
                $var(ouri) = "sip:"+$dbr(resultset=>[$var(i),1])+":"+$dbr(resultset=>[$var(i),2]);
                if ($dbr(resultset=>[$var(i),3]) == 2) {
                    $var(ouri) = $var(ouri)+";transport=tcp";
                } else if ($dbr(resultset=>[$var(i),3]) == 3) {
                    $var(ouri) = $var(ouri)+";transport=tls";
                }
                $var(noalias) = $(dbr(resultset=>[$var(i),0]){re.subst,/^(.*);alias=.*/\1/}{nameaddr.uri});
                # xlog("$$var(noalias) => $var(noalias) (via $var(ouri))\n");
                sht_lock("natping=>natpinglock");
                $sht(natping=>$var(ouri)) = $var(noalias);
                sht_unlock("natping=>natpinglock");
                $var(i) = $var(i) + 1;
            }
        }
        sql_result_free("resultset");
    }
    #!endif

    #!ifdef WITH_N5

    # 5G N5 HTTP2 Server routing script basic code
    event_route[nghttp2:request] {
        xinfo("request: $nghttp2(method) - url: $nghttp2(path) - data: [$nghttp2(data)]\n");

        // Check if the requested URL is /nf-status-notify
        if ($nghttp2(path) == "/nf-status-notify") {
            nghttp2_reply_header("Content-Type", "text/html");
            nghttp2_reply_header("Server:", "AF");
            nghttp2_reply("200", "<html><body>PCF registered at PCSCF</body></html>");
        } else if ($nghttp2(path) == "/terminate") {
           nghttp2_reply_header("accept", "application/json");
           nghttp2_reply_header("accept", "application/problem+json");
           nghttp2_reply_header("Content-Type", "application/json");
           nghttp2_reply_header("Server", "AF");
           nghttp2_reply("204", "No Content");
       } else {
           // Optionally handle other URLs or do nothing
           nghttp2_reply_header("accept", "application/json");
           nghttp2_reply_header("accept", "application/problem+json");
           nghttp2_reply_header("Content-Type", "application/json");
           nghttp2_reply_header("Server", "AF");
           nghttp2_reply("404", "Not Found");
       }
    }

    route[NRF_NFM] {
        if ($var(n5_hb_fail_count) > 5) {
            xlog("L_ERR", "PCSCF NF no longer registered at SCP. Re-attempting registration!!\n");
            $var(n5_initalized) = 0;
        }

        $var(time_now) = $_s($timef(%a, %d %b %Y %H:%M:%S %Z));

        # TODO: Send at heartbeat intervals received in reponse to NF registration
        if ($var(n5_initalized) == 1) {
            # Send Heartbeat
            $var(nf_hb_headers) = "content-type: application/json-patch+json\r\n";
            $var(nf_hb_headers) = $var(nf_hb_headers) + "accept: application/json,application/problem+json\r\n";
            $var(nf_hb_headers) = $var(nf_hb_headers) + "3gpp-sbi-discovery-target-nf-type: NRF\r\n";
            $var(nf_hb_headers) = $var(nf_hb_headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
            $var(nf_hb_headers) = $var(nf_hb_headers) + "3gpp-sbi-discovery-service-names: nnrf-nfm\r\n";
            $var(nf_hb_headers) = $var(nf_hb_headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

            $var(nf_hb_json_body) ='[]';
            $var(nf_hb_body) = '{
                "op": "replace",
                "path": "/nfStatus",
                "value": "REGISTERED"
            }';
            jansson_append("obj", "", $var(nf_hb_body), "$var(nf_hb_json_body)");
            $var(nf_hb_body) = '{
                "op": "replace",
                "path": "/load",
                "value": 0
            }';
            jansson_append("obj", "", $var(nf_hb_body), "$var(nf_hb_json_body)");

            http_client_request_v2pk("PATCH", "http://SCP_BIND_IP:SCP_BIND_PORT/nnrf-nfm/v1/nf-instances/$var(pcscf_uuid)", "$var(nf_hb_json_body)", "$var(nf_hb_headers)", "$var(nf_hb_result)");
            switch ($rc) {
                case 204:
                    $var(n5_hb_fail_count) = 0;
                    break;
                default:
                    $var(n5_hb_fail_count) = $var(n5_hb_fail_count) + 1;
                    return;
            }
            return;
        }

        # Generate UUID for PCSCF
        $var(pcscf_uuid) = $uuid(g);

        # Register NF
        $var(nf_reg_headers) = "content-type: application/json\r\n";
        $var(nf_reg_headers) = $var(nf_reg_headers) + "accept: application/json,application/problem+json\r\n";
        $var(nf_reg_headers) = $var(nf_reg_headers) + "3gpp-sbi-discovery-target-nf-type: NRF\r\n";
        $var(nf_reg_headers) = $var(nf_reg_headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
        $var(nf_reg_headers) = $var(nf_reg_headers) + "3gpp-sbi-discovery-service-names: nnrf-nfm\r\n";
        $var(nf_reg_headers) = $var(nf_reg_headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

        $var(nf_reg_body) = '{
            "nfInstanceId": "PCSCF_UUID",
            "nfType":   "AF",
            "nfStatus": "REGISTERED",
            "ipv4Addresses": ["N5_BIND_IP"],
            "allowedNfTypes": ["SCP", "PCF"],
            "priority": 0,
            "capacity": 100,
            "load": 0,
            "nfServiceList": {
                "PCSCF_UUID": {
                    "serviceInstanceId": "PCSCF_UUID",
                    "serviceName": "npcf-policyauthorization",
                    "versions": [
                        {
                            "apiVersionInUri": "v2",
                            "apiFullVersion": "2.0.0"
                        }
                    ],
                    "scheme": "http",
                    "nfServiceStatus": "REGISTERED",
                    "ipEndPoints": [
                        {
                            "ipv4Address": "N5_BIND_IP",
                            "port": N5_BIND_PORT
                        }
                    ],
                    "allowedNfTypes": [
                        "PCF"
                    ],
                    "priority": 0,
                    "capacity": 100,
                    "load": 0
                }
            },
            "nfProfileChangesSupportInd": true
        }';
        $var(nf_reg_body) = $(var(nf_reg_body){re.subst,/PCSCF_UUID/$var(pcscf_uuid)/g});
        jansson_append("obj", "", "$var(nf_reg_body)", "$var(nf_reg_json_body)");

        http_client_request_v2pk("PUT", "http://SCP_BIND_IP:SCP_BIND_PORT/nnrf-nfm/v1/nf-instances/$var(pcscf_uuid)", "$var(nf_reg_json_body)", "$var(nf_reg_headers)", "$var(nf_reg_result)");
        switch ($rc) {
            case 201:
                xlog("L_INFO", "P-CSCF NF registered successfully at SCP\n");
                $var(n5_initalized) = 1;
                $var(n5_hb_fail_count) = 0;
                route(NRF_NFM_SUBSCRIBE_PCF);
                break;
            default:
                xlog("L_ERR", "P-CSCF NF failed to register at SCP with code=$rc\n");
                return;
        }
    }

    route[NRF_NFM_SUBSCRIBE_PCF] {
        # Subscribe to PCF NF registration notification
        $var(time_now) = $_s($timef(%a, %d %b %Y %H:%M:%S %Z));
        $var(pcf_subc_headers) = "content-type: application/json\r\n";
        $var(pcf_subc_headers) = $var(pcf_subc_headers) + "accept: application/json,application/problem+json\r\n";
        $var(pcf_subc_headers) = $var(pcf_subc_headers) + "3gpp-sbi-discovery-target-nf-type: NRF\r\n";
        $var(pcf_subc_headers) = $var(pcf_subc_headers) + "3gpp-sbi-callback: Nnrf_NFManagement_NFStatusNotify\r\n";
        $var(pcf_subc_headers) = $var(pcf_subc_headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
        $var(pcf_subc_headers) = $var(pcf_subc_headers) + "3gpp-sbi-discovery-service-names: nnrf-nfm\r\n";
        $var(pcf_subc_headers) = $var(pcf_subc_headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

        $var(pcf_subc_body) = '{
            "nfStatusNotificationUri": "http://N5_BIND_IP:N5_BIND_PORT/nnrf-nfm/v1/nf-status-notify",
            "reqNfInstanceId": "PCSCF_UUID",
            "subscrCond": {
                "nfType": "PCF"
            },
            "reqNfType": "AF",
            "requesterFeatures": "1"
        }';
        $var(pcf_subc_body) = $(var(pcf_subc_body){re.subst,/PCSCF_UUID/$var(pcscf_uuid)/g});
        jansson_append("obj", "", "$var(pcf_subc_body)", "$var(pcf_subc_json_body)");

        http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/nnrf-nfm/v1/subscriptions", "$var(pcf_subc_json_body)", "$var(pcf_subc_headers)", "$var(pcf_subc_result)");
        switch ($rc) {
            case 201:
                xlog("L_INFO", "P-CSCF NF subscribed for PCF NF registration notification\n");
                break;
            default:
                xlog("L_ERR", "P-CSCF NF failed to subscribe for PCF NF registration notification\n");
                return;
        }
    }
    #!endif

    #!ifdef WITH_HEALTH_CHECK_API
    event_route[xhttp:request] {
        xhttp_reply("200", "OK", "text/html", "OK");
    }
    #!endif

    #!ifdef WITH_XMLRPC
    include_file "route/xmlrpc.cfg"
    #!endif
    #!ifdef WITH_WEBSOCKET
    include_file "route/websocket.cfg"
    #!endif
    include_file "route/register.cfg"
    include_file "route/rtp.cfg"
    include_file "route/mo.cfg"
    include_file "route/mt.cfg"

---

apiVersion: v1
data:
  dispatcher.list: |
    # SBC's
  tls.cfg: |
    #
    # TLS Configuration File
    #

    # This is the default server domain, settings
    # in this domain will be used for all incoming
    # connections that do not match any other server
    # domain in this configuration file.
    #
    [server:default]
    method = SSLv23
    verify_certificate = no
    require_certificate = no
    private_key = /etc/kamailio/kamailio-selfsigned.key
    certificate = /etc/kamailio/kamailio-selfsigned.pem
kind: ConfigMap
metadata:
  name: pcscf-extra-config
  namespace: {{ .Release.Namespace }}
---

apiVersion: v1
data:
  mo.cfg: |
    ######################################################################
    # Originating, Intial Requests
    ######################################################################
    route[MO]
    {
            # Strip Transport from RURI:
            $ru = $(ru{re.subst,/;transport=[A-Za-z]*//g});
            xnotice("PCSCF MO: \n Destination URI: $du\n Request URI: $ru\n");
        xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
        xnotice("Received IP and Port: ($Ri:$Rp)\n");
        xnotice("Contact header: $ct\n");

            # Process route headers, if any:
            loose_route();
            if (!pcscf_is_registered("pcscf_location")) {
                    send_reply("403","Forbidden - You must register first with a S-CSCF");
                    exit;
            }

            # We do not trust the user, let's remove the P-Asserted-Identity, if any:
            remove_hf("P-Asserted-Identity");
            remove_hf("P-Preferred-Identity");

            # Add P-Charging-Vector
            sip_p_charging_vector("g");

            if (is_present_hf("P-Preferred-Identity") && pcscf_assert_identity("pcscf_location", "$hdr(P-Preferred-Identity)") && $hdr(P-Preferred-Identity) =~ "sip:.*") {
                    append_hf("P-Asserted-Identity: $hdr(P-Preferred-Identity)\r\n");
            } else if (is_present_hf("P-Asserted-Identity") && pcscf_assert_identity("pcscf_location", "$hdr(P-Asserted-Identity)") && $hdr(P-Asserted-Identity) =~ "sip:.*") {
                    append_hf("P-Asserted-Identity: $hdr(P-Asserted-Identity)\r\n");
            } else if (pcscf_assert_identity("pcscf_location", "$(fu{tobody.uri})")) {
                    # For broken SIP implementation in Samsung devices
                    if ($fu =~ "tel:.*") {
                            $var(new_hdr) = $(fu{tobody.uri}) + "@NETWORKNAME";
                            $var(new_hdr) = $(var(new_hdr){re.subst,/tel:/sip:/g});
                            append_hf("P-Asserted-Identity: <$var(new_hdr)>\r\n");
                            $fu = $var(new_hdr);
                    } else {
                            append_hf("P-Asserted-Identity: <$(fu{tobody.uri})>\r\n");
                    }
            } else {
                    append_hf("P-Asserted-Identity: <$pcscf_asserted_identity>\r\n");
            }

            if (!pcscf_follows_service_routes("pcscf_location")){
                    #Variant 1 - deny access to the network
                    #send_reply("400","Bad Request - Not following indicated service routes");
                    #break;

                    #Variant 2 - enforce routes and let the dialog continue
                    pcscf_force_service_routes("pcscf_location");
            }

            # add IBCF/THIG route here if required
            # Check for "sec-agree" in the Require header:
            if (is_present_hf("Require") && $hdr(Require) =~ ".*sec-agree.*") {
                    # Remove the old Require-Header:
                    remove_hf("Require");
                    # Replace ", sec-agree" with ""
                    $var(new_hdr) = $(hdr(Require){re.subst,/[, ]*sec-agree//gi});
                    if ($(var(new_hdr){s.len}) > 0) {
                            append_hf("Require: $var(new_hdr)\r\n");
                    }
            }

            # Check for "sec-agree" in the Proxy-Require header:
            if (is_present_hf("Proxy-Require") && $hdr(Proxy-Require) =~ ".*sec-agree.*") {
                    # Remove the old Proxy-Require-Header:
                    remove_hf("Proxy-Require");
                    # Replace ", sec-agree" with ""
                    $var(new_hdr) = $(hdr(Proxy-Require){re.subst,/[, ]*sec-agree//gi});
                    if ($(var(new_hdr){s.len}) > 0) {
                            append_hf("Proxy-Require: $var(new_hdr)\r\n");
                    }
            }
            remove_hf("Security-Verify");


    #!ifdef WITH_N5
          if(is_method("INVITE")) {
              route(N5_INIT_REQ);
                    }
    #!endif

    #!ifdef TRF_FUNCTION
            $var(trf) = TRF_FUNCTION;
            # Check for "sec-agree" in the Proxy-Require header:
            if (is_present_hf("Feature-Caps")) {
                    # Remove the old Proxy-Require-Header:
                    remove_hf("Feature-Caps");
                    append_hf("Feature-Caps: $hdr(Feature-Caps);+g.3gpp.trf=\"<sip:$var(trf);lr>\"\r\n");
            } else {
                    append_hf("Feature-Caps: *;+g.3gpp.trf=\"<sip:$var(trf);lr>\"\r\n");
            }
    #!endif
            # Add a visited Network-ID-Header:
            if (is_present_hf("P-Visited-Network-ID")) {
                    $var(new_hdr) = "NETWORKNAME, "+$hdr(P-Visited-Network-ID);
                    append_hf("P-Visited-Network-ID: $var(new_hdr)\r\n");
            } else {
                    append_hf("P-Visited-Network-ID: NETWORKNAME\r\n");
            }
            set_dlg_profile("orig");
            t_on_reply("MO_reply");
    }


    #################################
    ## Route Logic for N5 Requests ##
    #################################
    #!ifdef WITH_N5
    route[N5_INIT_REQ] {

    ## Storing IDs and IPs from UE into variables to use them later in the N5 Request:


        $var(orig_ue_ip) = $si;
        $var(orig_ue_port) = $sp;
        $var(pcscf_ip) = $Ri;
        $var(pcscf_port) = $Rp;

    # now checking it on console if I got what I wanted :
        xlog("L_INFO", "connection Info for UE $var(orig_ue_ip) $var(orig_ue_port)\n");
        xlog("L_INFO", "connection Info for P-CSCF is: $var(pcscf_ip) $var(pcscf_port)\n");

    # now trying some way to store IP of Orig UE
        $var(user_id_req_ip) = $fU; # should get the user part of the Orig UE from request

        # Store the IP in the hash table associated with the UE
        $sht(user_sip_ips=>$var(user_id_req_ip)) = $var(orig_ue_ip);
        xlog("L_INFO", "IP Info for UE MSISDN $var(user_id_req_ip): $var(orig_ue_ip)\n");

    # now trying some way to store Port of Orig UE
        $var(user_id_req_port) = $fU; # should get the user part of the Orig UE from request

        # Store the Port in the hash table associated with the UE
        $sht(user_sip_ports=>$var(user_id_req_port)) = $var(orig_ue_port);
        xlog("L_INFO", "Port Info for UE MSISDN $var(user_id_req_port): $var(orig_ue_port)\n");

    ## now saving SDP Info from UE to variables to use them later in the N5 Flow Fdecs :

    $var(sdp_src_ip) = $sdp(c:ip);
    $var(sdp_src_port) = $sdp(m0:rtp:port);
    $var(sdp_src_rtcp_port) = $sdp(m0:rtcp:port);
    $var(sdp_mline_raw) = $sdp(m0:raw);

    xlog("L_INFO", "SDP Info : Connection IP is $var(sdp_src_ip) Port is $var(sdp_src_port) Mline dump $var(sdp_mline_raw) \n");

    # now trying some way to store SDP SRC_IP of Orig UE
        $var(user_id_sdp_ip) = $fU; # should get the user part of the Orig UE from request

        # Store the AppSession in the hash table associated with the UE
        $sht(user_sdps_ip=>$var(user_id_sdp_ip)) = $var(sdp_src_ip);
        xlog("L_INFO", "SDP SRC_IP of Orig UE $var(user_id_sdp_ip): $var(sdp_src_ip)\n");

    # now trying some way to store SDP Media_Port of Orig UE
        $var(user_id_sdp_port) = $fU; # should get the user part of the Orig UE from request

        # store SDP Media_Port in the hash table associated with the UE
        $sht(user_sdps_port=>$var(user_id_sdp_port)) = $var(sdp_src_port);
        xlog("L_INFO", "SDP Media_Port of Orig UE $var(user_id_sdp_port): $var(sdp_src_port)\n");

    # now trying some way to store SDP RTCP_Media_Port of Orig UE
        $var(user_id_sdp_rtcp_port) = $fU; # should get the user part of the Orig UE from request

        # Store the RTCP_Media_Port in the hash table associated with the UE
        $sht(user_sdps_rtcp_port=>$var(user_id_sdp_rtcp_port)) = $var(sdp_src_rtcp_port);
        xlog("L_INFO", "SDP RTCP_Media_Port of Orig UE $var(user_id_sdp_rtcp_port): $var(sdp_src_rtcp_port)\n");

    #### 5G VoNR N5 NPCF Authorization reuqest

      if(is_method("INVITE")){
                    xlog("L_DBG", "IMS: INVITE ORIG TO $tU\n");

    ### Getting the IP/Port of UE
        $var(orig_ue_ip) = $fU; # User Part of the from Header to get the USER
        $var(ue_ip_addr) = $sht(user_sip_ips=>$var(orig_ue_ip));
        xlog("L_INFO", "IP for UE  $var(orig_ue_ip) is: $var(ue_ip_addr)\n");

        $var(orig_ue_port) = $fU; # User Part of the from Header to get the USER
        $var(ue_port_sip) = $sht(user_sip_ports=>$var(orig_ue_port));
        xlog("L_INFO", "IP for UE  $var(orig_ue_port) is: $var(ue_port_sip)\n");

    ## retrieving SDP Connection Info and Media Port for UE
        $var(sdp_id_ue) = $fU; # User Part of the from Header to get the USER
        $var(ue_sdp_ip) = $sht(user_sdps_ip=>$var(sdp_id_ue));
        xlog("L_INFO", "SDP IP for UE with MSISDN $var(sdp_id_ue) is: $var(ue_sdp_ip)\n");

        $var(sdp_id_ue_port) = $fU; # User Port of the from Header to get the USER
        $var(ue_sdp_port) = $sht(user_sdps_port=>$var(sdp_id_ue_port));
        xlog("L_INFO", "SDP Port for UE with MSISDN $var(sdp_id_ue_port) is: $var(ue_sdp_port)\n");


        $var(sdp_id_ue_rtcp_port) = $fU; # User Port of the from Header to get the USER
        $var(ue_sdp_rtcp_port) = $sht(user_sdps_rtcp_port=>$var(sdp_id_ue_rtcp_port));
        xlog("L_INFO", "SDP Port for UE with MSISDN $var(sdp_id_ue_rtcp_port) is: $var(ue_sdp_rtcp_port)\n");


    #### now start to build the N5 Request

        xlog("L_INFO","Preparing QoS N5 Message to PCF for the INVITE\n");

        xlog("L_INFO","Initialize empty arrays and objects\n");

    ### Initialize empty arrays and objects
        $var(events) = '[]';
        $var(medComponents) = '{}';
        $var(medSubComps) = '{}';
        $var(evSubsc) = '{}';
        $var(payload) = '{}';

    ### Set afAppId and dnn in payload
        jansson_set("string", "afAppId", "+g.3gpp.icsi-ref=\"urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel\"", "$var(payload)");  # adding a note that this could be improved in future to get the value SIP Header
        jansson_set("string", "dnn", "ims", "$var(payload)");

        if ($(hdr(Content-Length)) > 0) {
            if ($mb =~ "m=audio") {
                $var(media_type)= "AUDIO";
            }
            if ($mb =~ "m=video") {
                $var(media_type)= "VIDEO";
            }
        }

    ### Set medComponents
        jansson_set("integer", "medCompN", 1, "$var(medComp)");
        jansson_set("string", "qosReference", "qosVoNR", "$var(medComp)");
        jansson_set("string", "medType", "$var(media_type)", "$var(medComp)");
        jansson_set("array", "codecs", "[\"downlink\\noffer\\n\", \"uplink\\nanswer\\n\"]", "$var(medComp)");

        ### RTP
        jansson_set("integer", "fNum", 1, "$var(medSubComp1)");
        jansson_set("array", "fDescs", "[\"permit out 17 from any to $var(ue_sdp_ip) $var(ue_sdp_port)\", \"permit in 17 from $var(ue_sdp_ip) $var(ue_sdp_port) to any\"]", "$var(medSubComp1)");
        jansson_set("string", "fStatus", "ENABLED", "$var(medSubComp1)");
        jansson_set("string", "marBwDl", "5000 Kbps", "$var(medSubComp1)");
        jansson_set("string", "marBwUl", "3000 Kbps", "$var(medSubComp1)");
        jansson_set("string", "flowUsage", "NO_INFO", "$var(medSubComp1)");


        ### RTCP
        jansson_set("integer", "fNum", 2, "$var(medSubComp2)");
        jansson_set("array", "fDescs", "[\"permit out 17 from any to $var(ue_sdp_ip) $var(ue_sdp_rtcp_port)\", \"permit in 17 from $var(ue_sdp_ip) $var(ue_sdp_rtcp_port) to any\"]", "$var(medSubComp2)");
        jansson_set("string", "fStatus", "ENABLED", "$var(medSubComp2)");
        jansson_set("string", "marBwDl", "5000 Kbps", "$var(medSubComp2)");
        jansson_set("string", "marBwUl", "3000 Kbps", "$var(medSubComp2)");
        jansson_set("string", "flowUsage", "RTCP", "$var(medSubComp2)");

        # Merging the flows under MediaSubComponent
        jansson_set("obj", "0", "$var(medSubComp1)", "$var(medSubComps)");
        jansson_set("obj", "1", "$var(medSubComp2)", "$var(medSubComps)");
        jansson_set("obj", "medSubComps", "$var(medSubComps)", "$var(medComp)");

        jansson_set("obj", "0", "$var(medComp)", "$var(medComponents)");
        jansson_set("obj", "medComponents", "$var(medComponents)", "$var(payload)");

        xlog("L_INFO","Set evSubsc\n");

    ### Set evSubsc
        jansson_set("string", "event", "QOS_NOTIF", "$var(event1)");
        jansson_set("string", "notifMethod", "PERIODIC", "$var(event1)");
        jansson_append("obj", "", "$var(event1)", "$var(events)");
        jansson_set("string", "event", "ANI_REPORT", "$var(event2)");
        jansson_set("string", "notifMethod", "ONE_TIME", "$var(event2)");
        jansson_append("obj", "", "$var(event2)", "$var(events)");
        jansson_set("array", "events", "$var(events)", "$var(evSubsc)");

        jansson_set("obj", "evSubsc", "$var(evSubsc)", "$var(payload)");

    ### Set other parameters in payload
        jansson_set("string", "notifUri", "http://172.22.0.21:7777", "$var(payload)");
        jansson_set("string", "sponStatus", "SPONSOR_DISABLED", "$var(payload)");
        jansson_set("string", "gpsi", "msisdn-$fU", "$var(payload)");
        jansson_set("string", "suppFeat", "4", "$var(payload)");
        jansson_set("string", "ueIpv4", "$var(ue_ip_addr)", "$var(payload)");

        ### Assemble the final JSON request
        jansson_set("obj", "ascReqData", "$var(payload)", "$var(json_request)");

        xlog("L_INFO", "Set headers for the HTTP2 Request\n");
    ### Set headers
        $var(time_now)=$_s($timef(%a, %d %b %Y %H:%M:%S %Z));
        xlog("L_INFO", "Today is $var(time_now)\n");

        $var(headers) = "Content-Type: application/json\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: NRF\r\n";
        $var(headers) = $var(headers) + "accept: application/json\r\n";
        $var(headers) = $var(headers) + "accept: application/problem+json\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
        $var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);


        xlog("L_INFO","Sending the request to PCF\n");
    ### Send the request to PCF
        http_client_request_v2pk("POST", "http://172.22.0.27:7777/npcf-policyauthorization/v1/app-sessions", "$var(json_request)", "$var(headers)", "$var(result)" );

    ### here we want to kill the dialog in case QoS faild or continue if QoS success.
        switch ($rc) {
                    case 201:
                    xlog("L_INFO", "N5 QoS Session successfully Created $rc\n");
        xlog("L_INFO", "HTTP results: $var(result)\n");
        xlog("L_INFO", "HTTP response: $rc\n");
        xlog("L_INFO", "location Header: $httprhdr(location)\n");

    # Now I will retrieve the AppSessionID out of the pcscf_location Header it should be always at the end
    # Example URL: "http://172.22.0.27:7777/npcf-policyauthorization/v1/app-sessions/(someSessionID)"

    # Firt store the url of the lcoation Header in var
        $var(url) = $httprhdr(location);

        # Get the length of the URL
        $var(len) = $(var(url){s.len});

        # Initialize the position variable to the length of the URL
        $var(pos) = $var(len);

        # Find the position of the last slash by iterating backwards
        while ($var(pos) > 0) {
          $var(pos) = $var(pos) - 1;
          if ($(var(url){s.substr,$var(pos),1}) == "/") {
              # We've found the last slash
              break;
          }
        }

    # Extract the substring after the last slash
    # now doing some magic
    # Set the starting position after the last slash
        $var(start_pos) = $var(pos) + 1;

        # Calculate the length of the substring after the last slash
        $var(substring_length) = $var(len) - $var(start_pos);

        # Extract the substring after the last slash
        $var(app_session) = $(var(url){s.substr,$var(start_pos),$var(substring_length)});


    # now checking it on console if I got what I wanted :
        xlog("L_INFO", "AppSession for user $fU is: $var(app_session)\n");

    # now trying some way to store AppSession with the registred UE
        $var(user_id) = $fU; # should get the user part of the Orig UE

        # Store the AppSession in the hash table associated with the UE
        $sht(user_data=>$var(user_id)) = $var(app_session);
        xlog("L_INFO", "Stored AppSession for user $var(user_id): $var(app_session)\n");
        break;
        default:
                            xlog("L_ERR", "N5 QoS Session faild - Reason code: $rc\n");
                            send_reply("412", "MOC N5 QoS Session Creation faild");
          exit;
                    }   # switch ends here
    }

    }
