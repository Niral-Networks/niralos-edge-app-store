data:
  n3iwfcfg.yaml: |
    info:
      version: 1.0.5
      description: N3IWF initial local configuration

    configuration:
      N3IWFInformation:
        GlobalN3IWFID:
          PLMNID:
            MCC: __MCC__
            MNC: __MNC__
          N3IWFID: 135
        Name: niralos_N3IWF
        SupportedTAList:
          - TAC: {{ printf "%06d" (int .Values.coreNetwork.tai.tac) }}
            BroadcastPLMNList:
              - PLMNID:
                  MCC: __MCC__
                  MNC: __MNC__
                TAISliceSupportList:
                  - SNSSAI:
                      SST: {{ (index .Values.coreNetwork.slices 0).sst }}
                      SD: {{ (index .Values.coreNetwork.slices 0).sd }}

      AMFSCTPAddresses:
        - IP:
            - __AMF_IP__
          Port: 38412
      NASTCPPort: 20000

      IKEBindAddress: __N3IWF_IP__
      IPSecTunnelAddress: 10.0.0.1
      UEIPAddressRange: 10.0.0.0/24
      XFRMInterfaceName: xfrmi
      XFRMInterfaceID: 1

      GTPBindAddress: __N3IWF_IP__

      FQDN: n3iwf.niralos.org

      PrivateKey: /n3iwf/cert/n3iwf.key
      CertificateAuthority: /n3iwf/cert/n3iwf.crt
      Certificate: /n3iwf/cert/n3iwf.crt

      LivenessCheck:
        enable: true
        transFreq: 60s
        maxRetryTimes: 4

    logger:
      enable: true
      level: trace
      reportCaller: false

