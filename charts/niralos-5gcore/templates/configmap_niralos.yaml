apiVersion: v1
kind: ConfigMap

metadata:
  name: nrf-config
  namespace: {{ .Release.Namespace }}
data:

  nrf.yaml: |
    logger:
      file: /niralos/install/var/log/niralos/nrf.log

    sbi:
      server:
        no_tls: true
      client:
        no_tls: true

    global:
      max:
        ue: MAX_NUM_UE

    niral_developer_http:
      cp_server:
        disable: true
      cp_client:
        disable: true

    niral_developer_mhttp:
      core_server:
        disable: true

    nrf:
      serving:
        - plmn_id:
            mcc: MCC
            mnc: MNC

      sbi:
        server:
          - address: NRF_IP
            port: 7777

      metrics:
        server:
          - address: NRF_IP
            port: 9090
      service_id: niralos.nrf.001
      site_id: SITE_ID_CORE
  nrf_init.sh: |
    #!/bin/bash

    cp /mnt/nrf/nrf.yaml /niralos/install/etc/niralos/

    sed -i "s|NRF_IP|${NRF_IP}|g" /niralos/install/etc/niralos/nrf.yaml
    sed -i "s|SCP_IP|${SCP_IP}|g" /niralos/install/etc/niralos/nrf.yaml
    sed -i "s|MCC|${MCC}|g" /niralos/install/etc/niralos/nrf.yaml
    sed -i "s|MNC|${MNC}|g" /niralos/install/etc/niralos/nrf.yaml
    sed -i "s|MAX_NUM_UE|${MAX_NUM_UE}|g" /niralos/install/etc/niralos/nrf.yaml
    sed -i "s|SITE_ID_CORE|${SITE_ID_CORE}|g" /niralos/install/etc/niralos/nrf.yaml

---

apiVersion: v1
kind: ConfigMap

metadata:
  name: scp-config
  namespace: {{ .Release.Namespace }}
data:

  scp.yaml: |
    db_uri: mongodb://mongo:27017/niralos

    logger:
      file: /niralos/install/var/log/niralos/scp.log

    niral_developer_http:
      cp_server:
        disable: true
      cp_client:
        disable: true

    niral_developer_mhttp:
      core_server:
        disable: true

    sbi:
      server:
        no_tls: true
      client:
        no_tls: true

    global:
      max:
        ue: MAX_NUM_UE

    scp:
      sbi:
        server:
        - address: SCP_IP
          port: 7777

        client:
          nrf:
          - uri: http://niralos-nrf-1:7777

      default:
        tls:
          server:
            scheme: http
            private_key: /mnt/newtls/scp.key
            cert: /mnt/newtls/scp.crt
            verify_client: true
            verify_client_cacert: /mnt/newtls/ca.crt

          client:
            scheme: http
            cacert: /mnt/newtls/ca.crt
            client_private_key: /mnt/newtls/scp.key
            client_cert: /mnt/newtls/scp.crt
      service_id: niralos.scp.001
      site_id: SITE_ID_CORE
  scp_init.sh: |
    #!/bin/bash

    cp /mnt/scp/scp.yaml install/etc/niralos

    sed -i 's|SCP_IP|'$SCP_IP'|g' install/etc/niralos/scp.yaml
    #sed -i 's|NRF_IP|'$NRF_IP'|g' install/etc/niralos/scp.yaml
    sed -i 's|MONGO_IP|'$MONGO_IP'|g' install/etc/niralos/scp.yaml
    sed -i 's|MAX_NUM_UE|'$MAX_NUM_UE'|g' install/etc/niralos/scp.yaml
    sed -i "s|SITE_ID_CORE|'$SITE_ID_CORE'|g" /niralos/install/etc/niralos/scp.yaml

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: amf-config
  namespace: {{ .Release.Namespace }}
data:
  amf.yaml: |
    db_uri: mongodb://mongo:27017/niralos

    db_conn: host=TIMESCALEDB_IP port=5432 dbname={{ .Values.secrets.timescaledb.database }} user={{ .Values.secrets.timescaledb.username }} password={{ .Values.secrets.timescaledb.password }}

    logger:
      file:
        path: /niralos/install/var/log/niralos/amf.log

    sbi:
      server:
        no_tls: true
      client:
        no_tls: true

    global:
      max:
        ue: MAX_NUM_UE

    statistic:
      file_stat:
        path: /niral_config/amf_stats_archive/amf_stat.log
        fetch_api_file_counter: 100
        max_strings_in_file: 100

    niral_developer_http:
      cp_server:
        disable: true
      cp_client:
        disable: true

    niral_developer_mhttp:
      core_server:
        disable: true

    amf:
      sbi:
        server:
          - address: AMF_IP
            port: 7777

        client:
          nrf:
            - uri: http://niralos-nrf-1:7777

          scp:
            - uri: http://niralos-scp-1:7777

      default:
        tls:
          server:
            scheme: http
            private_key: /mnt/newtls/amf.key
            cert: /mnt/newtls/amf.crt
            verify_client: true
            verify_client_cacert: /mnt/newtls/ca.crt

          client:
            scheme: http
            cacert: /mnt/newtls/ca.crt
            client_private_key: /mnt/newtls/amf.key
            client_cert: /mnt/newtls/amf.crt

      ngap:
        server:
          - address: AMF_IP

      metrics:
        server:
          - address: AMF_IP
            port: 9090

      guami:
        - plmn_id:
            mcc: MCC
            mnc: MNC
          amf_id:
            region: 2
            set: 1

      tai:
        - plmn_id:
            mcc: MCC
            mnc: MNC
          tac: {{ .Values.coreNetwork.tai.tac }}

      plmn_support:
        - plmn_id:
            mcc: MCC
            mnc: MNC
          s_nssai:
            - sst: {{ (index .Values.coreNetwork.slices 0).sst }}
              sd: {{ (index .Values.coreNetwork.slices 0).sd }}
              dynamic: 0
            - sst: {{ (index .Values.coreNetwork.slices 0).sst }}
              sd: {{ (index .Values.coreNetwork.slices 1).sd }}
              dynamic: 0

      security:
        integrity_order: [NIA2, NIA1, NIA0]
        ciphering_order: [NEA0, NEA1, NEA2]

      network_name:
        full: Niral-5G

      amf_name: Niral-amf0
      service_id: niralos.amf.001

      nf_support:
        enable: true
        length: 2
        imsVoPS: 1
        emc: 0
        emf: 0
        iwkN26: 0
        mpsi: 0
        emcN3: 0
        mcsi: 0

      time:
        t3512:
          value: 540
      site_id: SITE_ID_CORE
  amf_init.sh: |
    #!/bin/bash

    export DB_URI="mongodb://${MONGO_IP}/niralos"

    cp /mnt/amf/amf.yaml /niralos/install/etc/niralos/

    sed -i "s|AMF_IP|$AMF_IP|g" /niralos/install/etc/niralos/amf.yaml
    sed -i "s|MONGO_IP|$MONGO_IP|g" /niralos/install/etc/niralos/amf.yaml
    sed -i "s|TIMESCALEDB_IP|$TIMESCALEDB_IP|g" /niralos/install/etc/niralos/amf.yaml
    sed -i "s|MCC|$MCC|g" /niralos/install/etc/niralos/amf.yaml
    sed -i "s|MNC|$MNC|g" /niralos/install/etc/niralos/amf.yaml
    sed -i "s|MAX_NUM_UE|$MAX_NUM_UE|g" /niralos/install/etc/niralos/amf.yaml
    sed -i "s|SITE_ID_CORE|$SITE_ID_CORE|g" /niralos/install/etc/niralos/amf.yaml

---

