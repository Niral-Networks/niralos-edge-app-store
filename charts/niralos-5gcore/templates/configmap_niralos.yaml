    import click
    import sys
    import ipaddress

    """
    Script used to fetch first IP address in a given IP range.

    Example:

        python3 ip_utils.py --ip_range 192.168.100.0/24
        python3 ip_utils.py --ip_range 2001:230:cafe::/48
    """

    def validate_ip_net(ctx, param, value):
        try:
            ip_net = ipaddress.ip_network(value)
            return ip_net
        except ValueError:
            raise click.BadParameter(
                "Value does not represent a valid IPv4/IPv6 range"
            )

    @click.command()
    @click.option(
        "--ip_range",
        required=True,
        callback=validate_ip_net,
        help="UE IPv4/IPv6 Address range in CIDR format"
    )
    def start(ip_range):

        first_ip_addr = next(ip_range.hosts(), None)

        if not first_ip_addr:
            raise ValueError("Invalid UE IPv4 range. Only one IP given")

        first_ip_addr = first_ip_addr.exploded
        ip_netmask_prefix = ip_range.prefixlen

        print(str(first_ip_addr) + "/" + str(ip_netmask_prefix))

    if __name__ == "__main__":
        try:
            start()
            sys.exit(0)
        except ValueError:
            sys.exit(1)
  smf_init.sh: |
    #!/bin/bash

    export LC_ALL=C.UTF-8
    export LANG=C.UTF-8
    export IP_ADDR=$(awk 'END{print $1}' /etc/hosts)
    export IF_NAME=$(ip r | awk '/default/ { print $5 }')
    export DB_URI="mongodb://${MONGO_IP}/niralos"

    if [ ${#MNC} == 3 ]; then
        EPC_DOMAIN="epc.mnc${MNC}.mcc${MCC}.3gppnetwork.org"
    else
        EPC_DOMAIN="epc.mnc0${MNC}.mcc${MCC}.3gppnetwork.org"
    fi

    UE_IPV4_INTERNET_TUN_IP=$(python3 /mnt/smf/ip_utils.py --ip_range $UE_IPV4_INTERNET)
    UE_IPV4_IMS_TUN_IP=$(python3 /mnt/smf/ip_utils.py --ip_range $UE_IPV4_IMS)

    echo "Copying SMF configuration..."

    cp /mnt/smf/smf.yaml /niralos/install/etc/niralos/

    if [[ ${DEPLOY_MODE} == 4G ]]; then
        cp /mnt/smf/smf_4g.yaml /niralos/install/etc/niralos/smf.yaml
    fi

    cp /mnt/smf/smf.conf /niralos/install/etc/freeDiameter/
    cp /mnt/smf/make_certs.sh /niralos/install/etc/freeDiameter/

    export P_CSCF_IP=$(getent hosts pcscf-service | awk '{print $1}')

    echo "Replacing placeholders in smf.yaml..."
    echo "P_CSCF_IP=$P_CSCF_IP"
    sed -i "s|SMF_IP|${SMF_IP}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|SCP_IP|${SCP_IP}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|NRF_IP|${NRF_IP}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|UPF_IP|${UPF_IP}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|SMF_DNS1|${SMF_DNS1}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|SMF_DNS2|${SMF_DNS2}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|MONGO_IP|${MONGO_IP}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|UE_IPV4_INTERNET_TUN_IP|${UE_IPV4_INTERNET_TUN_IP}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|UE_IPV4_IMS_TUN_IP|${UE_IPV4_IMS_TUN_IP}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|PCSCF_IP|${PCSCF_IP}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|MAX_NUM_UE|${MAX_NUM_UE}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|TIMESCALEDB_IP|${TIMESCALEDB_IP}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|P_CSCF_IP|${P_CSCF_IP}|g" /niralos/install/etc/niralos/smf.yaml
    sed -i "s|SITE_ID_CORE|${SITE_ID_CORE}|g" /niralos/install/etc/niralos/smf.yaml

    echo "Replacing placeholders in smf.conf..."

    sed -i "s|SMF_IP|${SMF_IP}|g" /niralos/install/etc/freeDiameter/smf.conf
    sed -i "s|PCRF_IP|${PCRF_IP}|g" /niralos/install/etc/freeDiameter/smf.conf
    sed -i "s|EPC_DOMAIN|${EPC_DOMAIN}|g" /niralos/install/etc/freeDiameter/smf.conf
    sed -i "s|PCRF_BIND_PORT|${PCRF_BIND_PORT}|g" /niralos/install/etc/freeDiameter/smf.conf
    sed -i "s|LD_LIBRARY_PATH|${LD_LIBRARY_PATH}|g" /niralos/install/etc/freeDiameter/smf.conf

    echo "Updating certificate generation script..."

    sed -i "s|EPC_DOMAIN|${EPC_DOMAIN}|g" /niralos/install/etc/freeDiameter/make_certs.sh

    chmod +x /niralos/install/etc/freeDiameter/make_certs.sh

    echo "Generating Diameter certificates..."

    /niralos/install/etc/freeDiameter/make_certs.sh /niralos/install/etc/freeDiameter

    echo "SMF initialization completed successfully."

