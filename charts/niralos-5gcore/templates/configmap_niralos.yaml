apiVersion: v1
kind: ConfigMap

metadata:
  name: udm-config
  namespace: {{ .Release.Namespace }}
data:

  udm.yaml: |
    db_uri: mongodb://mongo:27017/niralos

    logger:
      file:
        path: /niralos/install/var/log/niralos/udm.log

    sbi:
      server:
        no_tls: true
      client:
        no_tls: true

    global:
      max:
        ue: MAX_NUM_UE

    niral_developer_http:
      cp_server:
        disable: true
      cp_client:
        disable: true

    niral_developer_mhttp:
      core_server:
        disable: true

    udm:
      hnet:
        - id: 1
          scheme: 1
          key: /niralos/install/etc/niralos/hnet/curve25519-1.key
        - id: 2
          scheme: 2
          key: /niralos/install/etc/niralos/hnet/secp256r1-2.key
        - id: 3
          scheme: 1
          key: /niralos/install/etc/niralos/hnet/curve25519-3.key
        - id: 4
          scheme: 2
          key: /niralos/install/etc/niralos/hnet/secp256r1-4.key
        - id: 5
          scheme: 1
          key: /niralos/install/etc/niralos/hnet/curve25519-5.key
        - id: 6
          scheme: 2
          key: /niralos/install/etc/niralos/hnet/secp256r1-6.key

      sbi:
        server:
          - address: UDM_IP
            port: 7777

        client:
          nrf:
            - uri: http://niralos-nrf-1:7777

          scp:
            - uri: http://niralos-scp-1:7777

      metrics:
        server:
          - address: UDM_IP
            port: 9090

      default:
        tls:
          server:
            scheme: http
            private_key: /mnt/newtls/udm.key
            cert: /mnt/newtls/udm.crt
            verify_client: true
            verify_client_cacert: /mnt/newtls/ca.crt

          client:
            scheme: http
            cacert: /mnt/newtls/ca.crt
            client_private_key: /mnt/newtls/udm.key
            client_cert: /mnt/newtls/udm.crt

      service_id: niralos.udm.001
      site_id: SITE_ID_CORE

  udm_init.sh: |
    #!/bin/bash

    export DB_URI="mongodb://${MONGO_IP}/niralos"

    cp /mnt/udm/udm.yaml /niralos/install/etc/niralos/

    sed -i "s|UDM_IP|$UDM_IP|g" /niralos/install/etc/niralos/udm.yaml
    sed -i "s|MONGO_IP|$MONGO_IP|g" /niralos/install/etc/niralos/udm.yaml
    sed -i "s|MAX_NUM_UE|$MAX_NUM_UE|g" /niralos/install/etc/niralos/udm.yaml
    sed -i "s|SITE_ID_CORE|$SITE_ID_CORE|g" /niralos/install/etc/niralos/udm.yaml

    cp /mnt/udm/curve25519-1.key /niralos/install/etc/niralos/hnet/
    cp /mnt/udm/secp256r1-2.key /niralos/install/etc/niralos/hnet/

