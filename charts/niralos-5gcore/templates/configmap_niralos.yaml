apiVersion: v1
kind: ConfigMap
metadata:
  name: pyhss-config
  namespace: {{ .Release.Namespace }}
data:
  niralos_hss_init.sh: |
    #!/bin/bash

    while ! mysqladmin ping -h ${MYSQL_IP} --silent; do
            sleep 5;
    done

    sleep 10;

    # Export root password configured in previous steps
    export MYSQL_PWD="{{ .Values.secrets.mysql.rootPassword }}"

    # Create the PyHSS database
    mysql -u root -h ${MYSQL_IP} -e "CREATE DATABASE IF NOT EXISTS ims_hss_db;" 2>/dev/null || true

    # Create IMS HSS database user idempotently
    mysql -u root -h ${MYSQL_IP} -e "CREATE USER IF NOT EXISTS 'pyhss'@'%' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.ims.pyhssPassword }}';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "CREATE USER IF NOT EXISTS 'pyhss'@'$PYHSS_IP' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.ims.pyhssPassword }}';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "GRANT ALL ON *.* TO 'pyhss'@'%';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "GRANT ALL ON *.* TO 'pyhss'@'$PYHSS_IP';" 2>/dev/null || true
    mysql -u root -h ${MYSQL_IP} -e "FLUSH PRIVILEGES;" 2>/dev/null || true

    unset MYSQL_PWD

    echo "${SCSCF_SERVICE_SERVICE_HOST} scscf.${IMS_DOMAIN}" >> /etc/hosts

    [ ${#MNC} == 3 ] && EPC_DOMAIN="epc.mnc${MNC}.mcc${MCC}.3gppnetwork.org" || EPC_DOMAIN="epc.mnc0${MNC}.mcc${MCC}.3gppnetwork.org"
    [ ${#MNC} == 3 ] && IMS_DOMAIN="ims.mnc${MNC}.mcc${MCC}.3gppnetwork.org" || IMS_DOMAIN="ims.mnc0${MNC}.mcc${MCC}.3gppnetwork.org"

    cp /mnt/pyhss/config.yaml ./
    cp /mnt/pyhss/default_ifc.xml ./
    cp /mnt/pyhss/default_sh_user_data.xml ./

    INSTALL_PREFIX="/pyhss"

    sed -i 's|PYHSS_IP|'$PYHSS_IP'|g' ./config.yaml
    sed -i 's|PYHSS_BIND_PORT|'$PYHSS_BIND_PORT'|g' ./config.yaml
    sed -i 's|IMS_DOMAIN|'$IMS_DOMAIN'|g' ./config.yaml
    sed -i 's|OP_MCC|'$MCC'|g' ./config.yaml
    sed -i 's|OP_MNC|'$MNC'|g' ./config.yaml
    sed -i 's|MYSQL_IP|'$MYSQL_IP'|g' ./config.yaml
    sed -i 's|INSTALL_PREFIX|'$INSTALL_PREFIX'|g' ./config.yaml

    redis-server --daemonize yes

    cd services
    python3 apiService.py --host=$PYHSS_IP --port=8080 &
    sleep 5
    python3 diameterService.py &
    sleep 5
    python3 hssService.py

  config.yaml: |
    hss:
      transport: "TCP"
      bind_ip: ["PYHSS_IP"]
      bind_port: PYHSS_BIND_PORT
      OriginHost: "hss.IMS_DOMAIN"
      OriginRealm: "IMS_DOMAIN"
      ProductName: "pyHSS"
      site_name: "Test Site"
      MCC: "OP_MCC"
      MNC: "OP_MNC"
      SLh_enabled: False
      test_sub_imsi: '001021234567890'
      client_socket_timeout: 120
      diameter_request_timeout: 3
      active_diameter_peers_timeout: 10
      lock_provisioning: False
      provisioning_key: "hss"
      CancelLocationRequest_Enabled: False
      Insert_Subscriber_Data_Force: False
      Default_iFC: 'INSTALL_PREFIX/default_ifc.xml'
      Default_Sh_UserData: 'INSTALL_PREFIX/default_sh_user_data.xml'
      scscf_pool:
        - 'sip:scscf.IMS_DOMAIN:6060'
      roaming:
        outbound:
          allow_undefined_networks: True
      sctp:
        rtoMax: 5000
        rtoMin: 500
        rtoInitial: 1000

    api:
      page_size: 200
      enable_insecure_auc: True

    benchmarking:
      enabled: True
      reporting_interval: 3600

    eir:
      imsi_imei_logging: True
      no_match_response: 2
      store_offnet_imsi: False
      simSwapNotification: False

    logging:
      level: INFO
      logfiles:
        hss_logging_file: INSTALL_PREFIX/log/hss.log
        diameter_logging_file: INSTALL_PREFIX/log/diameter.log
        geored_logging_file: INSTALL_PREFIX/log/geored.log
        metric_logging_file: INSTALL_PREFIX/log/metrics.log
      log_to_terminal: True
      sqlalchemy_sql_echo: True
      sqlalchemy_pool_recycle: 15
      sqlalchemy_pool_size: 30
      sqlalchemy_max_overflow: 0

    database:
      db_type: mysql
      server: MYSQL_IP
      username: pyhss
      password: {{ .Values.secrets.ims.pyhssPassword }}
      database: ims_hss_db
      readCacheEnabled: True
      readCacheInterval: 60

    webhooks:
      enabled: False
      endpoints:
        - 'http://127.0.0.1:8181'

    geored:
      enabled: False
      sync_actions: ['HSS', 'IMS', 'PCRF', 'EIR']
      sync_endpoints:
        - 'http://hss01.mnc001.mcc001.3gppnetwork.org:8080'
        - 'http://hss02.mnc001.mcc001.3gppnetwork.org:8080'

    redis:
      connectionType: "tcp"
      unixSocketPath: '/var/run/redis/redis-server.sock'
      host: 127.0.0.1
      port: 6379

    prometheus:
      enabled: False
      port: 8081
      async_subscriber_count: False

    snmp:
      port: 1161
      listen_address: 127.0.0.1

  default_ifc.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <IMSSubscription>
        <PrivateID>{{ "{{ iFC_vars['imsi'] }}" }}@ims.mnc{{ "{{ iFC_vars['mnc'] }}" }}.mcc{{ "{{ iFC_vars['mcc'] }}" }}.3gppnetwork.org</PrivateID>
        <ServiceProfile>
            <PublicIdentity>
                <Identity>sip:{{ "{{ iFC_vars['msisdn'] }}" }}@ims.mnc{{ "{{ iFC_vars['mnc'] }}" }}.mcc{{ "{{ iFC_vars['mcc'] }}" }}.3gppnetwork.org</Identity>
                <Extension>
                    <IdentityType>0</IdentityType>
                    <Extension>
                        <AliasIdentityGroupID>1</AliasIdentityGroupID>
                    </Extension>
                </Extension>
            </PublicIdentity>
            <PublicIdentity>
                <Identity>tel:{{ "{{ iFC_vars['msisdn'] }}" }}</Identity>
                <Extension>
                    <IdentityType>0</IdentityType>
                    <Extension>
                        <AliasIdentityGroupID>1</AliasIdentityGroupID>
                    </Extension>
                </Extension>
            </PublicIdentity>
            <PublicIdentity>
                <Identity>sip:{{ "{{ iFC_vars['imsi'] }}" }}@ims.mnc{{ "{{ iFC_vars['mnc'] }}" }}.mcc{{ "{{ iFC_vars['mcc'] }}" }}.3gppnetwork.org</Identity>
                <Extension>
                    <IdentityType>0</IdentityType>
                </Extension>
            </PublicIdentity>
            <InitialFilterCriteria>
                <Priority>20</Priority>
                <TriggerPoint>
                    <ConditionTypeCNF>1</ConditionTypeCNF>
                    <SPT>
                        <ConditionNegated>0</ConditionNegated>
                        <Group>0</Group>
                        <Method>MESSAGE</Method>
                        <Extension></Extension>
                    </SPT>
                    <SPT>
                        <ConditionNegated>1</ConditionNegated>
                        <Group>1</Group>
                        <SIPHeader>
                            <Header>Server</Header>
                        </SIPHeader>
                    </SPT>
                    <SPT>
                        <ConditionNegated>0</ConditionNegated>
                        <Group>2</Group>
                        <SessionCase>0</SessionCase>
                        <Extension></Extension>
                    </SPT>
                </TriggerPoint>
                <ApplicationServer>
                    <ServerName>sip:smsc.ims.mnc{{ "{{ iFC_vars['mnc'] }}" }}.mcc{{ "{{ iFC_vars['mcc'] }}" }}.3gppnetwork.org:5060</ServerName>
                    <DefaultHandling>0</DefaultHandling>
                </ApplicationServer>
            </InitialFilterCriteria>
        </ServiceProfile>
    </IMSSubscription>

  default_sh_user_data.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <Sh-Data>
        <IMSPrivateUserIdentity>{{ "{{ Sh_template_vars['imsi'] }}" }}@ims.mnc{{ "{{ Sh_template_vars['mnc'] }}" }}.mcc{{ "{{ Sh_template_vars['mcc'] }}" }}.3gppnetwork.org</IMSPrivateUserIdentity>
        <PublicIdentifiers>
            <IMSPublicIdentity>sip:{{ "{{ Sh_template_vars['msisdn'] }}" }}@ims.mnc{{ "{{ Sh_template_vars['mnc'] }}" }}.mcc{{ "{{ Sh_template_vars['mcc'] }}" }}.3gppnetwork.org</IMSPublicIdentity>
            <MSISDN>{{ "{{ Sh_template_vars['msisdn'] }}" }}</MSISDN>
        </PublicIdentifiers>
        <Extension>
            <EPSLocationInformation>{% if Sh_template_vars['serving_mme'] is not none %}
                <E-UTRANCellGlobalId></E-UTRANCellGlobalId>
                <TrackingAreaId></TrackingAreaId>
                <MMEName>{{ "{{ Sh_template_vars['serving_mme'] }}" }}</MMEName>
                <AgeOfLocationInformation>0</AgeOfLocationInformation>
                <Extension>
                    <VisitedPLMNID></VisitedPLMNID>
                </Extension>{% endif %}
            </EPSLocationInformation>
        </Extension>
        <Sh-IMS-Data>
            <S-CSCFName>{{ "{{ Sh_template_vars['scscf'] }}" }}</S-CSCFName>
            <IMSUserState>{{ "{{ Sh_template_vars['imsUserState'] }}" }}</IMSUserState>
        </Sh-IMS-Data>
    </Sh-Data>

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: smsc-config
  namespace: {{ .Release.Namespace }}
data:
  smsc_init.sh: |
    #!/bin/bash

    # BSD 2-Clause License
    # Copyright (c) 2020, Supreeth Herle

    [ ${#MNC} == 3 ] && IMS_DOMAIN="ims.mnc${MNC}.mcc${MCC}.3gppnetwork.org" || IMS_DOMAIN="ims.mnc0${MNC}.mcc${MCC}.3gppnetwork.org"

    mkdir -p /etc/kamailio_smsc
    cp /mnt/smsc/smsc.cfg /etc/kamailio_smsc
    cp /mnt/smsc/kamailio_smsc.cfg /etc/kamailio_smsc

    while ! mysqladmin ping -h ${MYSQL_IP} --silent; do
            sleep 5;
    done

    # Sleep until permissions are set
    sleep 10;


    export MYSQL_PWD="{{ .Values.secrets.mysql.rootPassword }}"

    # Drop SMSC database
    mysql -u root -h ${MYSQL_IP} -e "DROP DATABASE IF EXISTS smsc;" 2>/dev/null || true

    # Create SMSC database, populate tables and grant privileges
    if [[ -z "`mysql -u root -h ${MYSQL_IP} -qfsBe "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME='smsc'" 2>&1`" ]];
    then
        mysql -u root -h ${MYSQL_IP} -e "CREATE DATABASE smsc;"
        mysql -u root -h ${MYSQL_IP} smsc < /usr/local/src/kamailio/utils/kamctl/mysql/standard-create.sql
        mysql -u root -h ${MYSQL_IP} smsc < /mnt/smsc/smsc-create.sql
        mysql -u root -h ${MYSQL_IP} smsc < /usr/local/src/kamailio/utils/kamctl/mysql/dialplan-create.sql
        mysql -u root -h ${MYSQL_IP} smsc < /usr/local/src/kamailio/utils/kamctl/mysql/presence-create.sql

        SMSC_USER_EXISTS=`mysql -u root -h ${MYSQL_IP} -s -N -e "SELECT EXISTS(SELECT 1 FROM mysql.user WHERE User = 'smsc' AND Host = '%')"`
        if [[ "$SMSC_USER_EXISTS" == 0 ]]
        then
            mysql -u root -h ${MYSQL_IP} -e "CREATE USER 'smsc'@'%' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.ims.imsUserPassword }}';"
            mysql -u root -h ${MYSQL_IP} -e "CREATE USER 'smsc'@'$SMSC_IP' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.ims.imsUserPassword }}';"
            mysql -u root -h ${MYSQL_IP} -e "GRANT ALL ON smsc.* TO 'smsc'@'%';"
            mysql -u root -h ${MYSQL_IP} -e "GRANT ALL ON smsc.* TO 'smsc'@'$SMSC_IP';"
            mysql -u root -h ${MYSQL_IP} -e "FLUSH PRIVILEGES;"
        fi
    fi

    unset MYSQL_PWD

    # Map IMS Core hostnames directly to cluster services
    echo "${PYHSS_SERVICE_HOST} hss.${IMS_DOMAIN}" >> /etc/hosts
    echo "${SCSCF_SERVICE_HOST} scscf.${IMS_DOMAIN}" >> /etc/hosts
    echo "${ICSCF_SERVICE_HOST} icscf.${IMS_DOMAIN}" >> /etc/hosts
    echo "${PCSCF_SERVICE_HOST} pcscf.${IMS_DOMAIN}" >> /etc/hosts

    sed -i 's|SMSC_IP|'$SMSC_IP'|g' /etc/kamailio_smsc/smsc.cfg
    sed -i 's|IMS_DOMAIN|'$IMS_DOMAIN'|g' /etc/kamailio_smsc/smsc.cfg
    sed -i 's|MYSQL_IP|'$MYSQL_IP'|g' /etc/kamailio_smsc/smsc.cfg

  smsc.cfg: |
    listen=udp:SMSC_IP:7090
    listen=tcp:SMSC_IP:7090

    #!define DOMAIN "IMS_DOMAIN"
    #!subst "/DOMAIN/IMS_DOMAIN/"
    #!define SMSC_SERVER "smsc.IMS_DOMAIN"
    #!subst "/SMSC_SERVER/smsc.IMS_DOMAIN/"

    # Connection URL for the database:
    #!define SMS_DB_URL "sms=>mysql://smsc:heslo@MYSQL_IP/smsc"
    #!define DIALPLAN_PUA_DB_URL "mysql://smsc:heslo@MYSQL_IP/smsc"

    #!subst "/NEXMO_APIKEY/{{ .Values.secrets.smsc.nexmoApiKey }}/"
    #!subst "/NEXMO_APISECRET/{{ .Values.secrets.smsc.nexmoApiSecret }}/"
    #!subst "/SUBSCRIBE_EXPIRE/7200/"

    #!define WITH_DEBUG

  smsc-create.sql: |
    CREATE TABLE IF NOT EXISTS `messages` (
       `id` INT(10) UNSIGNED AUTO_INCREMENT PRIMARY KEY NOT NULL,
       `caller` VARCHAR(255) NOT NULL,
       `callee` VARCHAR(255) NOT NULL,
       `text` VARCHAR(512),
       `dcs` INT(1),
       `valid` datetime NOT NULL
    );

    INSERT IGNORE INTO version (table_name, table_version) values ('messages','1');

  kamailio_smsc.cfg: |
    #!KAMAILIO
    #
    # This config file implements the basic P-CSCF functionality
    #     - web: http://www.kamailio.org
    #     - git: http://sip-router.org
    #
    # Refer to the Core CookBook at http://www.kamailio.org/dokuwiki/doku.php
    # for an explanation of possible statements, functions and parameters.
    #
    # Direct your questions about this file to: <sr-users@lists.kamailio.org>.
    #
    # For more information about the various parameters, functions and statements
    # try http://sip-router.org/wiki/ .
    #

    include_file "smsc.cfg"

    ####### Global Parameters #########
    debug=2
    log_stderror=no
    sip_warning=no
    children=4

    user_agent_header="User-Agent: Niral SMSC"
    server_header="Server: Niral SMSC"
    log_name="smsc"
    log_prefix_mode=1
    log_prefix="{$mt $hdr(CSeq) $ci $cfg(route)} "

    /* comment the next line to enable the auto discovery of local aliases
       based on reverse DNS on IPs (default on) */
    auto_aliases=no

    check_via=no    # (cmd. line: -v)
    dns=no          # (cmd. line: -r)
    rev_dns=no      # (cmd. line: -R)
    tcp_accept_no_cl=yes

    #!define SMS_3GPP 1
    #!define SMS_TEXT 2

    alias=SMSC_SERVER

    # ------------------ module loading ----------------------------------
    mpath="/usr/lib64/kamailio/modules_k/:/usr/lib64/kamailio/modules/:/usr/lib/kamailio/modules_k/:/usr/lib/kamailio/modules/:/usr/lib/x86_64-linux-gnu/kamailio/modules/:/usr/local/lib64/kamailio/modules"
    # (we try both the lib64 and the lib directory)

    loadmodule "tm.so"
    loadmodule "tmx.so"
    loadmodule "corex.so"
    loadmodule "smsops.so"
    loadmodule "xlog.so"
    loadmodule "maxfwd.so"
    loadmodule "textops.so"
    loadmodule "sl.so"
    loadmodule "sanity.so"
    loadmodule "siputils.so"
    loadmodule "pv.so"
    loadmodule "uac.so"
    loadmodule "http_client.so"
    loadmodule "xhttp.so"
    loadmodule "utils.so"
    loadmodule "json.so"
    loadmodule "enum.so"
    loadmodule "db_mysql.so"
    loadmodule "dialplan.so"
    loadmodule "sqlops.so"
    loadmodule "htable.so"
    loadmodule "rtimer.so"
    loadmodule "usrloc.so"
    loadmodule "registrar.so"
    loadmodule "pua.so"
    loadmodule "pua_reginfo.so"

    modparam("sqlops", "sqlcon", SMS_DB_URL)
    modparam("dialplan", "db_url", DIALPLAN_PUA_DB_URL)
    modparam("uac", "restore_mode", "none")

    modparam("htable", "htable", "publish_sent=>size=8;autoexpire=SUBSCRIBE_EXPIRE")
    modparam("htable", "htable", "sms_retries=>size=8;autoexpire=SUBSCRIBE_EXPIRE")

    # time interval set to 3 seconds
    modparam("rtimer", "timer", "name=sms;interval=3;mode=1;")
    modparam("rtimer", "exec", "timer=sms;route=SMS_WORKER")

    modparam("pua_reginfo", "server_address", "sip:SMSC_SERVER")
    modparam("pua_reginfo", "publish_reginfo", 0)
    modparam("pua", "db_url", DIALPLAN_PUA_DB_URL)

    modparam("enum", "domain_suffix", "e164.arpa.")

    #!ifdef WITH_DEBUG
    loadmodule "debugger.so"
    modparam("debugger", "mod_hash_size", 5)
    modparam("debugger", "mod_level_mode", 1)
    modparam("debugger", "mod_level", "xlog=3")
    #!endif

    ####### Routing Logic ########
    # Main SIP request routing logic
    # - processing of any incoming SIP request starts with this route

    route {
            xlog("L_DBG", "$rm ($fu ($si:$sp) to $tu, $ci)\n");

            # per request initial checks
            route(REQINIT);

            if (is_method("NOTIFY")) {
                    route(NOTIFY);
                    send_reply("202", "Accepted");
                    exit;
            }

            if (!is_method("MESSAGE")) {
                    append_to_reply("Allow: MESSAGE,NOTIFY\r\n");
                    send_reply("405", "Method not allowed");
                    exit;
            }

            if ($cT == "application/vnd.3gpp.sms") {
                    route(SMS_FROM_3GPP);
            } else if ($cT == "text/plain") {
                    route(SMS_FROM_SIP);
            } else {
                    send_reply("488", "Content-Type not supported");
                    exit;
            }
    }

    ######################################################################
    # Helper routes (Basic-Checks, NAT-Handling/RTP-Control, XML-RPC)
    ######################################################################
    # Per SIP request initial checks
    route[REQINIT] {
            # Trace this message

            if (!mf_process_maxfwd_header("10")) {
                    sl_send_reply("483","Too Many Hops");
                    exit;
            }

            if(!sanity_check("1511", "7")) {
                    xlog("Malformed SIP message from $si:$sp\n");
                    exit;
            }

            # Reply to OPTIONS:
            if (is_method("OPTIONS") && (uri==myself)) {
                    options_reply();
                    exit;
            }

            # Ignore Re-Transmits:
            if (t_lookup_request()) {
                    exit;
            }
    }

    ######################################################################
    # SMS from VoLTE Handsets
    ######################################################################
    route[SMS_FROM_3GPP] {
    #!ifdef WITH_DEBUG
            xlog("L_DBG", "3GPP-SMS: $rm ($fu ($si:$sp) to $tu, $ci)\n");
            xlog("L_DBG", "SMS for $tpdu(destination) \"$tpdu(payload)\" (Valid: $tpdu(validity) )\n");
    #!endif
            send_reply("202", "Accepted");

            if (isRPDATA()) {
                    $uac_req(method) = "MESSAGE";
                    $uac_req(ruri) = $ai;
                    $uac_req(furi) = "sip:"+SMSC_SERVER;
                    $uac_req(turi) = $ai;
                    $uac_req(hdrs) = "Content-Type: application/vnd.3gpp.sms\r\nRequest-Disposition: no-fork\r\nAccept-Contact: *;+g.3gpp.smsip\r\n";
                    $uac_req(body) = $smsack;
                    uac_req_send();

                    $avp(from) = $(ai{uri.user});
                    $avp(to) = $tpdu(destination);
                    $avp(dcs) = $tpdu(coding);
                    # Translate "To":
                    dp_translate("1", "$avp(to)/$avp(to)");

                    $avp(text) = $tpdu(payload);
    #!ifdef WITH_DEBUG
                    xlog("L_DBG", "SMS from 3GPP/VoLTE\n");
                    xlog("L_DBG", "-------------------------------------\n");
                    xlog("L_DBG", "FROM $avp(from)\n");
                    xlog("L_DBG", "TO   $avp(to)\n");
                    xlog("L_DBG", "TEXT $avp(text)\n");
                    xlog("L_DBG", "DCS  $avp(dcs)\n");
    #!endif
                    route(SMS);
            }

            exit;
    }

    ######################################################################
    # SMS from OTT Handsets
    ######################################################################
    route[SMS_FROM_SIP] {
            send_reply("200", "OK");

            $avp(from) = $(ai{uri.user});
            # Translate "To":
            $avp(to) = $tU;
            dp_translate("1", "$avp(to)/$avp(to)");
            $avp(text) = $rb;
    #!ifdef WITH_DEBUG
            xlog("L_DBG", "SMS from SIP/OTT\n");
            xlog("L_DBG", "-------------------------------------\n");
            xlog("L_DBG", "FROM $avp(from)\n");
            xlog("L_DBG", "TO   $avp(to)\n");
            xlog("L_DBG", "TEXT $avp(text)\n");
    #!endif
            route(SMS);

            exit;
    }

    ######################################################################
    # SMS from other networks
    ######################################################################
    event_route[xhttp:request] {

    #  For the use of the health_check API,
            if($hu == "/health_Check"){
                    xhttp_reply("200", "OK", "text/html", "OK");
            } else {
            if ($(hu{url.querystring}{s.len}) > 0) {
                    $avp(from) = $(hu{url.querystring}{param.value,msisdn,&});
                    $avp(to) = $(hu{url.querystring}{param.value,to,&});
                    $avp(text) = $(hu{url.querystring}{param.value,text,&}{s.replace,+,%20}{s.unescape.user});
                    $avp(from_outbound) = 1;
    #!ifdef WITH_DEBUG
                    xlog("L_DBG", "SMS from Outbound ($hu)\n");
                    xlog("L_DBG", "-------------------------------------\n");
                    xlog("L_DBG", "FROM $avp(from)\n");
                    xlog("L_DBG", "TO   $avp(to)\n");
                    xlog("L_DBG", "TEXT $avp(text)\n");
    #!endif
            if ($avp(to) == "491771782261")
                    $avp(to) = "494046895124";
            if ($avp(to) == "491771782319")
                    $avp(to) = "494034927220";

                    route(SMS);
            }

            xhttp_reply("200", "OK", "text/html", "<html><body>OK - [$si:$sp]</body></html>");
            }
    }

    ######################################################################
    # SMS to VoLTE Handsets
    ######################################################################
    route[SMS_TO_3GPP] {
    #!ifdef WITH_DEBUG
            xlog("L_DBG", "SMS to 3GPP/VoLTE\n");
            xlog("L_DBG", "-------------------------------------\n");
            xlog("L_DBG", "FROM $avp(from)\n");
            xlog("L_DBG", "TO   $avp(to)\n");
            xlog("L_DBG", "TEXT $avp(text)\n");
            xlog("L_DBG", "DCS  $avp(dcs)\n");
    #!endif

            // Construct a new SMS-Body:
            $rpdata(all) = $null;
            $rpdata(type) = 1; // RP-DATA: Network to UE
            $rpdata(reference) = $avp(id);
            $rpdata(originator) = $avp(from);
            $tpdu(type) = 4; // SMS-Deliver
            $tpdu(origen) = $avp(from); // The Destination becomes the originator of the SMS
            $tpdu(payload) = $avp(text);
            $tpdu(coding) = $avp(dcs);

            $uac_req(method) = "MESSAGE";
            $uac_req(ruri) = "sip:"+$avp(to)+"@"+DOMAIN;
            $uac_req(furi) = "sip:"+SMSC_SERVER;
            $uac_req(turi) = "sip:"+$avp(to)+"@"+DOMAIN;
            $uac_req(hdrs) = "Content-Type: application/vnd.3gpp.sms\r\nRequest-Disposition: no-fork\r\nAccept-Contact: *;+g.3gpp.smsip\r\nX-MSG-ID: "+$avp(id)+"\r\n";
            $uac_req(body) = $smsbody;
            $uac_req(evroute)=1;
            uac_req_send();
            # sql_query("sms", "delete from messages where id=$avp(id);");
    }

    ######################################################################
    # SMS to OTT-Handsets
    ######################################################################
    route[SMS_TO_SIP] {
    #!ifdef WITH_DEBUG
            xlog("L_DBG", "SMS to SIP/OTT\n");
            xlog("L_DBG", "-------------------------------------\n");
            xlog("L_DBG", "FROM $avp(from)\n");
            xlog("L_DBG", "TO   $avp(to)\n");
            xlog("L_DBG", "TEXT $avp(text)\n");
    #!endif

            $uac_req(method) = "MESSAGE";
            $uac_req(ruri) = "sip:"+$avp(to)+"@"+DOMAIN;
            $uac_req(furi) = "sip:+"+$avp(from)+"@"+DOMAIN;
            $uac_req(turi) = "sip:"+$avp(to)+"@"+DOMAIN;
            $uac_req(hdrs) = "Content-Type: text/plain\r\nX-MSG-ID: "+$avp(id)+"\r\n";
            $uac_req(evroute)=1;
            $uac_req(body) = $avp(text);

            uac_req_send();
    }

    ######################################################################
    # SMS to Outbound
    ######################################################################
    route[SMS_TO_OUTBOUND] {
    #!ifdef WITH_DEBUG
            xlog("L_DBG", "SMS to Outbound\n");
            xlog("L_DBG", "-------------------------------------\n");
            xlog("L_DBG", "FROM $avp(from)\n");
            xlog("L_DBG", "TO   $avp(to)\n");
            xlog("L_DBG", "TEXT $avp(text)\n");
    #!endif
            if ($avp(from_outbound) == 1) {
                    xlog("Not sending: FROM and TO Outbound!\n");
                    return 1;
                    exit;
            }
            if ($avp(from) == "494046895124")
                    $avp(from) = "491771782261";
            if ($avp(from) == "494034927220")
                    $avp(from) = "491771782319";

            http_client_query("https://rest.nexmo.com/sms/json?api_key=NEXMO_APIKEY&api_secret=NEXMO_APISECRET&from=$avp(from)&to=$avp(to)&text=$(avp(text){s.escape.user})", "$var(result)");
            if ($retcode != 200) return -1;
            json_get_field("$var(result)", "messages", "$var(messages)");
            json_get_field("$var(messages)", "status", "$var(status)");
            if ($var(status) != 0) return -1;
            return 1;
    }

    ######################################################################
    # SMS Handling
    ######################################################################
    route[SMS] {
    #!ifdef WITH_DEBUG
            xlog("L_DBG", "SMS-Task\n");
            xlog("L_DBG", "-------------------------------------\n");
            xlog("L_DBG", "FROM $avp(from)\n");
            xlog("L_DBG", "TO   $avp(to)\n");
            xlog("L_DBG", "TEXT $avp(text)\n");
            xlog("L_DBG", "DCS  $avp(dcs)\n");
    #!endif

            # Query ENUM: Local number?
            $var(enum) = "+"+$avp(to);
            if (!enum_pv_query("$var(enum)")) {
                    route(SMS_TO_OUTBOUND);
                    return $retcode;
            }
            if (sql_query("sms", "insert into messages (caller, callee, text, dcs, valid) values ('$(avp(from){s.escape.common})', '$(avp(to){s.escape.common})', '$(avp(text){s.escape.common})', $avp(dcs), now());"))
                    return 1;
            else
                    return -1;
    }

    ######################################################################
    # SMS Handling
    ######################################################################
    route[SMS_WORKER] {
            sql_query("sms", "select id, caller, callee, text, dcs from messages;", "q");
            if ($dbr(q=>rows) > 0) {
                    $var(i) = 0;
                    while ($var(i) < $dbr(q=>rows)) {
                            if ($sht(sms_retries=>$dbr(q=>[$var(i),0])) == $null) {
                                    $sht(sms_retries=>$dbr(q=>[$var(i),0])) = 0;
                            } else {
                                    $sht(sms_retries=>$dbr(q=>[$var(i),0])) = $sht(sms_retries=>$dbr(q=>[$var(i),0])) + 1;
                            }

                            if ($sht(sms_retries=>$dbr(q=>[$var(i),0])) > 2) {
                                    xlog("Dropping SMS [$dbr(q=>[$var(i),3])] TO $dbr(q=>[$var(i),2]) after 2 retries \n");
                                    sql_query("sms", "delete from messages where id=$dbr(q=>[$var(i),0]);");
                                    $sht(sms_retries=>$dbr(q=>[$var(i),0])) = $null;
                            } else {
                                    $avp(id) = $dbr(q=>[$var(i),0]);
                                    $avp(from) = $dbr(q=>[$var(i),1]);
                                    $avp(to) = $dbr(q=>[$var(i),2]);
                                    $avp(text) = $dbr(q=>[$var(i),3]);
                                    $avp(dcs) = $dbr(q=>[$var(i),4]);

                                    route(SEND_SMS);
    #!ifdef WITH_DEBUG
                                    xlog("L_DBG", "ID   $avp(id)\n");
                                    xlog("L_DBG", "FROM $avp(from)\n");
                                    xlog("L_DBG", "TO   $avp(to)\n");
                                    xlog("L_DBG", "TEXT $avp(text)\n");
                                    xlog("L_DBG", "DCS  $avp(dcs)\n");
    #!endif
                            }

                            $var(i) = $var(i) + 1;
                    }
            }
            sql_result_free("q");
    }

    route[NOTIFY] {
            if (has_body("application/reginfo+xml")) {
                    reginfo_handle_notify("location");
                    if ($rc == 2) {
                            # All contacts of the IMPU are de-registered
                            xnotice("All contacts de-registered for $fu\n");
                            $sht(publish_sent=>$fu) = $null;
                    }
                    # Send 202 Accepted response for all cases
                    send_reply("202", "Accepted");
            } else {
                    send_reply("503", "Invalid Content-Type");
            }
            exit;
    }

    route[SEND_SMS] {
            $var(uri) = "sip:"+$avp(to)+"@"+DOMAIN;

            if (reg_fetch_contacts("location", "$var(uri)", "caller")) {
                    $var(j) = 0;
                    $var(is3gpp) = 0;
                    while($var(j) < $(ulc(caller=>count))) {
                            $var(k) = 0;
                            while($var(k) < $(ulc(caller=>addr)[$var(j)]{param.count})) {
                                    if ($(ulc(caller=>addr)[$var(j)]{param.name,$var(k)}) == "+g.3gpp.smsip")
                                            $var(is3gpp) = 1;
                                    $var(k) = $var(k) + 1;
                            }
                            if ($var(is3gpp) == 1)
                                    route(SMS_TO_3GPP);
                            else
                                    route(SMS_TO_SIP);
                            $var(j) = $var(j) + 1;
                    }
            } else {
                    if ($sht(publish_sent=>$var(uri)) == $null) {
                            reginfo_subscribe("$var(uri)", "SUBSCRIBE_EXPIRE");
                            $sht(publish_sent=>$var(uri)) = 1;
                    }
            }
    }

    event_route [tm:local-request] {
            if (is_method("SUBSCRIBE")) {
                    append_hf("P-Asserted-Identity: $ru\r\n");
            }
    }

    event_route[uac:reply] {
            if (($uac_req(evtype) == 1) && ($uac_req(evcode) == 200) && ($uac_req(hdrs) != $null) && ($uac_req(hdrs) != "")) {
                    $var(msgid) = $(uac_req(hdrs){line.sw,X-MSG-ID:}{s.substr,10,0}{s.int});
                    sql_query("sms", "delete from messages where id=$var(msgid);");
            }
    }


---

apiVersion: v1
kind: ConfigMap
metadata:
  name: scscf-config
  namespace: {{ .Release.Namespace }}
data:
  scscf_init.sh: |
    #!/bin/bash
    
    # BSD 2-Clause License
    # Copyright (c) 2020, Supreeth Herle
    
    [ ${#MNC} == 3 ] && IMS_DOMAIN="ims.mnc${MNC}.mcc${MCC}.3gppnetwork.org" || IMS_DOMAIN="ims.mnc0${MNC}.mcc${MCC}.3gppnetwork.org"

    echo "SITE_ID=$SITE_ID"

    mkdir -p /etc/kamailio_scscf
    cp /mnt/scscf/scscf.cfg /etc/kamailio_scscf
    cp /mnt/scscf/scscf.xml /etc/kamailio_scscf
    cp /mnt/scscf/kamailio_scscf.cfg /etc/kamailio_scscf
    cp /mnt/scscf/CxDataType_Rel6.xsd /etc/kamailio_scscf
    cp /mnt/scscf/CxDataType_Rel7.xsd /etc/kamailio_scscf
    cp /mnt/scscf/CxDataType_Rel8.xsd /etc/kamailio_scscf
    cp /mnt/scscf/dispatcher.list /etc/kamailio_scscf
   
    while ! mysqladmin ping -h ${MYSQL_IP} --silent; do
        sleep 5;
    done

    sleep 10;

    export MYSQL_PWD="{{ .Values.secrets.mysql.rootPassword }}"

    mysql -u root -h ${MYSQL_IP} \
        -e "CREATE DATABASE IF NOT EXISTS scscf;" 2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} scscf \
        < /usr/local/src/kamailio/utils/kamctl/mysql/standard-create.sql \
        2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} scscf \
        < /usr/local/src/kamailio/utils/kamctl/mysql/presence-create.sql \
        2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} scscf \
        < /usr/local/src/kamailio/utils/kamctl/mysql/ims_usrloc_scscf-create.sql \
        2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} scscf \
        < /usr/local/src/kamailio/utils/kamctl/mysql/ims_dialog-create.sql \
        2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} scscf \
        < /usr/local/src/kamailio/utils/kamctl/mysql/ims_charging-create.sql \
        2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} \
        -e "CREATE USER IF NOT EXISTS 'scscf'@'%' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.ims.imsUserPassword }}';" \
        2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} \
        -e "CREATE USER IF NOT EXISTS 'scscf'@'$SCSCF_IP' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.ims.imsUserPassword }}';" \
        2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} \
        -e "GRANT ALL ON scscf.* TO 'scscf'@'%';" \
        2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} \
        -e "GRANT ALL ON scscf.* TO 'scscf'@'$SCSCF_IP';" \
        2>/dev/null || true

    mysql -u root -h ${MYSQL_IP} \
        -e "FLUSH PRIVILEGES;" \
        2>/dev/null || true

    unset MYSQL_PWD

    echo "SCSCF database initialization completed."
    # Populate the TimescaleDB tables 
    export PGPASSWORD="{{ .Values.secrets.timescaledb.password }}"
    psql -U {{ .Values.secrets.timescaledb.username }} -d {{ .Values.secrets.timescaledb.database }} -h ${TIMESCALEDB_IP} -p 5432 -f /usr/local/src/kamailio/utils/kamctl/postgres/statistics-create.sql 2>/dev/null || true
    psql -U {{ .Values.secrets.timescaledb.username }} -d {{ .Values.secrets.timescaledb.database }} -h ${TIMESCALEDB_IP} -p 5432 -f /usr/local/src/kamailio/utils/kamctl/postgres/standard-create.sql 2>/dev/null || true
    psql -U {{ .Values.secrets.timescaledb.username }} -d {{ .Values.secrets.timescaledb.database }} -h ${TIMESCALEDB_IP} -p 5432 -f /usr/local/src/kamailio/utils/kamctl/postgres/siptrace-scscf.sql 2>/dev/null || true

  
    export IMS_SLASH_DOMAIN=`echo $IMS_DOMAIN | sed 's/\./\\\./g'`

    unset MYSQL_PWD

    echo "${PYHSS_SERVICE_HOST} hss.${IMS_DOMAIN}" >> /etc/hosts
    
    sed -i 's|SCSCF_IP|'$SCSCF_IP'|g' /etc/kamailio_scscf/scscf.cfg
    sed -i 's|IMS_DOMAIN|'$IMS_DOMAIN'|g' /etc/kamailio_scscf/scscf.cfg
    sed -i 's|IMS_SLASH_DOMAIN|'$IMS_SLASH_DOMAIN'|g' /etc/kamailio_scscf/scscf.cfg
    sed -i 's|MYSQL_IP|'$MYSQL_IP'|g' /etc/kamailio_scscf/scscf.cfg
    
    sed -i 's|SCSCF_IP|'$SCSCF_IP'|g' /etc/kamailio_scscf/scscf.xml
    sed -i 's|IMS_DOMAIN|'$IMS_DOMAIN'|g' /etc/kamailio_scscf/scscf.xml
    sed -i 's|PYHSS_BIND_PORT|'$PYHSS_BIND_PORT'|g' /etc/kamailio_scscf/scscf.xml
    sed -i 's|SCSCF_BIND_PORT|'$SCSCF_BIND_PORT'|g' /etc/kamailio_scscf/scscf.xml
    sed -i 's|SITE_ID|'$SITE_ID'|g' /etc/kamailio_scscf/kamailio_scscf.cfg

    sed -i 's|TIMESCALEDB_IP|'$TIMESCALEDB_IP'|g' /etc/kamailio_scscf/kamailio_scscf.cfg
    
  # TODO: Add your other configuration files below
  scscf.cfg: |
    # SIP / UDP
    listen=udp:SCSCF_IP:6060
    # SIP / TCP
    listen=tcp:SCSCF_IP:6060
    # SIP / TCP/TLS
    #listen=tls:SCSCF_IP:6061

    #!define NETWORKNAME "IMS_DOMAIN"
    #!define NETWORKNAME_ESC "IMS_SLASH_DOMAIN"
    #!define HOSTNAME "scscf.IMS_DOMAIN"
    #!define HOSTNAME_ESC "scscf\.IMS_SLASH_DOMAIN"
    #!define URI "sip:scscf.IMS_DOMAIN:6060"

    #!subst "/NETWORKNAME/IMS_DOMAIN/"

    alias=scscf.IMS_DOMAIN

    # ENUM-Server to query:
    #!define ENUM_SUFFIX "IMS_DOMAIN."

    # SIP-Address of capturing node, if not set, capturing is disabled.
    #!define CAPTURE_NODE "sip:127.0.0.1:9060"

    # Connection URL for the database:
    # For use with a single database:
    #!define DB_URL "mysql://scscf:heslo@MYSQL_IP/scscf"

    # For use with DB_Cluster: con1 (primary), con2 (backup)
