apiVersion: v1
kind: ConfigMap

metadata:
  name: smf-config
  namespace: {{ .Release.Namespace }}
data:

  smf.yaml: |
    db_uri: mongodb://mongo:27017/niralos
    db_conn: host=TIMESCALEDB_IP port=5432 dbname={{ .Values.secrets.timescaledb.database }} user={{ .Values.secrets.timescaledb.username }} password={{ .Values.secrets.timescaledb.password }}

    logger:
        file: /niralos/install/var/log/niralos/smf.log

    statistic:
        file_stat:
          path: /niral_config/smf_stats_archive/smf_stat.log
          fetch_api_file_counter: 100
          max_strings_in_file: 10

    event:
        file_stat:
          event_trigger_file_counter: 10

    niral_developer_http:
        cp_server:
          disable: true
        cp_client:
          disable: true

    niral_developer_mhttp:
        core_server:
          disable: true

    sbi:
        server:
          no_tls: true
        client:
          no_tls: true

    global:
      max:
        ue: MAX_NUM_UE
      parameter:
          no_ipv4v6_local_addr_in_packet_filter: true

    smf:
        freeDiameter: /niralos/install/etc/freeDiameter/smf.conf

        sbi:
          server:
            - address: SMF_IP
              port: 7777
          client:
            nrf:
              - uri: http://niralos-nrf-1:7777
            scp:
              - uri: http://niralos-scp-1:7777

        default:
          tls:
            server:
              scheme: http
              private_key: /mnt/newtls/smf.key
              cert: /mnt/newtls/smf.crt
              verify_client: true
              verify_client_cacert: /mnt/newtls/ca.crt
            client:
