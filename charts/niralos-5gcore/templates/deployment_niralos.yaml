              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: NRF_IP
              value: {{ .Values.workloadEnv.nwdaf.NRF_IP | quote }}

          command:
            - /bin/bash
            - -c
            - |
              set -x

              mkdir -p /tmp

              cp /niral_config/yaml/nwdafcfg.yaml /tmp/nwdafcfg.yaml

              sed -i "s|__NWDAF_IP__|${NWDAF_IP}|g" /tmp/nwdafcfg.yaml
              sed -i "s|__NRF_IP__|${NRF_IP}|g" /tmp/nwdafcfg.yaml

              echo "========== GENERATED CONFIG =========="
              cat /tmp/nwdafcfg.yaml

              exec /install/bin/niralos-nwdafd \
                -nwdafcfg /tmp/nwdafcfg.yaml \
                -l /niral_config/log/nwdaf.log

          ports:
            - containerPort: 29600
              name: sbi

            - containerPort: 9090
              name: metrics

          volumeMounts:
            - name: nwdaf-config
              mountPath: /niral_config/yaml/nwdafcfg.yaml
              subPath: nwdafcfg.yaml

            - name: log-volume
              mountPath: /niral_config/log

      volumes:
        - name: nwdaf-config
          configMap:
            name: nwdaf-config

        - name: log-volume
          emptyDir: {}

      restartPolicy: Always

