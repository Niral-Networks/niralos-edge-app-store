apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: niralos-smf
  namespace: {{ .Release.Namespace }}
  labels:
    app: smf

spec:
  serviceName: niralos-smf-1

  replicas: {{ .Values.replicas.smf }}
  ordinals:
    start: 1

  selector:
    matchLabels:
      app: smf

  template:
    metadata:
      labels:
        app: smf
    spec:

      imagePullSecrets:
      - name: dockerhub-secret

      containers:
      - name: smf

        image: {{ .Values.images.smf | quote }}
        imagePullPolicy: IfNotPresent

        command:
          - /bin/bash
          - -c
          - |
            /mnt/smf/smf_init.sh
            exec /niralos/install/bin/niralos-smfd

        envFrom:
        - configMapRef:
            name: core-env

        env:
        - name: SMF_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        ports:

        - containerPort: 7777
          name: sbi

        - containerPort: 2123
          name: gtpc
          protocol: UDP

        - containerPort: 8805
          name: pfcp
          protocol: UDP

        - containerPort: 9091
          name: metrics

        volumeMounts:

        - name: smf-config
          mountPath: /mnt/smf
          readOnly: true

        - name: log-volume
          mountPath: /niralos/install/var/log/niralos

        - name: core-dump
          mountPath: /mnt/core_dump

      volumes:

      - name: smf-config
        configMap:
          name: smf-config
          defaultMode: 0755

      - name: log-volume
        emptyDir: {}

      - name: core-dump
        emptyDir: {}


---

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: niralos-upf
  namespace: {{ .Release.Namespace }}
  labels:
    app: upf

spec:
  serviceName: niralos-upf-1

  replicas: {{ .Values.replicas.upf }}
  ordinals:
    start: 1

  selector:
    matchLabels:
      app: upf

  template:
    metadata:
      labels:
        app: upf
{{- if .Values.networking.attachments.upf.enabled }}
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name":"{{ .Values.networking.attachments.upf.name }}",
            "ips":["{{ .Values.networking.attachments.upf.ips }}"]
          }]
{{- end }}
    spec:

      imagePullSecrets:
      - name: dockerhub-secret

      containers:
      - name: upf

        image: {{ .Values.images.upf | quote }}
        imagePullPolicy: IfNotPresent

        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN

        command:
          - /bin/bash

        args:
          - /mnt/upf/upf_init.sh

        envFrom:
        - configMapRef:
            name: core-env

        env:
        - name: UPF_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        - name: UPF_ADVERTISE_IP
          value: {{ .Values.workloadEnv.upf.UPF_ADVERTISE_IP | quote }}

        - name: COMPONENT_NAME
          value: {{ .Values.workloadEnv.upf.COMPONENT_NAME | quote }}

        - name: CORE_PATTERN
          value: {{ .Values.workloadEnv.upf.CORE_PATTERN | quote }}

        ports:
        - containerPort: 2152
          protocol: UDP

        - containerPort: 8805
          protocol: UDP

        - containerPort: 9190

        - containerPort: 9191

        volumeMounts:
        - name: upf-config
          mountPath: /mnt/upf

        - name: logs
          mountPath: /niralos/install/var/log/niralos

        - name: core-dumps
          mountPath: /mnt/core_dump

      volumes:
      - name: upf-config
        configMap:
          name: upf-config
          defaultMode: 0777

      - name: logs
        hostPath:
          path: {{ (index .Values.storage.hostPaths "niralos-upf.logs").path }}
          type: {{ (index .Values.storage.hostPaths "niralos-upf.logs").type }}

      - name: core-dumps
        hostPath:
          path: {{ (index .Values.storage.hostPaths "niralos-upf.core-dumps").path }}
          type: {{ (index .Values.storage.hostPaths "niralos-upf.logs").type }}

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: niralos-chf
  namespace: {{ .Release.Namespace }}
  labels:
    app: chf

spec:
  serviceName: chf-service

  replicas: {{ .Values.replicas.chf }}
  ordinals:
    start: 1
  selector:
    matchLabels:
      app: chf

  template:
    metadata:
      labels:
        app: chf

    spec:
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: dockerhub-secret

      containers:
      - name: chf
        image: {{ .Values.images.chf | quote }} #Update with your specific tag if needed
        imagePullPolicy: IfNotPresent

        command:
          - /bin/sh
          - -c
          - |
            /mnt/chf/chf_init.sh
            ulimit -c unlimited
            exec /niralos-chf/chf -c /chf/chfcfg.yaml

        envFrom:
        - configMapRef:
            name: core-env

        env:
        # Dynamically pull the internal Kubernetes Pod IP
        - name: CHF_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        # Point directly to the internal Kubernetes Service name for NRF
        - name: NRF_IP
          value: {{ .Values.workloadEnv.chf.NRF_IP | quote }}

        - name: COMPONENT_NAME
          value: {{ .Values.workloadEnv.chf.COMPONENT_NAME | quote }}

        - name: CORE_PATTERN
          value: {{ .Values.workloadEnv.chf.CORE_PATTERN | quote }}

        ports:
        - containerPort: 8000
          protocol: TCP
        - containerPort: 3868
          protocol: TCP
        - containerPort: 3869
          protocol: TCP
        - containerPort: 2121
          protocol: TCP
        - containerPort: 2122
          protocol: TCP

        volumeMounts:
        - name: chf-config
          mountPath: /mnt/chf
          readOnly: true

        - name: chf-certs
          mountPath: /chf/cert
          readOnly: true

        - name: chf-log
          mountPath: /chf/log

      volumes:
      - name: chf-config
        configMap:
          name: chf-config
          defaultMode: 0755

      - name: chf-certs
        secret:
          secretName: chf-tls

      - name: chf-log
        emptyDir: {}


---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: niralos-nwdaf
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: nwdaf-service

  replicas: {{ .Values.replicas.nwdaf }}
  ordinals:
    start: 1
  selector:
    matchLabels:
      app: nwdaf

  template:
