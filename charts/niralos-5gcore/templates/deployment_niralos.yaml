apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  annotations:
    helm.sh/resource-policy: keep
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ (index .Values.storage.pvcs "minio-data").storageClass }}
  resources:
    requests:
      storage: {{ (index .Values.storage.pvcs "minio-data").size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas.minio }}
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      serviceAccountName: niralos-k8s-reader
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: minio
          image: {{ .Values.images.minio | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/minio
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
              hostPort: 9000
            - name: console
              containerPort: 9001
              hostPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.workloadEnv.minio.MINIO_ROOT_USER | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.secrets.minio.rootPassword | quote }}
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
---
apiVersion: v1
