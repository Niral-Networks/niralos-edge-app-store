metadata:
  name: niralos-nef
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: nef-service

  replicas: {{ .Values.replicas.nef }}
  ordinals:
    start: 1

  selector:
    matchLabels:
      app: nef

  template:
    metadata:
      labels:
        app: nef

    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: nef
          image: {{ .Values.images.nef | quote }}

          securityContext:
            privileged: true

          env:
            - name: COMPONENT_NAME
              value: {{ .Values.workloadEnv.nef.COMPONENT_NAME | quote }}

            - name: CORE_PATTERN
              value: {{ .Values.workloadEnv.nef.CORE_PATTERN | quote }}

            - name: NEF_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          ports:
            - containerPort: 29599
              protocol: TCP

          command:
            - /bin/bash
            - -c
            - |
              ulimit -c unlimited
              sleep 20

              cp /mnt/nef/nefcfg.yaml /tmp/nefcfg.yaml

              sed -i "s/__NEF_IP__/${NEF_IP}/g" /tmp/nefcfg.yaml

              echo "===== GENERATED CONFIG ====="
              cat /tmp/nefcfg.yaml

              exec /install/bin/niralos-nefd \
                --nefcfg /tmp/nefcfg.yaml \
                -l /niral_config/log/nef.log

          volumeMounts:
            - name: nef-config
              mountPath: /mnt/nef

            - name: niral-config
              mountPath: /niral_config

      volumes:
        - name: nef-config
          configMap:
            name: nef-config

        - name: niral-config
          hostPath:
            path: {{ (index .Values.storage.hostPaths "niralos-nef.niral-config").path }}

