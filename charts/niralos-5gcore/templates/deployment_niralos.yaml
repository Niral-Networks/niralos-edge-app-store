apiVersion: v1
kind: ConfigMap
metadata:
  name: niralos-sdn-backup-script
  namespace: {{ .Release.Namespace }}
data:
  backup_timescale.sh: |
    #!/bin/bash
      ################################################################################
      # TimescaleDB TRUE Incremental Backup Script (Timestamp-based)
      # Safe for high-frequency inserts (every few seconds)
      ################################################################################

      set -euo pipefail

      # ----------------------------- Configuration ----------------------------------
      DB_HOST="${DB_HOST:-timescaledb}"
      DB_PORT="${DB_PORT:-5432}"
      DB_NAME="${DB_NAME:-timescale_db}"
      DB_USER="${DB_USER:-timescale_user}"
      DB_PASSWORD="${DB_PASSWORD:-{{ .Values.secrets.timescaledb.password }}}"

      BACKUP_ROOT="${BACKUP_ROOT:-/backups/timescale}"

      # ------------------------------- Colors ---------------------------------------
      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      BLUE='\033[0;34m'
      NC='\033[0m'

      # ------------------------------- Logging --------------------------------------
      log() {
          local level="$1"; shift
          local msg="$*"
          local ts
          ts=$(date '+%Y-%m-%d %H:%M:%S')

          case "$level" in
              INFO)    echo -e "${BLUE}[INFO]${NC}    $ts - $msg" ;;
              SUCCESS) echo -e "${GREEN}[SUCCESS]${NC} $ts - $msg" ;;
              WARN)    echo -e "${YELLOW}[WARN]${NC}    $ts - $msg" ;;
              ERROR)   echo -e "${RED}[ERROR]${NC}   $ts - $msg" ;;
          esac
      }

      # ----------------------------- SQL Helper -------------------------------------
      exec_sql() {
          PGPASSWORD="$DB_PASSWORD" psql \
              -h "$DB_HOST" \
              -p "$DB_PORT" \
              -U "$DB_USER" \
              -d "$DB_NAME" \
              -t -A -q \
              -c "$1"
      }
      backup_metadata_full() {

          local table="$1"

          log INFO "Starting FULL backup for $table"

          year=$(date +%Y)
          month=$(date +%m)
          day=$(date +%Y-%m-%d)
          time=$(date +%H-%M-%S)

          target_dir="$BACKUP_ROOT/$table/$year/$month"
          mkdir -p "$target_dir"

          backup_file="$target_dir/${table}_${day}_${time}.csv.gz"

          log INFO "Writing FULL backup file: $(basename "$backup_file")"

          PGPASSWORD="$DB_PASSWORD" psql \
              -h "$DB_HOST" \
              -p "$DB_PORT" \
              -U "$DB_USER" \
              -d "$DB_NAME" \
              -q \
              -c "\copy public.$table TO STDOUT WITH CSV HEADER" \
          | gzip > "$backup_file"

          row_count=$(zcat "$backup_file" | tail -n +2 | wc -l | tr -d ' ')
          row_count=$((row_count + 0))

          if [[ $row_count -eq 0 ]]; then
              log WARN "No rows written for $table"
              rm -f "$backup_file"
              return
          fi

          log SUCCESS "Backed up $row_count rows for $table (FULL)"
      }

      get_last_backup_time() {
          exec_sql "
              SELECT COALESCE(
                  to_char(
                      NULLIF(last_backup_time::text, '')::timestamptz AT TIME ZONE 'UTC',
                      'YYYY-MM-DD HH24:MI:SS'
                  ),
                  '1970-01-01 00:00:00'
              )
              FROM backup_metadata
              WHERE db_type='timescale'
                AND entity_name='$1';
          "
      }


      get_max_timestamp() {
          exec_sql "
              SELECT COALESCE(
                  to_char(
                      MAX($2::timestamptz) AT TIME ZONE 'UTC',
                      'YYYY-MM-DD HH24:MI:SS'
                  ),
                  '1970-01-01 00:00:00'
              )
              FROM public.$1;
          "
      }


      # ------------------------ Timestamp Column Helper -----------------------------
      get_timestamp_column() {
          exec_sql "
              SELECT timestamp_column
              FROM backup_metadata
              WHERE db_type='timescale'
                AND entity_name='$1';
          "
      }

      set_backup_status() {
          exec_sql "
              UPDATE backup_metadata
              SET backup_status='$2', updated_at=NOW()
              WHERE db_type='timescale'
                AND entity_name='$1';
          "
      }

      update_backup_metadata() {
          exec_sql "
              UPDATE backup_metadata
              SET last_backup_time='$2',
                  backup_status='completed',
                  last_backup_path='$3',
                  total_rows_backed_up = total_rows_backed_up + $4,
                  updated_at=NOW()
              WHERE db_type='timescale'
                AND entity_name='$1';
          "
      }

      get_effective_timestamp_column() {
          local table="$1"

          # Check for `timestamp`
          local col
          col=$(exec_sql "
              SELECT column_name
              FROM information_schema.columns
              WHERE table_schema='public'
                AND table_name='$table'
                AND column_name='timestamp';
          ")

          if [[ -n "$col" ]]; then
              echo "timestamp"
              return
          fi

          # Check for `time_stamp`
          col=$(exec_sql "
              SELECT column_name
              FROM information_schema.columns
              WHERE table_schema='public'
                AND table_name='$table'
                AND column_name='time_stamp';
          ")


          if [[ -n "$col" ]]; then
              echo "time_stamp"
              return
          fi


      # ✅ NEW: Check for `date_time`
          col=$(exec_sql "
              SELECT column_name
              FROM information_schema.columns
              WHERE table_schema='public'
                AND table_name='$table'
                AND column_name='date_time';
          ")

          if [[ -n "$col" ]]; then
              echo "date_time"
              return
          fi

          log ERROR "No timestamp column found for table '$table' (expected timestamp or time_stamp)"
          exit 1
      }

      # -------------------- Incremental Backup (Timestamp Range) --------------------
      backup_table_incremental() {

          local table="$1"

          if [[ "$table" == "backup_metadata" ]]; then
              backup_metadata_full "$table"
              return
          fi
          log INFO "Starting incremental backup for $table"
          set_backup_status "$table" "in_progress"

          # Get the effective timestamp column for this table
          local ts_column
          ts_column=$(get_effective_timestamp_column "$table")
          log INFO "Using timestamp column: $ts_column"

          local last_ts max_ts
          last_ts=$(get_last_backup_time "$table")
          [[ -z "$last_ts" ]] && last_ts="1970-01-01 00:00:00"
          max_ts=$(get_max_timestamp "$table" "$ts_column")

          log INFO "Last backup time: $last_ts"
          log INFO "Max timestamp:     $max_ts"

          if [[ "$last_ts" == "$max_ts" ]]; then
              log INFO "No new data for $table"
              set_backup_status "$table" "completed"
              return
          fi

          # Derive date parts from max_ts
          year=$(date -d "$max_ts" +%Y)
          month=$(date -d "$max_ts" +%m)
          day=$(date -d "$max_ts" +%Y-%m-%d)
          time=$(date -d "$max_ts" +%H-%M-%S)

          target_dir="$BACKUP_ROOT/$table/$year/$month"
          mkdir -p "$target_dir"

      #    backup_file="$target_dir/${table}_${day}_${time}.csv"
      backup_file="$target_dir/${table}_${day}_${time}.csv.gz"

          log INFO "Writing backup file: $(basename "$backup_file")"

      PGPASSWORD="$DB_PASSWORD" psql \
          -h "$DB_HOST" \
          -p "$DB_PORT" \
          -U "$DB_USER" \
          -d "$DB_NAME" \
          -q \
          -c "\copy (
              SELECT *
              FROM public.$table
              WHERE $ts_column > '$last_ts'
                AND $ts_column <= '$max_ts'
              ORDER BY $ts_column
          ) TO STDOUT WITH CSV HEADER" \
      | gzip > "$backup_file"

      #    row_count=$(tail -n +2 "$backup_file" | wc -l | tr -d ' ')
      row_count=$(zcat "$backup_file" | tail -n +2 | wc -l | tr -d ' ')
          row_count=$((row_count + 0))

          if [[ $row_count -eq 0 ]]; then
              log WARN "No rows written for $table"
              rm -f "$backup_file"
              set_backup_status "$table" "completed"
              return
          fi

          update_backup_metadata "$table" "$max_ts" "$target_dir" "$row_count"
          log SUCCESS "Backed up $row_count rows for $table"
      }

      # ------------------------- Backup All Tables ----------------------------------
      backup_all_tables() {
          log INFO "Starting backup for all tables"

          tables=$(exec_sql "
              SELECT entity_name
              FROM backup_metadata
              WHERE db_type='timescale';
          ")


          for t in $tables; do
          if ! backup_table_incremental "$t"; then
              log WARN "Skipping failed table: $t"
          fi
          echo
      done

          log SUCCESS "All backups completed"
      }

      # ------------------------------- Main -----------------------------------------
      usage() {
          echo "Usage:"
          echo "  $0 backup <table>"
          echo "  $0 backup-all"
      }

      main() {
          case "${1:-}" in
              backup)
                  [[ -z "${2:-}" ]] && usage && exit 1
                  backup_table_incremental "$2"
                  ;;
              backup-all)
                  backup_all_tables
                  ;;
              *)
                  usage
                  ;;
          esac
      }
    main "$@"
---
