            - name: PCRF_IP
              value: {{ .Values.workloadEnv.dns.PCRF_IP | quote }}
            - name: ICSCF_IP
              value: {{ .Values.workloadEnv.dns.ICSCF_IP | quote }}
            - name: ICSCF_BIND_PORT
              value: {{ .Values.workloadEnv.dns.ICSCF_BIND_PORT | quote }}
            - name: PYHSS_IP
              value: {{ .Values.workloadEnv.dns.PYHSS_IP | quote }}
            - name: PYHSS_BIND_PORT
              value: {{ .Values.workloadEnv.dns.PYHSS_BIND_PORT | quote }}
            - name: SCSCF_IP
              value: {{ .Values.workloadEnv.dns.SCSCF_IP | quote }}
            - name: SCSCF_BIND_PORT
              value: {{ .Values.workloadEnv.dns.SCSCF_BIND_PORT | quote }}
            - name: PCSCF_IP
              value: {{ .Values.workloadEnv.dns.PCSCF_IP | quote }}
            - name: PCSCF_BIND_PORT
              value: {{ .Values.workloadEnv.dns.PCSCF_BIND_PORT | quote }}
            - name: SMSC_IP
              value: {{ .Values.workloadEnv.dns.SMSC_IP | quote }}
            - name: SMSC_BIND_PORT
              value: {{ .Values.workloadEnv.dns.SMSC_BIND_PORT | quote }}
            - name: RTPENGINE_IP
              value: {{ .Values.workloadEnv.dns.RTPENGINE_IP | quote }}
            - name: MYSQL_IP
              value: {{ .Values.workloadEnv.dns.MYSQL_IP | quote }}
            - name: MYSQL_PORT
              value: {{ .Values.workloadEnv.dns.MYSQL_PORT | quote }}

          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP

            - name: dns-tcp
              containerPort: 53
              protocol: TCP

          volumeMounts:
            - name: dns-config
              mountPath: /mnt/dns
              readOnly: true

            - name: timezone
              mountPath: /etc/timezone
              readOnly: true

            - name: localtime
              mountPath: /etc/localtime
              readOnly: true

      volumes:
        - name: dns-config
          configMap:
            name: dns-config
            defaultMode: 0755

        - name: timezone
