apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-script
  namespace: {{ .Release.Namespace }}
data:
  mysql-init.sh: |
    #!/bin/bash
    set -e

    if [ -d /var/lib/mysql/mysql ]; then
      echo "Existing MySQL data directory found. Skipping initialization."
      chown -R mysql:mysql /var/lib/mysql
      exit 0
    fi

    echo "No existing MySQL data directory found. Initializing fresh datadir..."
    chown -R mysql:mysql /var/lib/mysql
    mysqld --initialize-insecure --user=mysql --datadir=/var/lib/mysql

    echo "Starting mysqld temporarily (local socket only) to create users..."
    mysqld --user=mysql --datadir=/var/lib/mysql       --skip-networking       --socket=/tmp/init.sock       --pid-file=/tmp/init.pid &

    for i in $(seq 1 30); do
      if mysqladmin --socket=/tmp/init.sock -uroot ping --silent 2>/dev/null; then
        break
      fi
      sleep 1
    done

    echo "Creating application users and setting root passwords..."
    mysql --socket=/tmp/init.sock -uroot <<-EOSQL
      ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.mysql.rootPassword }}';
      CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED WITH mysql_native_password BY '{{ .Values.secrets.mysql.rootPassword }}';
      GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
      FLUSH PRIVILEGES;
    EOSQL

    echo "Shutting down temporary mysqld..."
    mysqladmin --socket=/tmp/init.sock -uroot -p{{ .Values.secrets.mysql.rootPassword }} shutdown

    for i in $(seq 1 30); do
      if [ ! -f /tmp/init.pid ]; then
        break
      fi
      sleep 1
    done

    echo "Initialization complete."
---
