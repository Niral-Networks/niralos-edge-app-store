apiVersion: v1
kind: ConfigMap
metadata:
  name: niralos-sdn-application-config
  namespace: {{ .Release.Namespace }}
data:
  application.properties: |
    server.port=8082

    # Allow multiple origins
    cors.allowed-origins=http://192.168.0.17:30000,http://localhost:30000,http://127.0.0.1:30000,http://192.168.0.17:8082

    # Mysql Configuration
    # Spring JPA
    # MySQL
    spring.datasource.mysql.jdbc-url=jdbc:mysql://mysql:3306/backend_db?allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    spring.datasource.mysql.username=root
    spring.datasource.mysql.password={{ .Values.secrets.mysql.rootPassword }}
    spring.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

    # PostgreSQL Timescale
    spring.datasource.timescale.jdbc-url=jdbc:postgresql://timescaledb:5432/timescale_db
    spring.datasource.timescale.username={{ .Values.secrets.timescaledb.username }}
    spring.datasource.timescale.password={{ .Values.secrets.timescaledb.password }}
    spring.datasource.timescale.driver-class-name=org.postgresql.Driver

    # Mongo Database Configuration
    spring.data.mongodb.uri=mongodb://mongo:27017/niralos

    # Hibernate Configuration
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=false
    spring.jpa.properties.hibernate.format_sql=true
    spring.thymeleaf.check-template-location=false
    spring.jpa.open-in-view=false
    spring.datasource.tomcat.test-while-idle=true
    spring.datasource.tomcat.time-between-eviction-runs-millis=1800000
    spring.datasource.tomcat.validation-query=SELECT 1

    # Enable Swagger UI
    springfox.documentation.swagger-ui.enabled=true
    spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

    # Jwt Configuration
    jwt.expirationDateInMs=24000000
    jwt.refreshExpirationDateInMs=26297460
    jwt.secret={{ .Values.secrets.sdn.jwtSecret }}
    spring.datasource.initialization-mode=always

    # Wireshark Agent
    WireShark.Agent.IP=192.168.0.17
    WireShark.Agent.PORT=8056

    # Wireshark Controller
    WireShark.Controller.IP=192.168.0.17
    WireShark.Controller.Port=8082

    # File size configuration
    spring.servlet.multipart.enabled=true
    spring.servlet.multipart.max-file-size=25GB
    spring.servlet.multipart.max-request-size=25GB

    # Docker engine API communication
    docker.engine.ip=192.168.0.17
    docker.engine.port=2375
    docker.engine.api.version=v1.46

    # VM credentials
    vm.username={{ .Values.secrets.sdn.vmUsername }}
    vm.password={{ .Values.secrets.sdn.vmPassword }}

    # Non Docker UPF communication
    upf.data.fetch.mode=interface
    upf.ip.list=localhost
    upf.port=9090

    # vonR IP and Port Configuration
    fivegcore.vonr.ipconfiguration=192.168.0.17
    fivegcore.vonr.portconfiguration=30084

    # Spring Boot Thymeleaf
    spring.thymeleaf.prefix=classpath:/templates/
    spring.thymeleaf.suffix=.html
    spring.thymeleaf.mode=HTML
    spring.thymeleaf.encoding=UTF-8
    spring.thymeleaf.cache=false

    # Spring Boot Thymeleaf Login Portal
    api.base.ip=localhost
    api.base.port=8082

    # NWDAF IP and Port
    nef.ip=localhost
    nef.port=29599

    # DHCP configuration
    smf.config.file.path=/home/user/Downloads/smf.yaml
    upf.config.file.path=/home/user/Downloads/upf.yaml
    dscp.script.file.path=/home/user/niralos-docker-build-deploy-staging/interface_swap.sh

    scheduler.callExternalApi.enabled=true

    # 5G CORE API protocol
    fivegcoreProtocol=http://

    # Keycloak URLs
    spring.security.oauth2.resourceserver.jwt.issuer-uri=http://192.168.0.17:8085/realms/master

    # Keycloak realm and client
    keycloak.realm=master
    keycloak.resource=niralos-edge-client

    # Keycloak server
    keycloak.server-url=http://192.168.0.17:8085
    keycloak.admin-username={{ .Values.secrets.keycloak.bootstrapAdminUsername }}
    keycloak.admin-password={{ .Values.secrets.keycloak.bootstrapAdminPassword }}

    # Minio
    minio.endpoint=http://192.168.0.17:9000
    minio.access-key={{ .Values.secrets.minio.rootUser }}
    minio.secret-key={{ .Values.secrets.minio.rootPassword }}
    minio.bucket-name=sdn-profile-images

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: niralos-sdn-env-config
  namespace: {{ .Release.Namespace }}
data:
  env.js: |
    window.env = {
      "REACT_APP_BACKEND_IP":"http://192.168.0.17:30082",
      "REACT_APP_CONTAINER_IP":"http://localhost:8080",
      "REACT_APP_EDGE_IP":"192.168.0.123",
      "REACT_APP_EXTERNAL_IP":"http://localhost",
      "REACT_APP_EXTERNAL_PORT":"3002",
      "REACT_APP_EDGE_ENABLED":false,
      "REACT_APP_OPEN_MAP_IP":"http://localhost:3000/",
      "REACT_APP_AI_IP":"http://192.168.0.180:5000/"
    }
---
apiVersion: v1
kind: Service
metadata:
  name: niralos-sdn
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: niralos-sdn
  ports:
    - name: api
      port: 8082
      targetPort: 8082
      nodePort: 30082
    - name: ui
      port: 3000
      targetPort: 3000
      nodePort: 30000
  type: NodePort

---
# ==========================================
# ServiceAccount for Niralos SDN
# ==========================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: niralos-k8s-reader
  namespace: {{ .Release.Namespace }}
---
# ==========================================
# Allow Spring Boot to read Pods
# in the niralos namespace
# ==========================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: niralos-k8s-pod-reader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      # NEW: Kubernetes Metrics API permissions
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
# ==========================================
# Connect ServiceAccount to Role
# ==========================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: niralos-k8s-pod-reader-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: niralos-k8s-reader
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: niralos-k8s-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: niralos-sdn
  namespace: {{ .Release.Namespace }}
  labels:
    app: niralos-sdn
spec:
  replicas: {{ .Values.replicas.sdn }}
  selector:
    matchLabels:
      app: niralos-sdn
  template:
    metadata:
      labels:
        app: niralos-sdn
    spec:
      serviceAccountName: niralos-k8s-reader
      imagePullSecrets:
        - name: dockerhub-secret
      initContainers:
        - name: wait-for-dependencies
          image: {{ .Values.images.busybox | default "busybox:1.36" | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "======================================"
              echo "Waiting for Niralos dependencies..."
              echo "======================================"

              echo "Waiting for MySQL..."
              until nc -z mysql 3306; do
                echo "MySQL is not ready..."
                sleep 2
              done
              echo "MySQL is ready."

              echo "Waiting for MongoDB..."
              until nc -z mongo 27017; do
                echo "MongoDB is not ready..."
                sleep 2
              done
              echo "MongoDB is ready."

              echo "Waiting for PostgreSQL..."
              until nc -z postgres 5432; do
                echo "PostgreSQL is not ready..."
                sleep 2
              done
              echo "PostgreSQL is ready."

              echo "Waiting for TimescaleDB..."
              until nc -z timescaledb 5432; do
                echo "TimescaleDB is not ready..."
                sleep 2
              done
              echo "TimescaleDB is ready."

              echo "Waiting for MinIO..."
              until nc -z minio 9000; do
                echo "MinIO is not ready..."
                sleep 2
              done
              echo "MinIO is ready."

              echo "Waiting for Keycloak..."
              until nc -z keycloak 8085; do
                echo "Keycloak is not ready..."
                sleep 2
              done
              echo "Keycloak is ready."

              echo "======================================"
              echo "All dependencies are ready."
              echo "Starting Niralos SDN..."
              echo "======================================" 
              
              
      containers:
        - name: controller
          image: {{ .Values.images.sdn | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: api
            - containerPort: 3000
              name: ui
          volumeMounts:
            - name: sdn-application-config
              mountPath: /niral_config/configuration/niralos-sdn/application.properties
              subPath: application.properties
              readOnly: true

            - name: sdn-env-config
              mountPath: /binary/build/env.js
              subPath: env.js
              readOnly: true

            - name: niral-logs
              mountPath: /app/logs
            # Install.uuid in PersistentVolumeClaim to persist across pod restarts
            - name: niralos-config-data
              mountPath: /niral_config

            - name: backup-script
              mountPath: /usr/local/bin/backup_timescale.sh
              subPath: backup_timescale.sh
              readOnly: true

            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
          readinessProbe:
            httpGet:
              path: /v2/health/localsdn
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/health/localsdn
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
      - name: sdn-application-config
        configMap:
          name: niralos-sdn-application-config

      - name: sdn-env-config
        configMap:
          name: niralos-sdn-env-config

      # Install.uuid in PersistentVolumeClaim to persist across pod restarts
      - name: niralos-config-data
        persistentVolumeClaim:
          claimName: niralos-config-data    

      - name: niral-logs
        hostPath:
          path: {{ (index .Values.storage.hostPaths "niralos-sdn.niral-logs").path }}
          type: {{ (index .Values.storage.hostPaths "niralos-sdn.niral-logs").type }}

      - name: backup-script
        configMap:
          name: niralos-sdn-backup-script
          defaultMode: 0755

      - name: machine-id
        hostPath:
          path: {{ (index .Values.storage.hostPaths "niralos-sdn.machine-id").path }}
          type: {{ (index .Values.storage.hostPaths "niralos-sdn.machine-id").type }}
