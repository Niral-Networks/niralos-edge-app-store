apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: niralos-nrf
  namespace: {{ .Release.Namespace }}
  labels:
    app: nrf


spec:
  serviceName: niralos-nrf-1

  replicas: {{ .Values.replicas.nrf }}
  ordinals:
    start: 1

  selector:
    matchLabels:
      app: nrf


  template:

    metadata:
      labels:
        app: nrf


    spec:

      imagePullSecrets:
        - name: dockerhub-secret


      containers:

        - name: nrf

          image: {{ .Values.images.nrf | quote }}

          imagePullPolicy: IfNotPresent


          # --------------------------------------------------
          # Start NRF
          # --------------------------------------------------

          command:
            - /bin/bash
            - -c
            - |
              /mnt/nrf/nrf_init.sh
              exec /niralos/install/bin/niralos-nrfd


          # --------------------------------------------------
          # Environment variables from core-env ConfigMap
          # --------------------------------------------------

          envFrom:

            - configMapRef:
                name: core-env


          # --------------------------------------------------
          # NRF specific environment variables
          # --------------------------------------------------

          env:

            - name: COMPONENT_NAME
              value: {{ .Values.workloadEnv.nrf.COMPONENT_NAME | quote }}

            - name: NRF_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP


          # --------------------------------------------------
          # Container ports
          # --------------------------------------------------

          ports:

            - containerPort: 7777
              name: sbi
              protocol: TCP

            - containerPort: 9090
              name: metrics
              protocol: TCP


          # --------------------------------------------------
          # Volume mounts
          # --------------------------------------------------

          volumeMounts:

            - name: nrf-config
              mountPath: /mnt/nrf
              readOnly: true

            - name: log-volume
              mountPath: /niralos/install/var/log/niralos

            - name: core-dump
              mountPath: /mnt/core_dump


      # ------------------------------------------------------
      # Volumes
      # ------------------------------------------------------

      volumes:

        - name: nrf-config
          configMap:
            name: nrf-config
            defaultMode: 0755

        - name: log-volume
          emptyDir: {}

        - name: core-dump
          emptyDir: {}

---

