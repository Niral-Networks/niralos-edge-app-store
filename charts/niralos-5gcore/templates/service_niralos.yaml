{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
{{ toYaml $svc.selector | indent 4 }}
{{- if $svc.externalIPs }}
  externalIPs:
{{ toYaml $svc.externalIPs | indent 4 }}
{{- end }}
  ports:
{{- range $p := $svc.ports }}
    - name: {{ $p.name }}
      port: {{ $p.port }}
      targetPort: {{ $p.targetPort }}
{{- if $p.protocol }}
      protocol: {{ $p.protocol }}
{{- end }}
{{- if $p.nodePort }}
      nodePort: {{ $p.nodePort }}
{{- end }}
{{- end }}
{{- if $svc.type }}
  type: {{ $svc.type }}
{{- end }}
{{- end }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Values.networking.attachments.upf.name }}
  namespace: {{ .Release.Namespace }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "{{ .Values.networking.macvlan.master }}",
      "mode": "{{ .Values.networking.macvlan.mode }}",
      "ipam": {
        "type": "static"
      }
    }
