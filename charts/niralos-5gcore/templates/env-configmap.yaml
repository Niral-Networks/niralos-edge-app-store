apiVersion: v1
kind: ConfigMap
metadata:
  name: core-env
  namespace: {{ .Release.Namespace }}
data:
{{- if and .Values.coreNetwork.plmn .Values.coreNetwork.plmn.mcc }}
  MCC: {{ .Values.coreNetwork.plmn.mcc | quote }}
  MNC: {{ .Values.coreNetwork.plmn.mnc | quote }}
{{- else if and .Values.coreNetwork.plmnList (index .Values.coreNetwork.plmnList 0) }}
  MCC: {{ (index .Values.coreNetwork.plmnList 0).mcc | quote }}
  MNC: {{ (index .Values.coreNetwork.plmnList 0).mnc | quote }}
{{- else }}
  MCC: "001"
  MNC: "01"
{{- end }}
{{- range $key, $value := .Values.coreEnv }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
